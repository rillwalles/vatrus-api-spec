        facility: { type: string, nullable: true, description: "XML_ID значения списочного свойства FACILITY, например TWR/APP/DEP/CTR/GND" }
        tier: { type: string, nullable: true, description: "XML_ID значения списочного свойства TIER. Ключ всегда присутствует (null, если не заполнено) — в отличие от AirportDetail.positions[].tier, где ключ опционален" }
        airports: { type: array, items: { type: string }, description: "ICAO-коды привязанных аэропортов" }

    SubdivisionListItem:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, nullable: true, description: "Символьный код элемента инфоблока (CODE)" }
        name: { $ref: '#/components/schemas/LocalizedText' }
        preview_image: { type: string, nullable: true }
        firs:
          type: array
          items:
            type: object
            properties: { id: { type: integer }, code: { type: string }, name: { $ref: '#/components/schemas/LocalizedText' } }
        staff: { type: array, items: { $ref: '#/components/schemas/StaffMember' }, description: "Тот же список, что и в SubdivisionDetail (GET /common/subdivisions/{identifier})" }

    FssRef:
      type: object
      nullable: true
      properties:
        name: { $ref: '#/components/schemas/LocalizedText' }
        short_description: { $ref: '#/components/schemas/LocalizedText' }
        freq: { type: string, nullable: true }
        callsign: { type: string, nullable: true }

    DocBucket:
      type: object
      description: "Значение под кодом раздела в data GET /common/docs (объект, не голый массив — BREAKING с прошлой версии)"
      properties:
        code: { type: string, description: "CODE раздела — тот же, что и ключ объекта data, снаружи" }
        name:
          type: object
          description: "ru — NAME раздела, en — UF_NAME_EN раздела (пользовательское поле РАЗДЕЛА, не путать с PROPERTY_NAME_EN элементов внутри items)"
          properties:
            ru: { type: string }
            en: { type: string, nullable: true }
        items: { type: array, items: { $ref: '#/components/schemas/DocItem' } }

    DocItem:
      type: object
      description: "Элемент GET /common/docs. НЕ LocalizedText — оба под-поля description могут быть null (PREVIEW_TEXT/SHORT_DESCRIPTION_EN не заполнены)"
      properties:
        code: { type: string, description: "CODE элемента как есть, может быть пустой строкой, если не задан" }
        name:
          type: object
          properties:
            ru: { type: string }
            en: { type: string, nullable: true }
        description:
          type: object
          properties:
            ru: { type: string, nullable: true, description: "PREVIEW_TEXT элемента" }
            en: { type: string, nullable: true }
        link: { type: string, nullable: true, description: "Ключ отсутствует в объекте, если свойство LINK не заполнено" }
        file: { allOf: [{ $ref: '#/components/schemas/DocFile' }], description: "Ключ отсутствует в объекте, если свойство FILE не заполнено" }

    DocFile:
      type: object
      description: "Формируется общим CommonService::formatDocFile() — используется и в DocItem.file (GET /common/docs), и в AipItem.file (GET /common/airports/{airportCode}/aip)"
      properties:
        name: { type: string, description: "Оригинальное имя файла" }
        url: { type: string, description: "АБСОЛЮТНАЯ ссылка (домен из настройки сайта main.server_name, не из хоста текущего запроса)" }
        size: { type: integer, description: "Размер в байтах" }
        uploaded_at: { type: string, format: date-time, nullable: true, description: "TIMESTAMP_X файла (TZ сервера)" }

    AipItem:
      type: object
      description: "Элемент GET /common/airports/{airportCode}/aip"
      properties:
        id: { type: integer }
        name: { type: string }
        page: { type: integer, description: "Ключ отсутствует, если свойство PAGE не заполнено" }
        runways: { type: string, description: "Ключ отсутствует, если свойство RUNWAYS не заполнено" }
        category: { type: string, description: "XML_ID значения списочного свойства CATEGORY. Ключ отсутствует, если не заполнено" }
        airport_id: { type: integer, description: "Ключ отсутствует, если свойство AIRPORT не заполнено" }
        file: { allOf: [{ $ref: '#/components/schemas/DocFile' }], description: "Ключ отсутствует в объекте, если свойство FILE не заполнено" }

    BookingItem:
      type: object
      description: "Booking-объект VATSIM ATC Bookings API как есть, без изменений (см. тег Bookings)"
      properties:
        id: { type: integer }
        callsign: { type: string, description: "CODE позиции (инфоблок positions)" }
        cid: { type: integer, description: "VATSIM CID (= логин)" }
        type: { type: string, enum: [booking, event, exam, mentoring] }
        start: { type: string }
        end: { type: string }
        division: { type: string, example: RUS }
        subdivision: { type: string, nullable: true }
        news: { type: string, nullable: true, description: "ID новости-ивента. Присутствует ТОЛЬКО в ответе GET /bookings (при вызове без news — null, если букинг подан не под ивент) — у объектов в POST /bookings.data.created этого поля нет" }

    StaffMember:
      type: object
      properties:
        name: { $ref: '#/components/schemas/LocalizedText' }
        sort: { type: integer }
        user: { type: object, allOf: [{ $ref: '#/components/schemas/UserBrief' }], nullable: true }
        is_chief: { type: boolean, description: "Ключ отсутствует, если false" }

    StaffListItem:
      description: "Элемент справочника штатных должностей (GET /common/staff) — отдельная схема от StaffMember, используемого внутри SubdivisionDetail/FirDetail"
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string, description: "Плоская строка (не LocalizedText) — EN-версии названия должности нет" }
        sort: { type: integer }
        staff_user: { type: object, allOf: [{ $ref: '#/components/schemas/UserBrief' }], nullable: true }
        chief: { type: string, nullable: true, description: "CODE вышестоящей должности (самоссылающееся свойство BOSS), null если не задано" }
        email: { type: string, nullable: true }
        description: { $ref: '#/components/schemas/LocalizedText' }

    InstructorRef:
      allOf:
        - $ref: '#/components/schemas/UserBrief'
        - type: object
          properties: { type: { type: string, description: "instructor/mentor/senior-instructor и т.п." } }

    AirportRefFlat:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { $ref: '#/components/schemas/LocalizedText' }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }

    SubdivisionDetail:
      allOf:
        - $ref: '#/components/schemas/SubdivisionListItem'
        - type: object
          properties:
            description: { $ref: '#/components/schemas/LocalizedText' }
            discord: { type: string, nullable: true }
            www: { type: string, nullable: true }
            fss: { $ref: '#/components/schemas/FssRef' }
            airports: { type: array, items: { $ref: '#/components/schemas/AirportRefFlat' } }
            staff: { type: array, items: { $ref: '#/components/schemas/StaffMember' } }
            instructors: { type: array, items: { $ref: '#/components/schemas/InstructorRef' } }

    FirListItem:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { $ref: '#/components/schemas/LocalizedText' }

    FirDetail:
      allOf:
        - $ref: '#/components/schemas/FirListItem'
        - type: object
          properties:
            short_description: { $ref: '#/components/schemas/LocalizedText' }
            description: { $ref: '#/components/schemas/LocalizedText' }
            fss: { $ref: '#/components/schemas/FssRef' }
            airports: { type: array, items: { $ref: '#/components/schemas/AirportRefFlat' } }
            staff: { type: array, items: { $ref: '#/components/schemas/StaffMember' } }
            instructors: { type: array, items: { $ref: '#/components/schemas/InstructorRef' } }

    AirportListItem:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { $ref: '#/components/schemas/LocalizedText' }
        fir: { type: object, nullable: true, properties: { id: { type: integer }, code: { type: string } } }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }

    AirportDetail:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        iata: { type: string, nullable: true }
        name: { $ref: '#/components/schemas/LocalizedText' }
        short_description: { $ref: '#/components/schemas/LocalizedText' }
        description: { $ref: '#/components/schemas/LocalizedText' }
        city: { $ref: '#/components/schemas/LocalizedText' }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        elevation: { type: integer, nullable: true }
        remark:
          type: object
          nullable: true
          properties:
            ru: { type: string, nullable: true }
            en: { type: string, nullable: true }
        ifr: { type: boolean, description: "Вычисляется по XML_ID списочного свойства IFR_CAPABILITY, а не хранится напрямую" }
        magnetic_variation: { type: string, nullable: true, description: "Сырое значение свойства инфоблока, как есть" }
        trans_alt: { type: string, nullable: true, description: "Сырое значение свойства инфоблока, как есть" }
        trans_fl: { type: string, nullable: true, description: "Сырое значение свойства инфоблока, как есть" }
        runways:
          type: array
          description: "Из HL-блока полос (ID 15), отфильтровано по ICAO-коду аэропорта; кешируется отдельно от карточки аэропорта"
          items:
            type: object
            properties:
              rwy_id: { type: string, nullable: true, example: "07L" }
              rw_length: { type: string, nullable: true }
              magnetic_bearing: { type: string, nullable: true }
              rwy_width: { type: string, nullable: true }
              true_bearing: { type: string, nullable: true }
              gs_angle: { type: string, nullable: true }
              gs_elevation: { type: string, nullable: true }
              ils_bearing: { type: string, nullable: true }
              ils_freq: { type: string, nullable: true }
              ils_cat: { type: string, nullable: true, enum: ["Loc only", "CAT I", "CAT II", "CAT III", null], description: "Человекочитаемая метка, смаппленная из числового кода UF_ILS_CAT; null, если код не 0–3" }
              ils_id: { type: string, nullable: true }
        positions:
          type: array
          items:
            type: object
            properties:
              name: { $ref: '#/components/schemas/LocalizedText' }
              freq: { type: string, nullable: true }
              description: { $ref: '#/components/schemas/LocalizedText' }
              tier: { type: string, description: "XML_ID значения списочного свойства TIER. Ключ ОТСУТСТВУЕТ, если не заполнено — в отличие от PositionListItem.tier, где ключ всегда есть" }
              facility: { type: object, nullable: true, properties: { facility_id: { type: string }, title: { type: string } } }
        fir: { type: object, nullable: true, properties: { id: { type: integer }, code: { type: string } } }
        country: { type: object, nullable: true, properties: { code: { type: string }, name: { $ref: '#/components/schemas/LocalizedText' } } }
        type: { type: string, nullable: true, description: "XML_ID значения списочного свойства TYPE, например international/local" }
        is_division: { type: boolean, description: "Ключ присутствует, только если true" }

    CommentItem:
      type: object
      properties:
        id: { type: integer }
        text: { type: string }
        comment_date: { type: string, format: date-time }
        comment_by: { type: object, allOf: [{ $ref: '#/components/schemas/UserBrief' }], nullable: true, description: "null, если создавший пользователь Bitrix больше не существует" }
        is_alert: { type: boolean }
        source:
          type: object
          properties:
            type: { type: string, nullable: true, enum: [student, exam, null] }
            data:
              description: "Для type=student — объект UserBrief; для type=exam — целочисленный ID экзамена; null, если источник не задан"
              oneOf:
                - $ref: '#/components/schemas/UserBrief'
                - type: integer
                  nullable: true
        images:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              detail_url: { type: string, nullable: true }
              preview_url: { type: string, nullable: true, description: "Отличается от detail_url только если оригинал шире 480px" }

    StaticPageListItem:
      type: object
      properties:
        code: { type: string }
        title: { $ref: '#/components/schemas/LocalizedText' }
        sort: { type: integer }
        updated_at: { type: string, nullable: true, example: "2026-01-10 09:00:00" }

    StaticPageDetail:
      type: object
      properties:
        code: { type: string }
        title: { $ref: '#/components/schemas/LocalizedText' }
        body: { $ref: '#/components/schemas/LocalizedText' }
        sort: { type: integer }
        updated_at: { type: string, nullable: true, example: "2026-01-10 09:00:00" }

    StaticMenuItem:
      type: object
      properties:
        code: { type: string }
        title: { $ref: '#/components/schemas/LocalizedText' }
        icon: { type: string, nullable: true }
        action: { type: string, nullable: true }
        sort: { type: integer }
        children:
          type: array
          items: { $ref: '#/components/schemas/StaticMenuItem' }

    StaticAlertItem:
      type: object
      properties:
        code: { type: string }
        text: { $ref: '#/components/schemas/LocalizedText' }
        updated_at: { type: string, nullable: true, example: "2026-01-15 12:00:00" }

    StatisticsSummary:
      type: object
      description: |
        Все счётчики (включая new_registrations) считаются через единый фильтр `filterEligibleUsers`:
        исключены пользователи с UF_ATC_RATING = INA/SUS, и обязательно членство в группе `vatrus-users`
        (второе условие отсеивает тех, кого сверка ростера уже вывела из vatrus-users за пропажу из
        дивизиона RUS на VATSIM, но кто мог остаться в atc-students/atc-graduates и т. п. с валидным рейтингом).
      properties:
        students:
          type: object
          description: "Группа atc-students"
          properties:
            total: { type: integer }
            by_rating: { type: object, properties: { S1: { type: integer }, S2: { type: integer }, S3: { type: integer } } }
        controllers: { type: integer, description: "Группа atc-graduates" }
        instructors: { type: integer, description: "Группы atc-instructors + atc-senior-instructors" }
        supervisors: { type: integer, description: "UF_ATC_RATING = SUP" }
        pilots:
          type: object
          properties:
            total: { type: integer }
            by_rating: { type: object, properties: { PPL: { type: integer }, IR: { type: integer }, CMEL: { type: integer }, ATPL: { type: integer } } }
        new_registrations: { type: integer, description: "Зарегистрированы за последние 2 месяца" }
        total_users: { type: integer, description: "Группа vatrus-users" }
        vatsim:
          type: object
          description: "Не кешируется — считается заново на каждый вызов из данных за текущие сутки UTC (таблица VATSIM data feed, обновляется агентом каждые 5 минут)"
          properties:
            flights: { type: integer }
            pilots_online: { type: integer }
            atc_online: { type: integer }

    WeatherReport:
      type: object
      properties:
        airport_code: { type: string, example: UUEE }
        metar:
          type: object
          nullable: true
          description: "null, если METAR для этого аэродрома ещё ни разу не был получен (TAF при этом может присутствовать)"
          properties:
            raw: { type: string, description: "Сырой текст METAR как есть от источника" }
            time: { type: string, format: date-time, nullable: true, description: "reportTime источника (время наблюдения), не время получения ответа" }
        taf:
          type: object
          nullable: true
          description: "null, если TAF для этого аэродрома ещё ни разу не был получен (METAR при этом может присутствовать)"
          properties:
            raw: { type: string, description: "Сырой текст TAF как есть от источника" }
            time: { type: string, format: date-time, nullable: true, description: "issueTime источника (время выпуска прогноза), не время получения ответа" }
        fetched_at: { type: string, format: date-time, description: "Когда модуль последний раз успешно опросил источник по этому аэродрому (агент либо ?refresh=1) — не время наблюдения/выпуска" }

    TrainingRequestItem:
      type: object
      properties:
        id: { type: integer }
        applicant: { $ref: '#/components/schemas/UserBrief' }
        created_time: { type: string, format: date-time }
        fir: { type: object, allOf: [{ $ref: '#/components/schemas/FirRefLocalized' }], nullable: true, description: "null, пока заявитель не выбрал РПИ (PATCH .../fir) — см. тег" }
        airport: { type: object, allOf: [{ $ref: '#/components/schemas/AirportRefLocalized' }], nullable: true, description: "null, пока заявитель не выбрал РПИ (PATCH .../fir) — см. тег" }
        accepted_by: { type: object, allOf: [{ $ref: '#/components/schemas/UserBrief' }], nullable: true }
        accepted_time: { type: string, format: date-time, nullable: true }
        closed_by: { type: object, allOf: [{ $ref: '#/components/schemas/UserBrief' }], nullable: true }
        closed_time: { type: string, format: date-time, nullable: true }
        comment: { type: string, description: "PREVIEW_TEXT элемента; заполняется при отклонении (action=reject), иначе пустая строка" }
        ntp1: { $ref: '#/components/schemas/TrainingRequestNtp1Status' }

    TrainingRequestNtp1Status:
      type: object
      description: "Сводка по попыткам письменного зачёта ntp_1 заявителя (см. тег TrainingRequests). Не свойство инфоблока — агрегат, вычисляемый из инфоблока exsession при каждом запросе (с кешем)."
      properties:
        passed: { type: boolean, description: "true, если хотя бы одна попытка сдана (result in pass/appeal_pass)" }
        attempts:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, description: "ID сессии exsession" }
              result: { $ref: '#/components/schemas/ExamResult' }
              mark: { type: string, nullable: true }
              start_time: { type: string, format: date-time, nullable: true, description: "null, пока не вызван PATCH /exams/{id}/start" }
              finish_time: { type: string, format: date-time, nullable: true, description: "null, пока попытка не завершена" }

    TransferRequestItem:
      type: object
      properties:
        id: { type: integer }
        created_time: { type: string, format: date-time, description: "DATE_CREATE (нативное поле Bitrix, TZ сервера, не UTC — в отличие от большинства кастомных дат модуля)" }
        created_by: { $ref: '#/components/schemas/UserBrief' }
        user: { type: object, allOf: [{ $ref: '#/components/schemas/UserBrief' }], nullable: true, description: "Пользователь, которого переводят. Обычно совпадает с created_by — отличается только если заявку от его имени завёл region-staff" }
        old_fir: { type: string, nullable: true, description: "Код FIR пользователя на момент подачи заявки (просто строка, не объект — в отличие от TrainingRequestItem.fir). null, если у пользователя FIR не была установлена" }
        new_fir: { type: string, nullable: true, description: "Код FIR, в которую переводится пользователь" }
        result:
          type: string
          nullable: true
          description: |
            `null`, пока заявка не рассмотрена (соответствует `?result=consideration` в `GET /users/transfers`);
            `approved`/`declined` — те же человекочитаемые значения, что принимает фильтр `?result=` (раньше
            здесь отдавался сырой XML_ID-хеш enum-значения при семантическом имени во входном фильтре — этот
            разнобой устранён).
          enum: [approved, declined]
        actor: { type: object, allOf: [{ $ref: '#/components/schemas/UserBrief' }], nullable: true, description: "Кто одобрил/отклонил заявку. null, пока не рассмотрена" }
        comment: { type: string, nullable: true, description: "DETAIL_TEXT элемента. Пустая строка/null, пока не рассмотрена — обязателен при decline, опционален при approve" }
        edited_time: { type: string, format: date-time, description: "TIMESTAMP_X (нативное поле Bitrix, TZ сервера) — момент последнего изменения элемента (в т.ч. approve/decline)" }
