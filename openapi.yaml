        '200': { description: Удалено, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '400': { description: "imageId отсутствует/некорректен", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
