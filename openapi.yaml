          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/AirportRefLocalized'
              - type: object
                properties:
                  time_start: { type: string, format: date-time, nullable: true }
                  time_finish: { type: string, format: date-time, nullable: true }
        firs: { type: array, items: { $ref: '#/components/schemas/FirRefLocalized' } }
        preview_picture: { type: string, nullable: true }
        detail_picture: { type: string, nullable: true }
        active: { type: boolean }
        created:
          type: object
          description: "Присутствует, если вызывающий admin либо состоит хотя бы в одной из групп `atc-instructors`, `atc-mentors`, `staff`, `event-managers`, `vatrus-api-write-all`, `vatrus-api-read-all` (`NewsService::hasIblockWritePermission()` — явная проверка по группам, не через Bitrix IBlock ACL: инфоблок news в расширенном режиме прав (`RIGHTS_MODE=E`), где `CIBlock::GetPermission()` ненадёжен). Отдельно от гейтов write-эндпоинтов (`RightsHelper::isStaffOrAdmin()` для POST, staff-возможность `PUBLISH_NEWS` для DELETE/activate/deactivate, поэлементные права для PATCH) — эти условия могут не совпадать для конкретного пользователя."
          properties:
            time_created: { type: string, format: date-time }
            created_by: { $ref: '#/components/schemas/UserBrief' }
        published:
          type: object
          description: "Присутствует по тому же условию, что и `created`, независимо от того, опубликован ли элемент — для неактивной/неопубликованной новости оба под-поля будут null."
          properties:
            time_published: { type: string, format: date-time, nullable: true }
            published_by: { type: object, allOf: [{ $ref: '#/components/schemas/UserBrief' }], nullable: true }

    ExamListItem:
      type: object
      description: "Тот же вид используется и для элементов `past` в `GET /exams/{login}/progress` — реальные сессии (сданные и несданные), полный вид. `current`/`future` там же — другой, более узкий вид, см. `ExamProgramStageItem`."
      properties:
        id: { type: integer }
        student: { $ref: '#/components/schemas/UserBrief' }
        type:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
            session_type: { type: string, nullable: true, description: "XML_ID значения списочного свойства TYPE этого типа мероприятия (категория: t_checklist/p_checklist/p_exam/... — НЕ XML_ID самого элемента-типа), null если свойство не заполнено" }
        start_time: { type: string, format: date-time, nullable: true, description: "null, пока не вызван PATCH /exams/{id}/start (при создании сессии больше не проставляется)" }
        finish_time: { type: string, format: date-time, nullable: true }
        result: { $ref: '#/components/schemas/ExamResult' }
        mark: { type: string, nullable: true }
        program:
          description: "Раскладка мероприятия по учебной программе (training_program) — тот же вид, что и элементы GET /exams/program, но без id. Строка \"legacy\" — если тип мероприятия не сопоставлен ни с одним этапом программы (история до training_program)."
          oneOf:
            - $ref: '#/components/schemas/TrainingProgramItem'
            - type: string
              enum: [legacy]

    ExamProgramStageItem:
      type: object
      description: "Элемент учебной программы (training_program), ещё не сданный — используется в current/future GET /exams/{login}/progress. В отличие от ExamListItem — реальной сессии не существует, поэтому только эти три поля (id/start_time/finish_time/result/mark отсутствуют в объекте, не null)."
      properties:
        student: { $ref: '#/components/schemas/UserBrief' }
        type:
          type: object
          nullable: true
          description: "null, если у элемента программы не заполнено свойство SESSION_TYPE (cert=false в program)"
          properties:
            id: { type: integer }
            name: { type: string }
            session_type: { type: string, nullable: true, description: "XML_ID значения списочного свойства TYPE (категория: t_checklist/p_checklist/p_exam/...)" }
        program: { $ref: '#/components/schemas/TrainingProgramItem' }

    ExamResult:
      type: string
      nullable: true
      description: |
        pass/nopass — вычисляются автоматически; fail1..fail7, cancel1..cancel4, cancelgcap — ручные
        (проставляются через `result` в `PATCH /exams/{id}/finish`); fail8 — авто-результат самостоятельного
        "письменного зачёта" при превышении лимита времени на решение (см. `PATCH /exams/{id}/answers/{questionId}`),
        вручную не задаётся. appeal_pass/appeal_cancelled — результат рассмотрения апелляции
        (`PATCH /exams/appeals/{id}/approve`, см. тег Exams): переключает прежний результат на
        противоположный (pass → appeal_cancelled, любой другой → appeal_pass, с mark не ниже 4.00).
        appeal_pass учитывается наравне с обычным pass везде, где считается прогресс/этап обучения —
        как и остальные "ручные" коды, через finish не задаётся.
      enum: [pass, nopass, cancelgcap, cancel1, cancel2, cancel3, cancel4, fail1, fail2, fail3, fail4, fail5, fail6, fail7, fail8, appeal_pass, appeal_cancelled]

    TrainingProgramItem:
      type: object
      properties:
        category: { type: string, description: "CODE раздела инфоблока training_program", example: theory }
        sort: { type: integer }
        name: { type: string }
        stage: { type: string, nullable: true, description: "XML_ID значения списочного свойства STAGE, null если не заполнено" }
        description: { type: string, nullable: true, description: "DETAIL_TEXT элемента" }
        cert: { type: boolean, description: "true, если этап привязан к аттестационному мероприятию (заполнено свойство SESSION_TYPE)" }
        session_type: { type: integer, nullable: true, description: "ID элемента справочника типов экзаменов (SESSION_TYPE), null если cert=false. НЕ путать с одноимённым, но другим по смыслу и типу ExamListItem.type.session_type (там это строка — XML_ID категории мероприятия, а не ID элемента)." }

    ExamDetail:
      type: object
      properties:
        student: { $ref: '#/components/schemas/UserBrief' }
        atc_rating: { type: string, nullable: true }
        type:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
            session_type: { type: string, nullable: true, description: "XML_ID значения списочного свойства TYPE этого типа мероприятия (категория: t_checklist/p_checklist/p_exam/... — НЕ XML_ID самого элемента-типа), null если свойство не заполнено" }
        examiners:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/UserBrief'
              - type: object
                properties:
                  is_chairman: { type: boolean }
        start_time: { type: string, format: date-time, nullable: true, description: "null, пока не вызван PATCH /exams/{id}/start (при создании сессии больше не проставляется)" }
        finish_time: { type: string, format: date-time, nullable: true }
        finished_by: { type: object, allOf: [{ $ref: '#/components/schemas/UserBrief' }], nullable: true }
        questions:
          type: array
          items:
            type: object
            properties:
              question_id: { type: integer }
              question: { type: string, description: "NAME элемента вопроса — это ТЕМА вопроса, не сам вопрос (см. text)" }
              text: { type: string, description: "Сам текст вопроса (PREVIEW_TEXT элемента)" }
              weight: { type: string }
              can_be_skipped: { type: boolean }
              answers:
                type: array
                nullable: true
                description: "Варианты ответа вопроса (свойство ANSWER). null, если вариантов меньше двух (свободный текстовый ответ). index — фиксированный номер варианта (не порядок выдачи)."
                items:
                  type: object
                  properties:
                    index: { type: integer }
                    text: { type: string }
              answer_type:
                type: string
                enum: [input, radio, checkbox, comparison, missing_word]
                description: "Подсказка фронту, каким виджетом рендерить вопрос — чтобы не дублировать эту логику на клиенте. По умолчанию рассчитывается: input — 0-1 вариантов (answers=null, свободный ввод); radio — >1 вариантов с ровно одним верным; checkbox — >1 вариантов с несколькими верными. Может быть переопределён вручную на карточке вопроса (свойство ANSWER_TYPE_OVERRIDE инфоблока questions) — тогда отдаётся заданное значение независимо от фактического количества вариантов. comparison (сопоставление; столбцы вшиты в text, ответ — строка цифр без разделителей в порядке левого столбца, например 3412) и missing_word (пропущенное слово, ________ в text) — только значения-подсказки ручного override: ответ у обоих свободный текст, проверка как у input (сравнение с единственным эталоном без учёта регистра и пробелов по краям), answers=null."
              time_limit: { type: string, nullable: true, description: "Лимит времени на вопрос в секундах (свойство TIME). null, если не задан." }
              given_answer: { type: string, nullable: true, description: "Сохранённый сырой ответ абитуриента (GIVEN_ANSWER), см. PATCH /exams/{id}/answers/{questionId}. null, если ещё не отвечен." }
        result: { $ref: '#/components/schemas/ExamResult' }
        result_mark: { type: string, nullable: true }
        marks:
          type: array
          items:
            type: object
            properties:
              examiner:
                allOf:
                  - $ref: '#/components/schemas/UserBrief'
                  - type: object
                    properties: { is_chairman: { type: boolean } }
              scores:
                type: array
                items:
                  type: object
                  properties: { question_id: { type: integer }, mark: { type: integer } }
        comments:
          type: array
          items:
            type: object
            properties:
              comment_date: { type: string, format: date-time }
              comment_by: { $ref: '#/components/schemas/UserBrief' }
              text: { type: string }
              is_alert: { type: boolean }

    AppealItem:
      type: object
      properties:
        id: { type: integer }
        created_time: { type: string, format: date-time, description: "DATE_CREATE (нативное поле Bitrix, TZ сервера, не UTC — в отличие от большинства кастомных дат модуля)" }
        created_by: { $ref: '#/components/schemas/UserBrief' }
        exam: { type: object, allOf: [{ $ref: '#/components/schemas/ExamDetail' }], nullable: true, description: "Полная сессия, к которой подана апелляция (тот же вид, что GET /exams/{id}). null, если сессию не удалось загрузить" }
        text: { type: string, nullable: true, description: "DETAIL_TEXT элемента — текст апелляции" }
