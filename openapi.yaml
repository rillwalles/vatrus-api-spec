  # ============================= NEWS =============================
  /news:
    get:
      operationId: newsList
      tags: [News]
      summary: Список новостей
      description: |
        Публичный (токен не обязателен), но если валидный Bearer-токен передан — вызывающий авторизуется
        (`AuthHelper::tryAuth()`), и его реальные права учитываются: `filter[activity]=inactive/all` и
        `created`/`published` в ответе работают только при этом (см. ниже) — без токена вызывающий всегда
        трактуется как аноним, даже если по факту он staff/admin.

        Вместо Bearer-токена можно передать `X-Api-Key` внешнего ключа (сектор `news`) + `actor` в query —
        тот же эффект, что от JWT владельца `actor` (см. общий раздел "Внешние API-ключи"). В отличие от
        Bearer-токена ЗАГОЛОВОК не игнорируется молча: если он передан, но ключ невалиден/не активен/не на
        сектор `news`, либо `actor` не передан или не найден — запрос падает с ошибкой (см. ниже), а не
        откатывается на анонимный доступ (раньше откатывался — вызовы с ключом проваливались в анонимный
        путь и терялись в `b_vatrus_api_log` как `noauth`).

        Сортировка — по `EVENT_START` (дата мероприятия) по убыванию, не по дате публикации: черновики
        (`filter[activity]=all`, `ACTIVE_FROM` ещё не проставлен) занимают свою хронологическую позицию по
        дате мероприятия, а не тонут в конце списка.
      security: []
      parameters:
        - $ref: '#/components/parameters/ActorQuery'
        - $ref: '#/components/parameters/Page'
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: filter
          in: query
          description: Объект фильтра либо JSON-строка
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              ids: { type: array, items: { type: integer } }
              activity:
                type: string
                enum: [active, all, inactive]
                default: active
                description: "Для не-staff пользователей всегда принудительно active=Y независимо от значения"
              date_from: { type: string, format: date, description: "фильтр по EVENT_START" }
              date_to: { type: string, format: date }
              fir_codes: { type: array, items: { type: string }, example: [ULLL, UUWV] }
      responses:
        '200':
          description: |
            `created`/`published` присутствуют в элементах, только если у вызывающего есть право записи
            в инфоблок новостей (staff/admin) — для обычных пользователей эти ключи отсутствуют.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PaginationMeta'
                          - type: object
                            properties:
                              items: { type: array, items: { $ref: '#/components/schemas/NewsItem' } }
              example:
                success: true
                data:
                  items:
                    - id: 101
                      name: { ru: "Учебные полёты в зоне UUEE", en: "Training flights in UUEE zone" }
                      subtitle: { ru: "Отработка захода по приборам", en: "Instrument approach practice" }
                      type: event
                      preview_text: { ru: "<p>Краткое описание...</p>", en: "<p>Short description...</p>" }
                      detail_text: { ru: "<p>Полное описание...</p>", en: "<p>Full description...</p>" }
                      event: { start: "2026-07-20T09:00:00+0000", finished: "2026-07-20T18:00:00+0000" }
                      airports:
                        - code: UUEE
                          name: { ru: "Шереметьево", en: "Sheremetyevo" }
                          time_start: "2026-07-20T09:00:00+0000"
                          time_finish: "2026-07-20T18:00:00+0000"
                      firs:
                        - code: UUWV
                          name: { ru: "Москва", en: "Moscow" }
                      preview_picture: "/upload/iblock/abc/preview.jpg"
                      detail_picture: null
                      active: true
                      created:
                        time_created: "2026-07-15T14:32:00+0000"
                        created_by: { id: 7, login: i.petrov, name: Иван, lastname: Петров }
                      published:
                        time_published: "2026-07-16T08:00:00+0000"
                        published_by: { id: 3, login: a.ivanova, name: Анна, lastname: Иванова }
                  total: 42
                  page: 1
                  pageSize: 20
        '400': { description: "actor не передан при переданном X-Api-Key", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "actor is required" } } } }
        '401': { description: "X-Api-Key передан, но не найден/не активен/не на сектор news", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Invalid or missing API key" } } } }
        '404': { description: "actor с таким логином не найден (только при переданном X-Api-Key)", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "actor 'bad.login' not found" } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

    post:
      operationId: newsCreate
      tags: [News]
      summary: Создать новость (создаётся неактивной, требует последующего /activate)
      description: |
        Доступ широкий: администратор или член групп `atc-instructors`, `atc-mentors`, `staff`, `event-managers`,
        `vatrus-api-write-all`, `vatrus-api-read-all` (тот же критерий, что даёт `canWrite` в выдаче GET /news).
        Публикация (`/activate`, `/deactivate`) и удаление требуют более узкого права `publish_news`.
        Через `X-Api-Key` внешнего ключа — тот же критерий, но для `actor`, не для вызывающего (см. описание тега `News`).
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name_ru, name_en, preview_text_ru, detail_text_ru, event_start, event_finish, fir_codes, type]
              properties:
                name_ru: { type: string }
                name_en: { type: string }
                subtitle_ru: { type: string }
                subtitle_en: { type: string }
                type: { type: string, enum: [event, exam, info], description: "Обязательно. Список-свойство TYPE" }
                preview_text_ru: { type: string, description: "HTML" }
                preview_text_en: { type: string, description: "HTML" }
                detail_text_ru: { type: string, description: "HTML" }
                detail_text_en: { type: string, description: "HTML" }
                event_start: { type: string, description: "Свободный формат даты, парсится strtotime/DateTime" }
                event_finish: { type: string }
                fir_codes: { type: string, description: "Через запятую, например ULLL,UUWV" }
                code: { type: string, description: "Слаг; если не передан — генерируется транслитерацией name_ru" }
                airports: { type: string, description: "Через запятую коды аэропортов; либо JSON-массив {code,time_start?,time_finish?} для персональных таймингов" }
                image: { type: string, format: binary }
                actor: { type: string, description: "Логин, от чьего имени создаётся новость — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key (сектор news), игнорируется при обычном Bearer JWT", example: i.petrov }
      responses:
        '200':
          description: Новость создана (ACTIVE=N)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { type: object, properties: { id: { type: integer } } } }
              example: { success: true, data: { id: 101 } }
        '400':
          description: "Не заполнено обязательное поле, не удалось обработать файл изображения, ошибка Bitrix при создании элемента (код 400, не 500, с текстом ошибки Bitrix в сообщении), либо actor не передан при авторизации через X-Api-Key"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                missing_field: { value: { success: false, error: "Missing required field: name_ru" } }
                invalid_type: { value: { success: false, error: "Invalid value for field: type" } }
                bitrix_error: { value: { success: false, error: "Failed to create news: <текст ошибки Bitrix>" } }
                missing_actor: { value: { success: false, error: "actor is required" } }
        '401':
          description: "X-Api-Key не передан, ключ не найден/не активен, либо не выдан на сектор news (только при авторизации через внешний ключ)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, error: "Invalid or missing API key" }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: "actor с таким логином не найден (только при авторизации через X-Api-Key)", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "actor 'bad.login' not found" } } } }
        '500':
          description: "Инфоблок новостей не настроен (config-ошибка) — на практике редко достижимо, т.к. ошибки самого Bitrix при создании элемента возвращаются как 400"
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /news/{id}:
    get:
      operationId: newsGet
      tags: [News]
      summary: Новость по ID
      description: |
        Публичный (токен не обязателен), но если валидный Bearer-токен передан — вызывающий авторизуется
        (`AuthHelper::tryAuth()`), как и в `GET /news`: без него `created`/`published` в ответе не появятся,
        даже если вызывающий по факту staff/admin. Также принимает `X-Api-Key` внешнего ключа (сектор `news`)
        + `actor` в query как альтернативу Bearer-токену — то же поведение (в т.ч. ошибки при невалидном
        ключе/`actor`), что у `GET /news`, см. её описание.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/ActorQuery'
      responses:
        '200':
          description: Тот же формат элемента, что и в списке
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/NewsItem' } }
        '400': { description: "actor не передан при переданном X-Api-Key", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "actor is required" } } } }
        '401': { description: "X-Api-Key передан, но не найден/не активен/не на сектор news", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Invalid or missing API key" } } } }
        '404':
          description: "Новость не найдена, либо (только при переданном X-Api-Key) не найден actor"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_found: { value: { success: false, error: "News not found" } }
                bad_actor: { value: { success: false, error: "actor 'bad.login' not found" } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

    patch:
      operationId: newsUpdate
      tags: [News]
      summary: Частичное обновление новости
      description: |
        Доступ определяется поэлементными правами Bitrix на конкретную новость (`CIBlockElementRights::UserHasRightTo`,
        через `NewsService::canUserEditElement()`), НЕ общей проверкой staff/admin (см. описание тега `News`) —
        админу можно всегда, автору черновика можно до публикации, после публикации не даже автору (если он не
        входит в число держателей `PUBLISH_NEWS`: только они и админы правят опубликованные новости). Все поля опциональны — переданы
        только те, что нужно изменить. `airports`, если ключ присутствует, полностью заменяет набор аэропортов.
        Через `X-Api-Key` (сектор `news`) проверка ТА ЖЕ САМАЯ, для `actor` — см. описание тега `News`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name_ru: { type: string }
                name_en: { type: string }
                subtitle_ru: { type: string }
                subtitle_en: { type: string }
                type: { type: string, enum: [event, exam, info] }
                preview_text_ru: { type: string }
                preview_text_en: { type: string }
                detail_text_ru: { type: string }
                detail_text_en: { type: string }
                event_start: { type: string }
                event_finish: { type: string }
                fir_codes: { type: string }
                airports: { type: string }
                image: { type: string, format: binary }
                actor: { type: string, description: "Логин, от чьего имени редактируется новость — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key (сектор news), игнорируется при обычном Bearer JWT", example: i.petrov }
      responses:
        '200':
          description: Обновлено
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '400':
          description: "Не удалось обработать файл изображения, передан некорректный type, ошибка Bitrix при обновлении элемента (текст ошибки Bitrix в сообщении), либо actor не передан при авторизации через X-Api-Key"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                bad_image: { value: { success: false, error: "Failed to process image file" } }
                invalid_type: { value: { success: false, error: "Invalid value for field: type" } }
                bitrix_error: { value: { success: false, error: "Failed to update news: <текст ошибки Bitrix>" } }
                missing_actor: { value: { success: false, error: "actor is required" } }
        '401':
          description: "X-Api-Key не передан, ключ не найден/не активен, либо не выдан на сектор news (только при авторизации через внешний ключ)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, error: "Invalid or missing API key" }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: "actor с таким логином не найден (только при авторизации через X-Api-Key)", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "actor 'bad.login' not found" } } } }
        '500':
          description: "Новость или инфоблок новостей не найдены"
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Failed to update news" } } }

    delete:
      operationId: newsDelete
      tags: [News]
      summary: Удалить новость (с картинками и записями времени по аэропортам)
      description: |
        Доступ по staff-возможности `PUBLISH_NEWS` ("Публикация новостей") — тот же гейт, что у `activate`/
        `deactivate` (раньше было более широкое staff/admin, `isStaffOrAdmin`; сужено). Через `X-Api-Key`
        внешнего ключа — та же capability, но для `actor` (см. описание тега `News`).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                actor: { type: string, description: "Логин, от чьего имени выполняется удаление — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key (сектор news), игнорируется при обычном Bearer JWT", example: i.petrov }
      responses:
        '200': { description: Удалено, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '400': { description: "actor не передан при авторизации через X-Api-Key", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "actor is required" } } } }
        '401': { description: "X-Api-Key не передан, ключ не найден/не активен, либо не выдан на сектор news (только при авторизации через внешний ключ)", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Invalid or missing API key" } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: "actor с таким логином не найден (только при авторизации через X-Api-Key)", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "actor 'bad.login' not found" } } } }
        '500': { description: "Не найдена / ошибка удаления", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /news/{id}/activate:
    patch:
      operationId: newsActivate
      tags: [News]
      summary: Опубликовать новость (ACTIVE=Y, ACTIVE_FROM=now, фиксирует автора публикации)
      description: |
        Доступ по staff-возможности `PUBLISH_NEWS` ("Публикация новостей", назначается на должностях
        инфоблока `staff` через `VATRUS_CAPABILITIES`) — НЕ общая проверка staff/admin (см. описание тега
        `News`); это более узкий, отдельно назначаемый набор пользователей. При успешной публикации снимает
        индивидуальное право создателя на редактирование этого элемента (см. описание тега). Через
        `X-Api-Key` внешнего ключа — та же capability, но для `actor`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                actor: { type: string, description: "Логин, от чьего имени публикуется новость — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key (сектор news), игнорируется при обычном Bearer JWT", example: i.petrov }
      responses:
        '200': { description: Опубликована, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '400': { description: "actor не передан при авторизации через X-Api-Key", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "actor is required" } } } }
        '401': { description: "X-Api-Key не передан, ключ не найден/не активен, либо не выдан на сектор news (только при авторизации через внешний ключ)", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Invalid or missing API key" } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: "actor с таким логином не найден (только при авторизации через X-Api-Key)", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "actor 'bad.login' not found" } } } }
        '500': { description: "Не найдена / ошибка Bitrix", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /news/{id}/deactivate:
    patch:
      operationId: newsDeactivate
      tags: [News]
      summary: Мягко скрыть новость (ACTIVE=N)
      description: |
        В отличие от `DELETE /news/{id}`, не удаляет элемент, файлы картинок и связанные записи времён
        аэропортов — только снимает `ACTIVE`. `ACTIVE_FROM`/автор публикации не трогает (история последней
        публикации сохраняется). Доступ — тот же гейт, что у `activate` (staff-возможность `PUBLISH_NEWS`,
        для `actor` при авторизации через `X-Api-Key` внешнего ключа).
        Новость фактически возвращается в состояние черновика — создателю восстанавливается индивидуальное
        право "Изменение" на элемент (симметрично `activate`, который это право снимает).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                actor: { type: string, description: "Логин, от чьего имени скрывается новость — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key (сектор news), игнорируется при обычном Bearer JWT", example: i.petrov }
      responses:
        '200': { description: Скрыта, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '400': { description: "actor не передан при авторизации через X-Api-Key", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "actor is required" } } } }
        '401': { description: "X-Api-Key не передан, ключ не найден/не активен, либо не выдан на сектор news (только при авторизации через внешний ключ)", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Invalid or missing API key" } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: "actor с таким логином не найден (только при авторизации через X-Api-Key)", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "actor 'bad.login' not found" } } } }
        '500': { description: "Не найдена / ошибка Bitrix", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  # ============================= USERS =============================
  /users:
    get:
      operationId: usersList
      tags: [Users]
      summary: Список пользователей Bitrix
      description: |
        Требует скоуп доступа (см. тег `Users`). Для ограниченного скоупа (не admin/`edit_all_users`) —
        запрошенный `groups` сужается пересечением со скоупом вызывающего; если `groups` не передан —
        подставляется скоуп целиком; если пересечение пустое (запрошены группы вне скоупа) — пустой список,
        не ошибка и не полный список без фильтра.
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
        - name: ids
          in: query
          description: "Через запятую или массив"
          schema: { type: string }
        - name: logins
          in: query
          description: "Через запятую или массив"
          schema: { type: string }
        - name: groups
          in: query
          description: "Код(ы) группы через запятую или массив — сужает список до участников хотя бы одной из указанных групп"
          schema: { type: string }
          example: atc-students
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PaginationMeta'
                          - type: object
                            properties: { items: { type: array, items: { $ref: '#/components/schemas/UserFull' } } }
              example:
                success: true
                data:
                  items:
                    - id: 142
                      login: 1002030
                      name: Sergey
                      lastname: Ivanov
                      division: "ATC Division"
                      subdivision: "Moscow Center"
                      atc_rating: S1
                      pilots_rating: null
                      fir: { code: ULLL, name: { ru: "Москва", en: "Moscow" } }
                      airport: { code: UUEE, name: { ru: "Шереметьево", en: "Sheremetyevo" } }
                      discord: "123456789012345678"
                      groups: [atc-students]
                  total: 250
                  page: 1
                  pageSize: 20
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/groups:
    get:
      operationId: usersGroupsList
      tags: [Users]
      summary: Список групп Bitrix с количеством участников
      description: "Требует сам факт доступа по скоупу (см. тег `Users`) — без сужения по группам, это не персональные данные. Группа `admins` (ID=1) всегда исключена из результата."
      parameters:
        - name: ids
          in: query
          description: "ID групп через запятую или массив"
          schema: { type: string }
        - name: codes
          in: query
          description: "STRING_ID групп через запятую или массив"
          schema: { type: string }
          example: atc-students,atc-instructors
        - $ref: '#/components/parameters/Page'
        - name: pageSize
          in: query
          description: "По умолчанию 20, максимум 100"
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PaginationMeta'
                          - type: object
                            properties:
                              items:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id: { type: integer }
                                    code: { type: string, description: "STRING_ID" }
                                    name: { type: string }
                                    users_count: { type: integer }
              example:
                success: true
                data:
                  items:
                    - { id: 8, code: atc-students, name: "Студенты", users_count: 37 }
                    - { id: 12, code: atc-instructors, name: "Инструкторы", users_count: 14 }
                  total: 2
                  page: 1
                  pageSize: 20
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/me:
    get:
      operationId: usersGetMe
      tags: [Users]
      summary: Собственные данные вызывающего по access-токену
      description: |
        Только `AuthHelper::checkAuth()` — скоуп доступа (см. тег `Users`) не применяется: свои данные видны
        всегда, независимо от того, есть ли доступ к чужим карточкам. Логин берётся из токена, не из query/path.

        Единственный эндпоинт, где в ответе есть `admin_allowed` — та же проверка
        (`AccessHelper::hasPhysicalAdminAccess()`), что гейтит выдачу admin-SSO токена в
        `POST /auth/admin-sso`: физический доступ Bitrix к `/bitrix/admin/` (членство в группе `admins`, либо
        `GetFileAccessPermissionByUser`). Двухфакторное исключение `POST /auth/admin-sso` (аккаунты с
        включённой 2FA получают `403` при попытке SSO) сюда НЕ входит — это специфика самого SSO-моста, а не
        права доступа как такового, поэтому `admin_allowed: true` не гарантирует успешный `POST /auth/admin-sso`
        для аккаунтов с 2FA.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/UserFull'
                          - type: object
                            properties:
                              admin_allowed: { type: boolean, description: "Разрешён ли физический доступ в админку Bitrix — см. выше. Присутствует ТОЛЬКО в ответе GET /users/me, не в GET /users/{login} и не в списках" }
                              staff_rights:
                                type: array
                                items: { type: string }
                                description: "Только для членов группы `staff` (у остальных поля нет вовсе). Символьные коды (XML_ID значений списка `VATRUS_CAPABILITIES`) возможностей, назначенных на ВСЕ активные должности пользователя в инфоблоке `staff` — объединением. Пустой массив — должностей/возможностей нет. Это сырой список должностей, а не итоговое право: администратор проходит любую проверку возможности и без записи здесь. Возможные коды: `rating_requests`, `user_update`, `discord_members`, `bookings`, `stat`, `active_solo`, `instructor_activity`, `main_menu`, `static_pages`, `alerts`, `classes`, `agents`, `edit_user_rights`, `assign_instructors`, `student_transfers`, `exam_appeals`, `publish_news`"
                                example: [student_transfers, exam_appeals]
              example:
                success: true
                data:
                  id: 142
                  login: 1002030
                  name: Sergey
                  lastname: Ivanov
                  division: "ATC Division"
                  subdivision: "Moscow Center"
                  atc_rating: S1
                  pilots_rating: null
                  fir: { code: ULLL, name: { ru: "Москва", en: "Moscow" } }
                  airport: { code: UUEE, name: { ru: "Шереметьево", en: "Sheremetyevo" } }
                  discord: "123456789012345678"
                  groups: [atc-students]
                  admin_allowed: false
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: "Пользователь токена не найден (учётка удалена после выдачи токена)", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "User not found" } } } }

  /users/transfers:
    get:
      operationId: usersTransfersList
      tags: [Users]
      summary: Список заявок на перевод между РПИ, видимых вызывающему (с пагинацией)
      description: |
        `CHECK_PERMISSIONS=Y` — видны только заявки, на которые у вызывающего есть право чтения элемента (см.
        описание тега `Users`). Обычная пагинация `items`/`total`/`page`/`pageSize`, сортировка по убыванию ID.
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: result
          in: query
          description: "consideration — RESULT ещё не проставлен (на рассмотрении); approved/declined — уже рассмотрена. Неизвестное значение — 400, не пустой результат"
          schema: { type: string, enum: [consideration, approved, declined] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { allOf: [{ $ref: '#/components/schemas/PaginationMeta' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/TransferRequestItem' } } } }] } } }]
              example:
                success: true
                data:
                  items:
                    - id: 12
                      created_time: "2026-09-02T14:12:00+0300"
                      created_by: { id: 118, login: 1002030, name: Sergey, lastname: Ivanov }
                      user: { id: 118, login: 1002030, name: Sergey, lastname: Ivanov }
                      old_fir: ULLL
                      new_fir: UUWV
                      result: null
                      actor: null
                      comment: null
                      edited_time: "2026-09-02T14:12:00+0300"
                  total: 1
                  page: 1
                  pageSize: 20
        '400': { description: "Неизвестное значение result", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Invalid result filter 'foo' (expected consideration/approved/declined)" } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { description: "Инфоблок transfer_requests не найден", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

    post:
      operationId: usersTransfersCreate
      tags: [Users]
      summary: Подать заявку на перевод в другую FIR
      description: |
        Требует членства в `vatrus-users`. Заявка обычно заводится на самого вызывающего; `login` в теле —
        попытка подать заявку ЗА другого пользователя, разрешено только актору из `region-staff` — для
        остальных `403` (раньше параметр молча игнорировался и заявка тихо создавалась на самого актора, что
        приводило к необъяснимым `"User is already assigned to this FIR"`, если сам актор уже состоит в
        запрошенном РПИ). У цели не должно быть уже поданной нерассмотренной заявки (`RESULT` пуст) — иначе
        `403`. `new_fir` не может совпадать с уже сохранённой FIR цели.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_fir]
              properties:
                login: { type: string, description: "Логин цели — разрешено только актору из region-staff, иначе 403 (не игнорируется)", example: 1002030 }
                new_fir: { type: string, description: "Код FIR, в которую переводится пользователь", example: UUWV }
      responses:
        '200':
          description: Создана
          content:
            application/json:
              schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: object, properties: { id: { type: integer } } } } }] }
              example: { success: true, data: { id: 12 } }
        '400':
          description: "new_fir не передан, либо совпадает с уже сохранённой FIR цели"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                missing: { value: { success: false, error: "new_fir is required" } }
                same_fir: { value: { success: false, error: "User is already assigned to this FIR" } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: "Вызывающий не состоит в vatrus-users, передал login не будучи region-staff, либо у цели уже есть нерассмотренная заявка на перевод"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_eligible: { value: { success: false, error: "Access denied" } }
                login_not_allowed: { value: { success: false, error: "Access denied: only region-staff can create a transfer request on behalf of another user" } }
                already_pending: { value: { success: false, error: "This user already has a pending transfer request" } }
        '404':
          description: "Цель (login) или FIR не найдены"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                user: { value: { success: false, error: "User '1002030' not found" } }
                fir: { value: { success: false, error: "FIR 'ZZZZ' not found" } }
        '500': { description: "Ошибка Bitrix при создании элемента", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /users/transfers/{id}:
    get:
      operationId: usersTransfersGet
      tags: [Users]
      summary: Заявка на перевод по ID
      description: |
        Видимость — та же нативная модель прав, что и в `GET /users/transfers` (`CHECK_PERMISSIONS`); "не
        найдено" и "нет прав" неразличимы снаружи — оба `404`, чтобы не палить существование чужой заявки.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/TransferRequestItem' } } }] }
              example:
                success: true
                data:
                  id: 12
                  created_time: "2026-09-02T14:12:00+0300"
                  created_by: { id: 118, login: 1002030, name: Sergey, lastname: Ivanov }
                  user: { id: 118, login: 1002030, name: Sergey, lastname: Ivanov }
                  old_fir: ULLL
                  new_fir: UUWV
                  result: approved
                  actor: { id: 55, login: a.smith, name: Alice, lastname: Smith }
                  comment: "Подтверждён переезд в новый РПИ"
                  edited_time: "2026-09-02T15:00:00+0300"
        '400': { description: "id отсутствует/некорректен", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: "Заявка не найдена, либо у вызывающего нет прав на её чтение", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Transfer request not found" } } } }

  /users/transfers/{id}/approve:
    patch:
      operationId: usersTransfersApprove
      tags: [Users]
      summary: Одобрить заявку на перевод
      description: |
        Доступ по staff-возможности `STUDENT_TRANSFERS` ("Переводы студентов и выпускников") — НЕ через права
        элемента и НЕ через членство в `region-staff`/`staff` как группе (читает элемент без `CHECK_PERMISSIONS`).
        Переносит пользователя на `new_fir` заявки, сбрасывает привязку к аэропорту (мог относиться к прежней
        FIR), пишет историю (`user_fir_changed`/`user_apt_changed`) и принудительно выставляет текущий этап
        учебной программы (`StudentProgressService`) на элемент `training_program`, указанный в `stage` —
        рассматривающий выбирает его сам, автоматика не определяет. Уже рассмотренную заявку (`RESULT` заполнен)
        одобрить нельзя.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage]
              properties:
                stage: { type: integer, description: "ID активного элемента инфоблока training_program — новый текущий этап программы для пользователя" }
                comment: { type: string, description: "Опционально" }
      responses:
        '200': { description: "Одобрена (без data)", content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '400':
          description: "id/stage отсутствуют/некорректны, либо заявка уже рассмотрена"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                missing_stage: { value: { success: false, error: "Missing or invalid stage" } }
                already_processed: { value: { success: false, error: "Transfer request has already been processed" } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: "Нет staff-возможности STUDENT_TRANSFERS", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Access denied" } } } }
        '404':
          description: "Заявка, указанный training_program-элемент, либо целевой пользователь не найдены"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                request: { value: { success: false, error: "Transfer request not found" } }
                stage: { value: { success: false, error: "training_program element '999999' not found" } }
        '500': { description: "Заявка без user/new_fir (повреждённые данные), не настроен RESULT enum, либо ошибка Bitrix при обновлении FIR пользователя", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /users/transfers/{id}/decline:
    patch:
      operationId: usersTransfersDecline
      tags: [Users]
      summary: Отклонить заявку на перевод
      description: |
        Доступ — та же staff-возможность `STUDENT_TRANSFERS`, что и у `approve` (не права элемента, не членство
        в группе). `comment` обязателен. Уже рассмотренную заявку отклонить нельзя. В отличие от `approve` —
        FIR/аэропорт/прогресс обучения пользователя не трогает, только фиксирует решение.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment: { type: string }
      responses:
        '200': { description: "Отклонена (без data)", content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '400':
          description: "id отсутствует/некорректен, comment пуст, либо заявка уже рассмотрена"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                missing_comment: { value: { success: false, error: "comment is required" } }
                already_processed: { value: { success: false, error: "Transfer request has already been processed" } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: "Нет staff-возможности STUDENT_TRANSFERS", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Access denied" } } } }
        '404': { description: "Заявка не найдена", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Transfer request not found" } } } }
        '500': { description: "Не настроен RESULT enum", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /users/{login}:
    get:
      operationId: usersGet
      tags: [Users]
      summary: Пользователь по логину
      description: |
        Требует скоуп доступа (см. тег `Users`). Для ограниченного скоупа — дополнительно требуется, чтобы
        целевой пользователь состоял хотя бы в одной группе из области видимости вызывающего, иначе `403`.
      parameters:
        - $ref: '#/components/parameters/LoginPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/UserFull' } }
              example:
                success: true
                data:
                  id: 142
                  login: 1002030
                  name: Sergey
                  lastname: Ivanov
                  division: "ATC Division"
                  subdivision: "Moscow Center"
                  atc_rating: S1
                  pilots_rating: null
                  fir: { code: ULLL, name: { ru: "Москва", en: "Moscow" } }
                  airport: { code: UUEE, name: { ru: "Шереметьево", en: "Sheremetyevo" } }
                  discord: "123456789012345678"
                  groups: [atc-students]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: "Нет доступа по скоупу вообще, либо целевой пользователь вне области видимости вызывающего"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                no_access: { value: { success: false, error: "Access denied: insufficient rights to view users" } }
                out_of_scope: { value: { success: false, error: "Access denied: insufficient rights to view this user" } }
        '404': { description: Не найден, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

    patch:
      operationId: usersUpdate
      tags: [Users]
      summary: Обновить аэропорт пользователя (в пределах текущей FIR), либо его группы
      description: |
        Требует скоуп доступа (см. тег `Users`) — целевой пользователь ищется и проверяется на попадание в
        область видимости вызывающего **до** применения любого из режимов ниже (`404`/`403`, если не прошёл).
        Два непересекающихся режима в одном запросе, определяются по ключам тела:

        - Если передан ключ `groups` — обновляются группы пользователя (полная замена набора, не diff).
          Группы `admins` и `vatsim-data-protected` нельзя ни добавить, ни снять этим методом — проверка
          безусловная, не зависит от скоупа, изменение только вручную в админке. `vatrus-users` тоже нельзя
          изменить — её членством управляет только синхронизация с VATSIM (`VatsimMemberMapper`); передача/
          непередача этого кода в `groups` молча игнорируется, текущее членство сохраняется как есть. Для
          ограниченного скоупа (не admin/`edit_all_users`) — **каждый**
          добавляемый и **каждый** снимаемый код группы (не итоговый набор целиком) проверяется отдельно:
          нужно правило скоупа, у которого текущие группы цели попадают в `targetScope`, а сам код —
          разрешён в `grantableGroups` этого же правила; при первом же неавторизованном коде — `403` со
          списком всех кодов без разрешения. Отдельно, независимо от скоупа: роли инструктора
          (`atc-instructors`/`atc-mentors`/`atc-senior-instructors`) требуют географической привязки — в
          итоговом наборе должна остаться хотя бы одна группа `ins-<fir>`, иначе `400`; если ни одной из
          этих ролей в итоге не осталось, все `ins-<fir>` снимаются автоматически (без явной ошибки).
          Аналогично `region-staff` требует хотя бы одну `staff-<fir>` (иначе `400`), и все `staff-<fir>`
          снимаются автоматически, если `region-staff` не остаётся в наборе.
        - Иначе, если передан `airport_code` — обновляется он (пустая строка снимает значение).
          Обязан относиться к ТЕКУЩЕЙ FIR пользователя — иначе `400`; без какой-либо сохранённой FIR
          привязать аэропорт нельзя.

        **Смена самой FIR через эту ручку больше не поддерживается** (`fir_code` в теле → `400`, самообслуживание
        убрано) — единственный способ теперь `POST /users/transfers` (заявка на перевод между РПИ, см. тег
        `Users` → transfers, требует рассмотрения через `PATCH /users/transfers/{id}/approve`/`decline`).

        Изменения пишутся в историю (`HistoryService`).
      parameters:
        - $ref: '#/components/parameters/LoginPath'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [groups]
                  properties:
                    groups:
                      description: "Массив STRING_ID групп либо строка через запятую — полный набор, не diff"
                      oneOf:
                        - type: array
                          items: { type: string }
                        - type: string
                      example: [atc-students, ins-ullл]
                - type: object
                  properties:
                    airport_code: { type: string, example: UUEE, description: "Должен относиться к текущей FIR пользователя" }
            examples:
              set_airport: { value: { airport_code: UUEE } }
              clear_airport: { value: { airport_code: "" } }
              set_groups: { value: { groups: ["atc-students", "ins-ulll"] } }
      responses:
        '200': { description: Обновлено, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '400':
          description: "Передан fir_code (более не поддерживается этой ручкой), ни одного применимого поля не передано, `groups` не массив/строка, код аэропорта не найден, `airport_code` не относится к текущей FIR (или передан без какой-либо FIR), либо нарушена зависимость роль↔FIR-группа (см. описание)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                fir_not_supported: { value: { success: false, error: "Changing fir_code via this endpoint is no longer supported — use POST /users/transfers" } }
                no_fields: { value: { success: false, error: "No fields to update (fir_code, airport_code or groups required)" } }
                airport_no_fir: { value: { success: false, error: "Cannot set airport binding without a FIR" } }
                airport_wrong_fir: { value: { success: false, error: "Airport 'UUEE' does not belong to the target FIR" } }
                instructor_without_fir: { value: { success: false, error: "At least one ins-{fir} group is required when adding atc-instructors/atc-mentors/atc-senior-instructors" } }
                region_staff_without_fir: { value: { success: false, error: "At least one staff-{fir} group is required when adding region-staff" } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: "Нет доступа по скоупу вообще, целевой пользователь вне области видимости, конкретные группы вне разрешённых правилом скоупа, либо попытка тронуть группу admins/vatsim-data-protected"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                no_access: { value: { success: false, error: "Access denied: insufficient rights to edit users" } }
                out_of_scope: { value: { success: false, error: "Access denied: insufficient rights to edit this user" } }
                unauthorized_groups: { value: { success: false, error: "Access denied: cannot manage group(s): atc-senior-instructors" } }
                admins_add: { value: { success: false, error: "Cannot add admins group" } }
                admins_remove: { value: { success: false, error: "Cannot remove admins group" } }
                protected_add: { value: { success: false, error: "Cannot add vatsim-data-protected group" } }
                protected_remove: { value: { success: false, error: "Cannot remove vatsim-data-protected group" } }
        '404': { description: Пользователь не найден, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  # ============================= EXAMS =============================
  /exams:
    get:
      operationId: examsList
      tags: [Exams]
      summary: Список экзаменационных сессий с фильтрами
      description: |
        Показывает все сессии (и завершённые, и незавершённые). Без фильтров возвращает все сессии, доступные
        вызывающему. Доступ определяется так же, как в `GET /students`, ДОПОЛНИТЕЛЬНО пуская
        `atc-students`/`atc-graduates` — но строго к СОБСТВЕННЫМ сессиям: `student` из query игнорируется и
        принудительно подставляется логин самого вызывающего (запросить чужие сессии так нельзя). Для
        `atc-instructors`/`atc-mentors` без более широкой группы: если `fir` не передан — подставляется весь
        доступный вызывающему список FIR (объединение нескольких `ins-<fir>`, если он состоит сразу в
        нескольких); если передан — сужается до пересечения с этим списком (FIR вне зоны доступа даёт пустой
        результат, а не игнорируется и не расширяет выдачу).

        Принимает внешний ключ сектора `exams_comments` (см. общий раздел "Внешние API-ключи").
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ActorQuery'
        - name: student
          in: query
          description: "Логин студента — если передан, показываются только его сессии"
          schema: { type: string }
        - name: fir
          in: query
          description: "Код FIR (раздел, в котором создана сессия) либо несколько через запятую. Неизвестный код — пустой результат, не ошибка."
          schema: { type: string, example: ULLL }
        - name: examType
          in: query
          description: "CODE типа экзамена (справочник типов). Неизвестный код — пустой результат, не ошибка."
          schema: { type: string, example: s2 }
        - $ref: '#/components/parameters/Page'
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PaginationMeta'
                          - type: object
                            properties: { items: { type: array, items: { $ref: '#/components/schemas/ExamListItem' } } }
              example:
                success: true
                data:
                  items:
                    - id: 501
                      student: { id: 118, login: 1002030, name: Sergey, lastname: Ivanov }
                      type: { id: 41, name: "S1 — Aerodrome control", session_type: t_checklist }
                      start_time: "2026-06-01T08:00:00+00:00"
                      finish_time: "2026-06-01T09:15:00+00:00"
                      result: pass
                      mark: "4.00"
                      program: legacy
                    - id: 512
                      student: { id: 118, login: 1002030, name: Sergey, lastname: Ivanov }
                      type: { id: 42, name: "S2 — Radar approach control", session_type: null }
                      start_time: "2026-07-10T09:00:00+00:00"
                      finish_time: null
                      result: null
                      mark: null
                      program:
                        category: fir_ullv
                        sort: 300
                        name: "S2 — зачёт по радарному наведению"
                        stage: s2_stage
                        description: null
                        cert: true
                        session_type: 42
                  total: 2
                  page: 1
                  pageSize: 20
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      operationId: examsCreate
      tags: [Exams]
      summary: Создать экзаменационную сессию
      description: |
        Раздел определяется по FIR студента (`UF_ATCTR_FIR`, при отсутствии — `unknown`). Требует право записи
        в этот раздел (группа `ins-<fir>`, либо admin/`edit_all_users`). Создатель автоматически добавляется
        экзаменатором и становится председателем (chairman) — без проверки его группы.

        Для обычных (не самостоятельных) типов создать можно ТОЛЬКО мероприятие из **текущего этапа**
        программы обучения студента — `current` из `GET /exams/{login}/progress` (первый незакрытый этап;
        в него входят все его элементы с привязанным типом, включая уже сданные части того же этапа).
        Несданная попытка этап не закрывает, поэтому пересдача — снова тот же тип из `current`. Типы
        будущих этапов и типы старой программы (вне `training_program`) создать нельзя — `422`; ранее
        созданные сессии остаются в истории. Второе условие: тип из `current` не должен быть уже сдан
        (`pass`/`appeal_pass`) — сданные части этапа остаются в `current`, но сдавать их заново нельзя,
        тоже `422`. Исключений нет, включая администраторов. Для выпускника (`atc-graduates`) программа
        считается пройденной целиком, `current` пуст — создать ему ничего нельзя (экзамены для выпускников
        базовыми ограничениями VATSIM не предусмотрены).
        Правило не касается самостоятельных типов (`ntp_1`), у них отдельный порядок — см. ниже.

        Каждый логин из `examiners` проверяется на квалификацию (та же логика, что и в
        `POST /exams/{id}/examiners`): для типа `p_exam` допускаются только `atc-instructors`/`atc-senior-instructors`;
        для остальных типов — дополнительно `atc-mentors`. Несоответствующий пользователь отклоняет весь запрос.

        Для типов из списка "самостоятельных" (сейчас только `ntp_1` — письменный зачёт) правила иные: раздел
        фиксированный (`initial`, не по FIR), `examiners` из тела игнорируется — единственным экзаменатором
        становится сам создатель. Создать такую сессию может ТОЛЬКО сам сдающий и ТОЛЬКО для самого себя:
        `student` (в теле) обязан совпадать с логином создателя, а создатель — состоять в `atc-applicants`
        либо `atc-students`. Исключений нет ни для инструкторов, ни для менторов, ни для стаффа, ни для
        администраторов — результат ntp_1 служит гейтом выбора РПИ (`PATCH /trainingrequests/{id}/fir`), и
        сессию на чужое имя не должен уметь создать никто (иначе её можно прорешать за другого или намеренно
        провалить ему попытки). Пока у студента есть незавершённая сессия этого типа (`finish_time` пуст) —
        новую создать нельзя (`409`, в тексте ошибки — ID существующей): сначала нужно её пройти. Вопросы из пула `QUESTIONS_CATEGORY`/`QUESTIONS` типа
        группируются по `NAME` элемента вопроса (это ТЕМА, не сам вопрос — вопрос в `PREVIEW_TEXT`, см.
        `GET /exams/{id}`), и из КАЖДОЙ темы случайно берётся ровно 3 вопроса, фиксируются в сессии — не
        "сколько есть", а строго по 3 с каждой темы (сейчас в пуле 10 тем, итог — 30 вопросов). `500`, если в
        какой-то теме вопросов меньше 3. Сразу после создания элемент запирается индивидуальными правами: у
        `atc-applicants` — "Нет доступа", у создателя — "Изменение" (иначе другой абитуриент со стандартным правом на раздел видел бы
        и мог редактировать чужую сессию). Если у студента уже выбран РПИ — группе `ins-<fir>` этого РПИ
        дополнительно выдаётся "Чтение" (инструкторы/менторы смотрят ответы абитуриента перед `accept` заявки,
        `GET /exams/{id}`; ID сессий — в `ntp1.attempts` заявки). При выборе/смене РПИ (`PATCH
        /trainingrequests/{id}/fir`, `accept`) и отказе по заявке это право перевыставляется на уже
        существующие сессии автоматически.

        Для самостоятельных типов дополнительно может быть включён cooldown между попытками (настройка
        модуля, выключено по умолчанию): если последняя ЗАВЕРШЁННАЯ попытка студента ЭТОГО ЖЕ типа не сдана
        (любой результат кроме `pass`), новую сессию нельзя создать некоторое время после `finish_time` той
        попытки — `2`/`24`/`168`/`720` часов после 1-й/2-й/3-й/4-й-и-далее подряд неудачной попытки. Пока
        cooldown активен — `429`.

        Принимает внешний ключ сектора `exams_comments` (см. общий раздел "Внешние API-ключи") — `actor` в теле.
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [student, exam_type]
              properties:
                student: { type: string, description: Логин студента, example: 1002030 }
                exam_type:
                  description: "ID элемента справочника типов экзаменов, либо его символьный CODE (например `ntp_1`)"
                  oneOf: [{ type: integer }, { type: string }]
                  example: 42
                examiners: { type: array, items: { type: string }, description: "Логины дополнительных экзаменаторов (создатель добавляется автоматически, без проверки квалификации). Игнорируется для самостоятельных типов (ntp_1) — экзаменатор только создатель" }
                actor: { type: string, description: "Логин, от чьего имени создаётся сессия — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key внешнего ключа, игнорируется при обычном Bearer JWT", example: i.petrov }
      responses:
        '200':
          description: Создан
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: object, properties: { id: { type: integer } } } } }]
              example: { success: true, data: { id: 523 } }
        '400':
          description: "student/exam_type не переданы, exam_type не найден, либо один из examiners не instructor/mentor для данного типа"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_instructor: { value: { success: false, error: "User is not an instructor" } }
                not_instructor_or_mentor: { value: { success: false, error: "User is not an instructor or mentor" } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: "Нет права записи в раздел FIR студента (обычные типы); для самостоятельных типов (ntp_1) — вызывающий не в atc-applicants/atc-students, либо student в теле не равен его собственному логину (для всех без исключения)"
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '404': { description: "Студент не найден, либо один из examiners не найден", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '422':
          description: "Обычный тип: он не входит в текущий этап программы обучения студента (будущий этап, тип старой программы, либо программа студента пройдена), либо уже сдан студентом"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_current: { value: { success: false, error: "Exam type is not part of the current stage of the student training program" } }
                already_passed: { value: { success: false, error: "Student has already passed this exam type" } }
        '409':
          description: "Самостоятельный тип (ntp_1): у студента уже есть незавершённая сессия этого типа"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, error: "You already have an unfinished session of this type (id 1502) — finish it first" }
        '429':
          description: "Cooldown активен после несданной предыдущей попытки того же самостоятельного типа (см. описание)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, error: "Cooldown active after a failed attempt: try again in 5 hour(s), available at 13.08.2026 02:00 (server time)" }
        '500': { description: "Ошибка Bitrix при создании, либо для самостоятельных типов — в пуле вопросов типа меньше 10 вопросов", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /exams/program:
    get:
      operationId: examsGetProgram
      tags: [Exams]
      summary: Учебная программа (все этапы подготовки)
      description: |
        Все активные элементы инфоблока `training_program`, видимые вызывающему по факту (`CHECK_PERMISSIONS`
        на разделы и элементы — учитывает права, назначенные на любом уровне дерева: инфоблок/раздел/элемент,
        а не только на корень инфоблока), по порядку: сначала разделы по своей сортировке, внутри раздела —
        элементы тоже по сортировке. `data` — плоский массив (без обёртки `items`/пагинации). Если реально
        видимых элементов нет, но инфоблок при этом не пуст — `403` (не пустой массив): это означает, что у
        вызывающего нет доступа ни к одному из существующих элементов, а не что программа пуста. Кеш — с
        ключом по ID вызывающего (видимость зависит от прав).

        Принимает внешний ключ сектора `exams_comments` (см. общий раздел "Внешние API-ключи").
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ActorQuery'
        - name: category
          in: query
          description: "CODE раздела инфоблока training_program — сужает результат до этого раздела. Неизвестный код — пустой список, не ошибка. Фильтрует уже прочитанный (по правам вызывающего) список, кеш program_{actorId} общий для всех category"
          schema: { type: string }
          example: theory
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/TrainingProgramItem' } } } }]
              example:
                success: true
                data:
                  - category: theory
                    sort: 100
                    name: "Основы фразеологии"
                    stage: t_checklist
                    description: "Вводный курс перед зачётом по теории"
                    cert: true
                    session_type: 41
                  - category: theory
                    sort: 200
                    name: "Схемы аэродрома"
                    stage: null
                    description: null
                    cert: false
                    session_type: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { description: "Инфоблок training_program не найден", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /exams/{login}/progress:
    get:
      operationId: examsGetProgress
      tags: [Exams]
      summary: Прогресс студента по учебной программе (сдано/текущее/предстоящее)
      description: |
        Заменяет удалённый `GET /exams/next/{login}`. Раскладка по применимой студенту программе (`training_program`
        раздела `initial` + его FIR-секции, либо `default`, если для FIR своей секции нет — см. `GET /exams/program`):

        - `past` — вся реальная история ЗАВЕРШЁННЫХ сессий (`RESULT` заполнен — и сданные, и несданные/
          отменённые любым результатом), включая до-миграционную, по возрастанию времени сдачи. **BREAKING**:
          раньше поле называлось `passed` и показывало только `result=pass` — несданные/отменённые попытки
          полностью выпадали из прогресса студента; теперь под новым именем видна вся история завершённых
          попыток.
        - `current` — этап программы, ещё не пройденный целиком (может быть несколько элементов с одинаковым
          `sort` — все обязательны для завершения этапа); при смене FIR на кастомную секцию точка отсчёта
          откатывается на начало ТЕКУЩЕЙ стадии (`stage`) в новой программе, а не в самое начало.
        - `future` — всё, что дальше по программе.
        - Для ВЫПУСКНИКА (группа `atc-graduates`, рейтинг C1+) `current`/`future` всегда пустые массивы —
          программа считается пройденной целиком независимо от того, по какой именно программе (старой или
          новой) он фактически учился; `past` при этом отдаёт полную реальную историю как обычно.

        `past` — обычные сессии, тот же вид, что в `GET /exams` (`ExamListItem`), ПЛЮС `chairman` — председатель
        аттестационной комиссии (создатель сессии, `CREATED_BY`), которого в `GET /exams` нет: добавлен только
        здесь. `current`/`future` — реальной сессии ещё нет, поэтому это ДРУГОЙ, более узкий вид
        (`student`/`type`/`program` — без `id`/`start_time`/`finish_time`/`result`/`mark`: поля просто
        отсутствуют в объекте, не `null`).
        Владелец токена/actor всегда видит свой собственный прогресс (`login` в пути совпадает с его
        логином) — это не то же самое, что доступ к разделу студентов вообще, и обходит проверку ниже.
        Для остальных — та же проверка, что и в `GET /exams` со скоупом по FIR (см. тег): для инструктора/
        ментора без более широкой группы — только если студент в его FIR.

        Принимает внешний ключ сектора `exams_comments` (см. общий раздел "Внешние API-ключи").
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/LoginPath'
        - $ref: '#/components/parameters/ActorQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          past:
                            type: array
                            items:
                              allOf:
                                - $ref: '#/components/schemas/ExamListItem'
                                - type: object
                                  properties:
                                    chairman: { $ref: '#/components/schemas/UserBrief' }
                          current: { type: array, items: { $ref: '#/components/schemas/ExamProgramStageItem' } }
                          future: { type: array, items: { $ref: '#/components/schemas/ExamProgramStageItem' } }
              example:
                success: true
                data:
                  past:
                    - id: 501
                      student: { id: 118, login: 1002030, name: Sergey, lastname: Ivanov }
                      type: { id: 41, name: "S1 — Aerodrome control", session_type: t_checklist }
                      start_time: "2026-06-01T08:00:00+0000"
                      finish_time: "2026-06-01T09:15:00+0000"
                      result: pass
                      mark: "4.00"
                      program: legacy
                      chairman: { id: 55, login: a.smith, name: Alice, lastname: Smith }
                    - id: 505
                      student: { id: 118, login: 1002030, name: Sergey, lastname: Ivanov }
                      type: { id: 41, name: "S1 — Aerodrome control", session_type: t_checklist }
                      start_time: "2026-05-20T08:00:00+0000"
                      finish_time: "2026-05-20T09:10:00+0000"
                      result: fail2
                      mark: "1.50"
                      program: legacy
                      chairman: { id: 55, login: a.smith, name: Alice, lastname: Smith }
                  current:
                    - student: { id: 118, login: 1002030, name: Sergey, lastname: Ivanov }
                      type: { id: 42, name: "S2 — Radar approach control", session_type: null }
                      program:
                        category: fir_ullv
                        sort: 300
                        name: "S2 — зачёт по радарному наведению"
                        stage: s2_stage
                        description: null
                        cert: true
                        session_type: 42
                  future: []
        '400': { description: "login отсутствует", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Missing login parameter" } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Студент не найден, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /exams/appeals:
    get:
      operationId: examsAppealsList
      tags: [Exams]
      summary: Список апелляций к аттестационным мероприятиям, видимых вызывающему (с пагинацией)
      description: |
        `CHECK_PERMISSIONS=Y` — видны только апелляции, на которые у вызывающего есть право чтения элемента
        (инфоблок `appeals`): подавший апелляцию студент, любой из `EXAMINERS` сессии, `atc-senior-instructors`,
        либо `staff-<fir>` — где `<fir>` РПИ студента; `vatrus-users` и `region-staff` — явный запрет на элементе
        (`region-staff` видит апелляции только через членство в `staff-<fir>` РПИ студента). Обычная пагинация `items`/`total`/`page`/`pageSize`, сортировка по убыванию ID.

        Карточка экзамена `exam` в каждой апелляции урезается, если её смотрит сам сдававший студент: поля
        `comments` (комментарии инструкторов) и `marks` (оценки экзаменаторов по вопросам) приходят пустыми
        массивами. Остальное (`type`, даты, `examiners`, `questions`, `result`, `result_mark`) отдаётся. Полная
        карточка — рецензентам (возможность `exam_appeals`, админ), `atc-senior-instructors` и всем, кто не
        является сдававшим.

        Принимает внешний ключ сектора `exams_comments` (см. общий раздел "Внешние API-ключи").
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ActorQuery'
        - $ref: '#/components/parameters/Page'
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { allOf: [{ $ref: '#/components/schemas/PaginationMeta' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/AppealItem' } } } }] } } }]
              example:
                success: true
                data:
                  items:
                    - id: 7
                      created_time: "2026-09-02T17:00:00+0300"
                      created_by: { id: 118, login: 1002030, name: Sergey, lastname: Ivanov }
                      exam: null
                      text: "Экзаменатор не учёл..."
                      judge: null
                      result: null
                      edited_time: "2026-09-02T17:00:00+0300"
                  total: 1
                  page: 1
                  pageSize: 20
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { description: "Инфоблок appeals не найден", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /exams/appeals/{id}:
    get:
      operationId: examsAppealsGet
      tags: [Exams]
      summary: Апелляция по ID
      description: "`CHECK_PERMISSIONS=Y`, те же права, что у списка (см. выше). Отсутствие права и отсутствие элемента неразличимы — оба дают 404. Для самого сдававшего студента `exam.comments` и `exam.marks` пустые (как в списке). Принимает внешний ключ сектора `exams_comments`."
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/ActorQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/AppealItem' } } }] }
        '400': { description: "id отсутствует/некорректен", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: "Не найдена, либо нет прав на чтение", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Appeal not found" } } } }

  /exams/appeals/{id}/approve:
    patch:
      operationId: examsAppealsApprove
      tags: [Exams]
      summary: Одобрить апелляцию
      description: |
        Рассмотрение — ОТДЕЛЬНАЯ проверка от `GET`-ручек выше: staff-возможность `EXAM_APPEALS`
        ("Рассмотрение апелляций к аттестационным мероприятиям"), элемент читается БЕЗ `CHECK_PERMISSIONS`
        (тот же паттерн, что `STUDENT_TRANSFERS` у `PATCH /users/transfers/{id}/approve`). Затем `RESULT`
        самой апелляции → "одобрено", `JUDGE` → вызывающий. Повторное рассмотрение уже обработанной
        апелляции — `400`.

        Тело запроса необязательно целиком; `RESULT` соответствующей сессии определяется по приоритету:

        - `result` передан — RESULT сессии выставляется В ТОЧНОСТИ в указанное значение (XML_ID элемента
          списка свойства RESULT инфоблока `exsession`); `mark` при этом не пересчитывается вовсе (пишется
          как есть, только если тоже передан).
        - иначе, `mark` передан — рассматривающий меняет саму оценку сессии (число, не больше двух знаков
          после точки); RESULT определяется сравнением новой оценки с `MIN_MARK` типа мероприятия — работает
          в обе стороны: ранее сданная сессия с оценкой ниже порога становится `appeal_cancelled`, ранее
          несданная с оценкой не ниже порога — `appeal_pass`.
        - ни то ни другое не передано — исходное поведение: RESULT переключается на противоположный (было
          `pass` → `appeal_cancelled`; было что угодно другое, в т.ч. ещё не выставлен, → `appeal_pass`), и,
          если текущий `mark` сессии не задан или ниже 4.00, принудительно выставляется `mark=4.00`.

        Принимает внешний ключ сектора `exams_comments` (см. общий раздел "Внешние API-ключи") — `actor` в
        теле; `JUDGE` в этом случае — сам `actor`, не ключ.
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                result: { type: string, nullable: true, description: "XML_ID нового значения RESULT сессии (exsession) — приоритетнее mark и дефолтного переключения", example: "9b16bcf88a386dab883d1804c2d08570" }
                mark: { type: number, nullable: true, description: "Новая оценка сессии, не больше двух знаков после точки (учитывается, только если result не передан)", example: 4.2 }
                actor: { type: string, description: "Логин, от чьего имени рассматривается апелляция — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key внешнего ключа, игнорируется при обычном Bearer JWT", example: i.petrov }
      responses:
        '200': { description: Одобрена, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '400':
          description: "id отсутствует/некорректен, апелляция уже рассмотрена, mark не является числом с ≤2 знаками после точки, либо result — неизвестный XML_ID"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                already_processed: { value: { success: false, error: "Appeal has already been processed" } }
                bad_mark: { value: { success: false, error: "mark must be a number with at most 2 decimal places (e.g. 4, 4.1, 4.12)" } }
                bad_result: { value: { success: false, error: "RESULT enum value 'bad-xml-id' (exsession) not found" } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: "Нет staff-возможности EXAM_APPEALS", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Access denied" } } } }
        '404': { description: "Апелляция или связанная с ней сессия не найдены", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500':
          description: "У апелляции не привязан экзамен, у типа сессии не задан MIN_MARK (при переданном mark), не найдены нужные дефолтные значения RESULT в справочнике, либо ошибка Bitrix"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, error: "MIN_MARK is not configured for this exam type" }

  /exams/appeals/{id}/decline:
    patch:
      operationId: examsAppealsDecline
      tags: [Exams]
      summary: Отклонить апелляцию
      description: |
        Та же проверка, что и `approve` (staff-возможность `EXAM_APPEALS`), но `RESULT` соответствующей сессии
        не трогается — меняется только `RESULT` апелляции ("отклонено") и `JUDGE`. Повторное рассмотрение уже
        обработанной апелляции — `400`.

        Принимает внешний ключ сектора `exams_comments` (см. общий раздел "Внешние API-ключи") — `actor` в теле.
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                actor: { type: string, description: "Логин, от чьего имени рассматривается апелляция — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key внешнего ключа, игнорируется при обычном Bearer JWT", example: i.petrov }
      responses:
        '200': { description: Отклонена, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '400':
          description: "id отсутствует/некорректен, либо апелляция уже рассмотрена"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, error: "Appeal has already been processed" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: "Нет staff-возможности EXAM_APPEALS", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Access denied" } } } }
        '404': { description: Апелляция не найдена, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { description: "Не найдено нужное значение RESULT в справочнике, либо ошибка Bitrix", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /exams/{id}:
    get:
      operationId: examsGet
      tags: [Exams]
      summary: Детали экзаменационной сессии
      description: "Доступ определяется стандартными правами Bitrix IBlock ACL на элемент инфоблока экзаменов (`exsession`), не кастомной логикой FIR. Принимает внешний ключ сектора `exams_comments`. Для самостоятельных типов (`ntp_1`) `questions` — пустой массив, пока сессия не начата (`start_time` = null, `PATCH /exams/{id}/start`): вопросы отдаются только после старта, иначе пул можно выгрузить, не запуская таймер."
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/ActorQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/ExamDetail' } } }]
              example:
                success: true
                data:
                  student: { id: 118, login: 1002030, name: Sergey, lastname: Ivanov }
                  atc_rating: "TWR/APP Rated"
                  type: { id: 42, name: "S2 — Radar approach control", session_type: null }
                  examiners:
                    - { id: 55, login: a.smith, name: Alice, lastname: Smith, is_chairman: true }
                    - { id: 61, login: b.brown, name: Bob, lastname: Brown, is_chairman: false }
                  start_time: "2026-07-10T09:00:00+00:00"
                  finish_time: "2026-07-10T10:30:00+00:00"
                  finished_by: { id: 55, login: a.smith, name: Alice, lastname: Smith }
                  questions:
                    - question_id: 301
                      question: "Circuit procedures"
                      text: "..."
                      weight: "1.50"
                      can_be_skipped: false
                      answers:
                        - { index: 1, text: "Enter downwind" }
                        - { index: 2, text: "Enter base" }
                      answer_type: radio
                      time_limit: "60"
                      given_answer: "1"
                    - question_id: 302
                      question: "Emergency handling"
                      text: "..."
                      weight: "2.00"
                      can_be_skipped: true
                      answers: null
                      answer_type: input
                      time_limit: null
                      given_answer: null
                  result: pass
                  result_mark: "4.20"
                  marks:
                    - examiner: { id: 55, login: a.smith, name: Alice, lastname: Smith, is_chairman: true }
                      scores: [{ question_id: 301, mark: 4 }, { question_id: 302, mark: 5 }]
                  comments:
                    - comment_date: "2026-07-10T10:31:00+00:00"
                      comment_by: { id: 55, login: a.smith, name: Alice, lastname: Smith }
                      text: "Solid performance"
                      is_alert: true
        '400': { description: "id отсутствует/некорректен", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Экзамен не найден, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /exams/{id}/examiners:
    post:
      operationId: examsAddExaminers
      tags: [Exams]
      summary: Добавить экзаменаторов к сессии
      description: |
        Каждый логин проверяется на квалификацию по типу сессии: для типа `p_exam` (CODE справочника типов)
        добавить можно только участников групп `atc-instructors`/`atc-senior-instructors`; для остальных типов —
        дополнительно `atc-mentors`. Пользователь вне этих групп добавлен быть не может — запрос целиком
        отклоняется с 400 при первом же несоответствующем логине.

        Право писать в сессию: для обычных типов — запись в раздел FIR сессии (группа `ins-<fir>`, либо
        admin/`edit_all_users`); для самостоятельных типов (`ntp_1`) раздел `initial` не привязан ни к какой
        FIR, поэтому проверяется индивидуальное право "Изменение" на сам элемент (то же, что `POST /exams`
        выдаёт создателю при создании).

        Принимает внешний ключ сектора `exams_comments` (см. общий раздел "Внешние API-ключи") — `actor` в теле.
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [examiners]
              properties:
                examiners: { type: array, items: { type: string }, description: Логины, minItems: 1, example: [c.jones] }
                actor: { type: string, description: "Логин, от чьего имени добавляются экзаменаторы — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key внешнего ключа, игнорируется при обычном Bearer JWT", example: i.petrov }
      responses:
        '200': { description: Добавлены (дубликаты с уже назначенными игнорируются), content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '400':
          description: "examiners не передан/пуст/не массив, экзамен уже завершён, либо один из логинов не instructor/mentor для данного типа"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                empty: { value: { success: false, error: "No examiners provided" } }
                finished: { value: { success: false, error: "Exam session already finished" } }
                not_instructor: { value: { success: false, error: "User is not an instructor" } }
                not_instructor_or_mentor: { value: { success: false, error: "User is not an instructor or mentor" } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: "Экзамен не найден, либо один из логинов не найден"
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '500': { description: Ошибка Bitrix, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /exams/{id}/appeal:
    post:
      operationId: examsCreateAppeal
      tags: [Exams]
      summary: Подать апелляцию к сессии
      description: |
        Подать может: сам сдававший студент, любой из `EXAMINERS` этой сессии, любой участник
        `atc-senior-instructors`, либо участник `staff-<fir>` — где `<fir>` РПИ студента, сдававшего экзамен.
        Только в течение 24 часов после `finish_time` сессии — дальше окно закрыто (`403`); сессия при этом
        должна быть уже завершена (`400`, если `finish_time` ещё `null`). У сессии не может быть больше одной
        апелляции (не только в рамках вызывающего — вообще, `403`). При создании элементу инфоблока `appeals`
        выставляются индивидуальные права чтения на то же множество пользователей (см. описание доступа
        `GET /exams/appeals`), плюс явный запрет `vatrus-users`.

        Принимает внешний ключ сектора `exams_comments` (см. общий раздел "Внешние API-ключи") — `actor` в теле.
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, description: "Текст апелляции (DETAIL_TEXT)", example: "Экзаменатор не учёл..." }
                actor: { type: string, description: "Логин, от чьего имени подаётся апелляция — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key внешнего ключа, игнорируется при обычном Bearer JWT", example: i.petrov }
      responses:
        '200':
          description: Создана
          content:
            application/json:
              schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: object, properties: { id: { type: integer } } } } }] }
              example: { success: true, data: { id: 7 } }
        '400':
          description: "text не передан/пуст, либо сессия ещё не завершена (finish_time = null)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                empty_text: { value: { success: false, error: "text is required" } }
                not_finished: { value: { success: false, error: "Exam is not finished yet" } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: "Вызывающий не вправе подать апелляцию к этой сессии, окно (24ч после finish_time) истекло, либо апелляция по ней уже существует"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_eligible: { value: { success: false, error: "Access denied" } }
                window_expired: { value: { success: false, error: "Appeal window (24h after exam finish) has expired" } }
                already_exists: { value: { success: false, error: "An appeal already exists for this exam" } }
        '404': { description: Экзамен не найден, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { description: Ошибка Bitrix, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /exams/{id}/createRatingRequest:
    post:
      operationId: examsCreateRatingRequest
      tags: [Exams]
      summary: Ручное создание заявки на рейтинг (досрочно, до автоматического создания через 48 часов)
      description: |
        Автоматически заявка на рейтинг создаётся сразу после сдачи (`RESULT=pass`/`appeal_pass`), но неактивной
        (в ожидании), и активируется часовым агентом через 48 часов после `finish_time` сессии (если результат не
        изменился и нет висящей апелляции; `RatingRequestAutoCreateService`). Эта ручка активирует такую заявку
        раньше (или создаёт её, если её ещё нет) — как только результат уже нельзя пересмотреть (условия ниже),
        — а также служит подстраховкой для сессий, которые агент не обрабатывает (завершённых до перехода на
        отложенное создание, 15.10.2026).

        Доступ (любое из трёх): создатель сессии, старший инструктор, ранее её подтвердивший
        (`PATCH /exams/{id}/seniorInsApprove`), либо стафф с правом `EXAM_APPEALS`.

        Условия готовности: тип сессии практический (`NEW_RATING` заполнен у типа); `RESULT` — `pass` или
        `appeal_pass`; сессия завершена; рассмотрение старшим инструктором завершено ЛИБО истекло его
        24-часовое окно (см. `PATCH /exams/{id}/seniorInsApprove`); нет висящей (нерассмотренной) апелляции
        И истекло 24-часовое окно на подачу новой (см. `POST /exams/{id}/appeal`) — уже одобренная/отклонённая
        апелляция создание не блокирует. Дедуп по `CODE`: своя схема (`rat_req_{login}_{rating}`) и схема
        автосоздания (`exsession-{id}`) — если агент уже создал заявку на этот же экзамен, повторно не
        создаётся; агент, в свою очередь, не создаёт заявку, если по сессии уже есть созданная вручную.

        Принимает внешний ключ сектора `exams_comments` (см. общий раздел "Внешние API-ключи") — `actor` в теле.
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                actor: { type: string, description: "Логин, от чьего имени выполняется запрос — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key внешнего ключа, игнорируется при обычном Bearer JWT", example: i.petrov }
      responses:
        '200':
          description: Создана
          content:
            application/json:
              schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: object, properties: { id: { type: integer } } } } }] }
              example: { success: true, data: { id: 88 } }
        '400':
          description: "Тип сессии не подходит, RESULT не pass/appeal_pass, сессия не завершена, рассмотрение старшим инструктором/окно апелляции ещё не истекли, заявка на этот экзамен уже существует, либо у студента уже есть неисполненная заявка на тот же рейтинг"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_qualifying: { value: { success: false, error: "This exam type does not qualify for a rating request" } }
                not_passed: { value: { success: false, error: "Exam is not in a passed state" } }
                senior_ins_pending: { value: { success: false, error: "Exam has not been reviewed by a senior instructor yet, and the review window has not expired" } }
                appeal_pending: { value: { success: false, error: "There is a pending appeal for this exam" } }
                appeal_window_open: { value: { success: false, error: "The appeal window has not expired yet" } }
                already_exists: { value: { success: false, error: "A rating request for this exam/rating already exists" } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: "Вызывающий не создатель сессии, не подтверждавший её старший инструктор и не стафф с правом EXAM_APPEALS", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Access denied" } } } }
        '404': { description: Экзамен или студент не найден, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { description: "Инфоблок ratingrequests не найден, либо ошибка Bitrix", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /exams/{id}/seniorInsApprove:
    patch:
      operationId: examsSeniorInsApprove
      tags: [Exams]
      summary: Подтвердить результат практического экзамена (старший инструктор)
      description: |
        Только для типов сессии с заполненным `NEW_RATING` у типа экзамена ("практический" экзамен с выдачей
        рейтинга) — для остальных `400`. Доступ: актор ОДНОВРЕМЕННО в `atc-senior-instructors` И
        `ins-<fir>` — где `<fir>` РПИ СТУДЕНТА (не актора). Окно — 24 часа с `finish_time` сессии, то же
        поле, что ограничивает подачу апелляции; дальше — `400`. Если на сессию заведена апелляция В ЛЮБОМ
        статусе (на рассмотрении/одобрена/отклонена) — тоже `400`: апелляция и подтверждение старшим
        инструктором — взаимоисключающие пути пересмотра результата. Повторное подтверждение — `400`.
        Не меняет `RESULT` сессии — только фиксирует факт подтверждения (внутренне, эти поля не
        возвращаются ни в одном ответе API).

        Принимает внешний ключ сектора `exams_comments` (см. общий раздел "Внешние API-ключи") — `actor` в
        теле; проверка прав (членство в `atc-senior-instructors`/`ins-<fir>`) — для `actor`.
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                actor: { type: string, description: "Логин, от чьего имени подтверждается результат — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key внешнего ключа, игнорируется при обычном Bearer JWT", example: i.petrov }
      responses:
        '200': { description: Подтверждено, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '400':
          description: "id некорректен, тип сессии не требует подтверждения, уже подтверждена, сессия не завершена, окно истекло, либо есть апелляция"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_applicable: { value: { success: false, error: "This exam type does not require senior instructor review" } }
                already_reviewed: { value: { success: false, error: "Exam has already been reviewed by a senior instructor" } }
                not_finished: { value: { success: false, error: "Exam is not finished yet" } }
                window_expired: { value: { success: false, error: "Review window (24h after exam finish) has expired" } }
                has_appeal: { value: { success: false, error: "An appeal exists for this exam — senior instructor review is not available" } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: "Актор не в atc-senior-instructors и/или не в ins-<fir> студента", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Access denied" } } } }
        '404': { description: Экзамен не найден, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { description: "У сессии не привязаны студент/тип, либо инфоблок exsession не найден", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /exams/{id}/seniorInsDecline:
    patch:
      operationId: examsSeniorInsDecline
      tags: [Exams]
      summary: Отклонить результат практического экзамена, назначив новый RESULT (старший инструктор)
      description: |
        Та же проверка доступа/окна/апелляций, что и `seniorInsApprove` (см. выше), но дополнительно
        принимает новый `result` в теле — сырой XML_ID значения свойства RESULT инфоблока `exsession` (не
        человекочитаемый код `ExamResult` — код в код не транслируется, передаётся как есть) — и
        перезаписывает им `RESULT` сессии одновременно с фиксацией подтверждения. `decline()` не может
        выставить ПРОХОДНОЙ результат (`pass`/`appeal_pass`) — это семантически `seniorInsApprove`, не
        `seniorInsDecline`, `400`.

        Принимает внешний ключ сектора `exams_comments` (см. общий раздел "Внешние API-ключи") — `actor` в теле.
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: { type: string, description: "XML_ID нового значения RESULT (exsession), не код ExamResult, не pass/appeal_pass", example: "ce1583ff1b83fc381d8197ff3ceaff21" }
                actor: { type: string, description: "Логин, от чьего имени выполняется запрос — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key внешнего ключа, игнорируется при обычном Bearer JWT", example: i.petrov }
      responses:
        '200': { description: Отклонено, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '400':
          description: "id/result некорректны (в т.ч. неизвестный XML_ID или проходное значение), тип сессии не требует подтверждения, уже подтверждена, сессия не завершена, окно истекло, либо есть апелляция"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                empty_result: { value: { success: false, error: "result is required" } }
                passing_result: { value: { success: false, error: "decline() cannot set a passing RESULT — use approve() instead" } }
                bad_xml_id: { value: { success: false, error: "RESULT enum value 'bad-xml-id' (exsession) not found" } }
                not_applicable: { value: { success: false, error: "This exam type does not require senior instructor review" } }
                already_reviewed: { value: { success: false, error: "Exam has already been reviewed by a senior instructor" } }
                not_finished: { value: { success: false, error: "Exam is not finished yet" } }
                window_expired: { value: { success: false, error: "Review window (24h after exam finish) has expired" } }
                has_appeal: { value: { success: false, error: "An appeal exists for this exam — senior instructor review is not available" } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: "Актор не в atc-senior-instructors и/или не в ins-<fir> студента", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Access denied" } } } }
        '404': { description: Экзамен не найден, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { description: "У сессии не привязаны студент/тип, либо инфоблок exsession не найден", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /exams/{id}/start:
    patch:
      operationId: examsStart
      tags: [Exams]
      summary: Отметить фактическое начало сессии
      description: |
        Выставляет `START_TIME` на текущее время. `POST /exams` его не проставляет — до первого вызова этого
        эндпоинта `start_time` в ответах `null` (для самостоятельных типов вроде `ntp_1` отсюда же отсчитывается
        лимит времени на решение, см. `PATCH /exams/{id}/answers/{questionId}`/`PATCH /exams/{id}/timeout`).
        Идемпотентности нет — повторный вызов уже начатой сессии `400` (раньше молча переставлял `START_TIME`
        на новый момент, что для самостоятельных типов сбрасывало отсчёт лимита времени на решение). Право
        писать в сессию — та же проверка, что и в `POST /exams/{id}/examiners` (FIR-раздел для обычных типов,
        индивидуальное право на элемент для самостоятельных типов вроде `ntp_1`).

        Принимает внешний ключ сектора `exams_comments` (см. общий раздел "Внешние API-ключи") — `actor` в теле.
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                actor: { type: string, description: "Логин, от чьего имени выполняется запрос — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key внешнего ключа, игнорируется при обычном Bearer JWT", example: i.petrov }
      responses:
        '200':
          description: Начало сессии зафиксировано
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: object, properties: { start_time: { type: string, format: date-time } } } } }]
              example: { success: true, data: { start_time: "2026-07-16T14:32:00+0000" } }
        '400':
          description: "id отсутствует/некорректен, экзамен уже завершён, либо уже начат (повторный вызов)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                finished: { value: { success: false, error: "Exam session already finished" } }
                already_started: { value: { success: false, error: "Exam session already started" } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Экзамен не найден, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { description: Ошибка Bitrix, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /exams/{id}/marks:
    patch:
      operationId: examsSetMarks
      tags: [Exams]
      summary: Проставить/обновить оценки экзаменатора по вопросам
      description: |
        Диапазон допустимых оценок зависит от типа экзамена: для чек-листов (`t_checklist`/`p_checklist`) — `0` или `1`,
        для обычных экзаменов — `1`–`5`. Вызывающий должен сам быть экзаменатором этой сессии.
        Upsert по (экзамен, вопрос, логин экзаменатора).

        Принимает внешний ключ сектора `exams_comments` (см. общий раздел "Внешние API-ключи") — `actor` в
        теле; проверка "сам экзаменатор" — для `actor`.
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [marks]
              properties:
                marks:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [question_id, mark]
                    properties:
                      question_id: { type: integer, description: "Должен принадлежать типу этого экзамена" }
                      mark: { type: integer }
                actor: { type: string, description: "Логин, от чьего имени проставляются оценки — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key внешнего ключа, игнорируется при обычном Bearer JWT", example: i.petrov }
            example:
              marks:
                - { question_id: 301, mark: 4 }
                - { question_id: 302, mark: 5 }
      responses:
        '200': { description: Оценки сохранены, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '400':
          description: "marks пуст/не массив, вопрос не принадлежит типу экзамена, оценка вне диапазона, либо экзамен уже завершён"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, error: "Mark for question 301 must be between 1 and 5" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: "Вызывающий не является экзаменатором этой сессии"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, error: "Access denied: not an examiner of this session" }
        '404': { description: Экзамен/экзаменатор не найден, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /exams/{id}/finish:
    patch:
      operationId: examsFinish
      tags: [Exams]
      summary: Завершить экзаменационную сессию
      description: |
        `result` в теле — опционален и допускает только "неуспешные"/отменённые коды:
        `fail1`–`fail7`, `cancel1`–`cancel4`, `cancelgcap`. `pass`/`nopass` вычисляются автоматически и вручную
        не задаются. Если `result` не передан: для обычных типов считается взвешенное среднее оценок
        (по `weight` вопроса), `pass` при среднем ≥ `MIN_MARK` типа экзамена; для чек-листов — `pass`, если
        все обязательные (не `can_be_skipped`) вопросы в среднем ≥ 1.0.

        Разрешено только создателю сессии, участнику группы `atc-senior-instructors`, либо admin/`edit_all_users`.
        Минимальное число экзаменаторов и обязательность оценки по каждому не-skippable вопросу — из настроек типа экзамена.

        Принимает внешний ключ сектора `exams_comments` (см. общий раздел "Внешние API-ключи") — `actor` в теле.
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                result: { type: string, description: "Код ручного результата (fail*/cancel*)", example: fail3 }
                actor: { type: string, description: "Логин, от чьего имени завершается сессия — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key внешнего ключа, игнорируется при обычном Bearer JWT", example: i.petrov }
      responses:
        '200':
          description: Завершён
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: object, properties: { result: { type: string }, mark: { type: number, nullable: true, description: "null для чек-листов / при нулевом суммарном весе" } } } } }]
              example: { success: true, data: { result: pass, mark: 4.17 } }
        '400':
          description: "Некорректный код result, экзамен уже завершён, не хватает экзаменаторов, либо не все вопросы оценены"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                bad_result: { value: { success: false, error: "Invalid manual result code 'pass'" } }
                ungraded: { value: { success: false, error: "Question 302 has not been graded" } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: "Не создатель сессии, не senior-instructor и не admin"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, error: "Access denied: only the exam creator or a senior instructor can finish this session" }
        '404': { description: Экзамен не найден, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { description: "Не настроен MIN_MARK/RESULT для типа экзамена, либо ошибка Bitrix", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /exams/{id}/timeout:
    patch:
      operationId: examsTimeout
      tags: [Exams]
      summary: Закрыть письменный зачёт автофейлом по истечении времени (по инициативе фронта)
      description: |
        Только для самостоятельных типов (`ntp_1`). Фронт держит собственный таймер (сумма `time_limit`
        вопросов сессии) и по его истечении сам присылает этот запрос, не дожидаясь ответа абитуриента на
        последний вопрос — иначе недоотвеченная сессия осталась бы висеть незавершённой. **Бэкенд полностью
        доверяет клиентскому сигналу и не пересчитывает время** — по вызову сразу выставляется `RESULT=fail8`
        без проверки, действительно ли лимит истёк. Два дополнительных подстраховочных пути на случай, если
        фронт этот запрос вообще не пришлёт (закрыл вкладку/потерял связь): серверная проверка лимита внутри
        `PATCH /exams/{id}/answers/{questionId}` (срабатывает при ответе на последний вопрос), и — если
        абитуриент не ответил вообще ни на что после старта — часовой агент (`fail8`, `finished_by` остаётся
        `null`, в отличие от этой ручки, где finished_by — вызывающий).

        Принимает внешний ключ сектора `exams_comments` (см. общий раздел "Внешние API-ключи") — `actor` в теле.
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                actor: { type: string, description: "Логин, от чьего имени выполняется запрос — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key внешнего ключа, игнорируется при обычном Bearer JWT", example: i.petrov }
      responses:
        '200':
          description: Сессия закрыта автофейлом
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: object, properties: { finish_time: { type: string, format: date-time }, result: { type: string, enum: [fail8] } } } } }]
              example: { success: true, data: { finish_time: "2026-08-13T12:30:00+0000", result: fail8 } }
        '400':
          description: "id отсутствует/некорректен, экзамен уже завершён, не самостоятельного типа, либо сессия ещё не начата (нет start_time)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                finished: { value: { success: false, error: "Exam session already finished" } }
                not_self_service: { value: { success: false, error: "Timeout autofail is only available for self-service exam types" } }
                not_started: { value: { success: false, error: "Exam session has not been started" } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Экзамен не найден, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { description: Ошибка Bitrix, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /exams/{id}/answers/{questionId}:
    patch:
      operationId: examsSetAnswer
      tags: [Exams]
      summary: Записать ответ абитуриента на вопрос сессии
      description: |
        Для самостоятельных "письменных зачётов" (`ntp_1`) — абитуриент отвечает на вопросы своей сессии сам.
        Ответ хранится как есть (сырой текст: индексы выбранных вариантов через запятую — для вопросов со
        списком `answers`, свободный текст — для вопросов без него), доступен в `given_answer` вопроса
        (`GET /exams/{id}`). Upsert — повторный вызов на тот же вопрос перезаписывает предыдущий ответ.
        Право писать — то же, что у `PATCH /exams/{id}/start` (индивидуальное "Изменение" на элемент для
        самостоятельных типов).

        Как только этим вызовом отвечен ПОСЛЕДНИЙ вопрос сессии — сессия автоматически завершается (отдельно
        от `PATCH /exams/{id}/finish`, без участия инструктора): `finished_by` — сам абитуриент. Сначала
        проверяется лимит времени (сумма `time_limit` всех вопросов сессии + 180 сек буфера от `start_time`);
        при превышении — результат сразу `fail8` без расчёта оценки. Иначе оценка считается бинарно по каждому
        вопросу (без частичного зачёта), `mark = (сумма весов верных / сумма весов всех) * 5`, результат —
        `pass`/`nopass` по сравнению с `MIN_MARK` типа. Ответ на промежуточный вопрос сессию не завершает.

        Принимает внешний ключ сектора `exams_comments` (см. общий раздел "Внешние API-ключи") — `actor` в теле.
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: questionId
          in: path
          required: true
          description: "ID вопроса — должен принадлежать набору вопросов сессии (question_id из ExamDetail.questions)"
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { type: string, description: "Индексы вариантов через запятую (см. answers[].index вопроса) либо свободный текст", example: "2" }
                actor: { type: string, description: "Логин, от чьего имени записывается ответ — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key внешнего ключа, игнорируется при обычном Bearer JWT", example: i.petrov }
      responses:
        '200': { description: Ответ сохранён, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '400':
          description: "id/questionId отсутствуют/некорректны, answer пуст, вопрос не принадлежит сессии, сессия уже завершена, либо ещё не начата (PATCH /exams/{id}/start не вызывался)"
          content:
            application/json:
