              example: { success: true, data: { image_ids: [91, 92] } }
        '400': { description: "Файлы не переданы", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "No images uploaded" } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: "Нет прав на редактирование комментария", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { description: "Ни один файл не удалось сохранить, либо не определён FIR комментария", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

