  /common/lists-values:
    get:
      operationId: commonListsValuesGet
      tags: [Common]
      summary: Значения списочного свойства инфоблока (справочник для UI-выпадающих списков)
      description: |
        Универсальный доступ к значениям enum-свойств любого инфоблока. Приоритет параметров:
        1. `property_id` — напрямую фильтрует `CIBlockPropertyEnum` по `PROPERTY_ID`.
        2. `iblock`+`property` (CODE инфоблока и CODE свойства) — значения ровно этого свойства.
        3. `iblock` без `property` — значения **всех** списочных свойств этого инфоблока (пустой список, если
           у инфоблока нет списочных свойств вообще).
        4. Если не передано ничего — возвращаются значения **всех** списочных свойств **всех** инфоблоков.

        **Важно**: в отличие от всех остальных эндпоинтов `data` — это **голый массив**, не объект с `items`
        (ключи элементов при этом обычные lowercase, как везде в API).

        **Авторизация — не Bearer JWT**: единственный backend-to-backend эндпоинт API, авторизуется статическим
        ключом в заголовке `X-Api-Key` (сверка `hash_equals()` с `SERVICE_API_KEY` из `.env`), без привязки к
        пользователю Bitrix — прав по инфоблокам не проверяет вообще (раньше требовал R на 6 справочных
        инфоблоков, эта проверка удалена вместе с переходом на API-ключ).
      security:
        - apiKeyAuth: []
      parameters:
        - name: iblock
          in: query
          description: "CODE инфоблока. Без property — значения всех его списочных свойств (см. приоритет выше)"
          schema: { type: string }
          example: airports
        - name: property
          in: query
          description: "CODE свойства. Без iblock игнорируется"
          schema: { type: string }
          example: TYPE
        - name: property_id
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            property_id: { type: integer }
                            property_name: { type: string, nullable: true, description: "NAME свойства; null, если свойство не найдено батч-запросом (не должно происходить в норме)" }
                            iblock_code: { type: string, nullable: true, description: "CODE инфоблока, которому принадлежит свойство" }
                            value: { type: string }
                            xml_id: { type: string }
                            sort: { type: integer }
              example:
                success: true
                data:
                  - { id: 101, property_id: 22, property_name: "Тип", iblock_code: airports, value: "Международный", xml_id: international, sort: 100 }
                  - { id: 102, property_id: 22, property_name: "Тип", iblock_code: airports, value: "Местный", xml_id: local, sort: 200 }
        '400':
          description: "Указан iblock/property, но код не найден"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                bad_iblock: { value: { success: false, error: "Iblock with code bad_code not found" } }
                bad_property: { value: { success: false, error: "Property with code BAD_PROP not found in iblock airports" } }
        '401':
          description: "X-Api-Key не передан или не совпадает с SERVICE_API_KEY"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, error: "Invalid or missing API key" }
        '500':
          description: "SERVICE_API_KEY не сконфигурирован на сервере"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, error: "SERVICE_API_KEY is not configured" }

  /common/docs:
    get:
      operationId: commonDocsGet
      tags: [Common]
      summary: Справочные документы (инфоблок docs), сгруппированные по коду раздела
      description: |
        Публичная ручка (токен не нужен). Без параметра `section` — все активные элементы; с ним — только
        элементы этого раздела (неизвестный код — пустой результат, не ошибка).

        **`data` — не объект с `items` и не массив элементов**, а объект, сгруппированный по CODE раздела:
        `{ "<код раздела>": { code, name: {ru, en}, items: [<элемент>, ...] }, ... }`. **BREAKING**: раньше
        значением под ключом раздела был голый массив элементов — теперь объект-обёртка с `code`/`name`
        самого раздела и массивом элементов в `items`. `name.en` — `UF_NAME_EN` раздела (пользовательское
        поле раздела, НЕ путать с `PROPERTY_NAME_EN` элементов-документов внутри, см. `name` самого элемента
        ниже). Элемент вообще без раздела, либо раздел которого без `CODE` — из результата молча выпадает
        (для него просто нет ключа, куда его положить). **Важно**: если подходящих элементов нет вообще
        (например `section` не найден, либо инфоблок пуст), PHP-массив без ключей сериализуется в JSON как
        `[]` (пустой массив), а не `{}` (пустой объект) — тип `data` в этом крайнем случае отличается от
        непустого ответа.

        `link`/`file` — ключи ОТСУТСТВУЮТ в объекте элемента, если соответствующее свойство не заполнено (не
        `null`). `file.url` — АБСОЛЮТНАЯ ссылка (домен берётся из настройки сайта `main.server_name`, не из
        хоста текущего запроса — иначе в часовой кеш метода мог бы записаться домен захода через
        альтернативный хост для всех последующих запросов); `formatDocFile()` переиспользуется и в
        `GET /common/airports/{airportCode}/aip` (см. ниже). `code` — CODE элемента как есть, может быть
        пустой строкой, если не задан.

        Порядок — `SORT` по возрастанию, при равном `SORT` — `DATE_CREATE` по убыванию (новее выше); действует
        и на порядок ключей самого `data` (разделы), и на порядок `items` внутри каждого раздела.
      security: []
      parameters:
        - name: section
          in: query
          description: "CODE раздела инфоблока docs — фильтр. Неизвестный код: пустой результат, не ошибка"
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: { $ref: '#/components/schemas/DocBucket' }
              example:
                success: true
                data:
                  general:
                    code: general
                    name: { ru: "Общие документы", en: "General documents" }
                    items:
                      - code: reglament
                        name: { ru: "Регламент аттестации", en: "Certification regulations" }
                        description: { ru: "Порядок проведения аттестационных мероприятий", en: "Certification procedure" }
                        file: { name: "reglament.pdf", url: "https://vatrus.info/upload/iblock/docs/reglament.pdf", size: 245760, uploaded_at: "2026-08-01T10:00:00+03:00" }
                      - code: ""
                        name: { ru: "Полезные ссылки", en: "Useful links" }
                        description: { ru: null, en: null }
                        link: "https://vatrus.info/wiki"
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { description: "Инфоблок docs не найден", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /common/airports/{airportCode}/aip:
    get:
      operationId: commonAirportsGetAip
      tags: [Common]
      summary: Карты АИП аэродрома
      description: |
        Все активные элементы раздела инфоблока `aip` с кодом `airportCode` (регистр не важен — код
        приводится к верхнему). Неизвестный код — `404`, не пустой список.

        **Единственная ручка тега `Common` с ОБЯЗАТЕЛЬНОЙ авторизацией и реальной проверкой прав** — анонимный
        доступ не предусмотрен (в отличие от универсального "все `/common/*` публичны" из описания тега):
        обычный Bearer JWT авторизованного пользователя, либо внешний ключ сектора `aip` + `actor` (см. общий
        раздел "Внешние API-ключи"), иначе `401`. Поверх этого — ещё и штатная Bitrix ACL
        (`CHECK_PERMISSIONS='Y'`) на сам РАЗДЕЛ и элементы инфоблока `aip` для реального/подставленного
        пользователя (сейчас на уровне ACL разрешено участникам `vatrus-users`). Из-за того, что видимое
        зависит от прав конкретного пользователя, **ответ НЕ кешируется** (в отличие от остальных
        `/common/*`) — общий кеш по одному ключу "код аэродрома" отдал бы результат одного пользователя всем
        остальным, включая тех, кому раздел/элементы не должны быть видны.

        `data.items` — плоский массив элементов, без пагинации. `file` — тот же вид, что и в `GET /common/docs`
        (`formatDocFile()`), с абсолютным `url`. `data.airac_cycle` — текущий цикл AIRAC, выставляется вручную
        в настройках модуля после каждой загрузки нового цикла АИП (не вычисляется автоматически) — `null`,
        если не задан.
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      parameters:
        - name: airportCode
          in: path
          required: true
          schema: { type: string, example: UUEE }
        - $ref: '#/components/parameters/ActorQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          airac_cycle: { type: string, nullable: true, example: "2510" }
                          items: { type: array, items: { $ref: '#/components/schemas/AipItem' } }
              example:
                success: true
                data:
                  airac_cycle: "2510"
                  items:
                    - id: 301
                      name: "Схема стандартного вылета RWY 24C"
                      page: 12
                      runways: "24C"
                      category: sid
                      airport_id: 45
                      file: { name: "uuee_sid_24c.pdf", url: "https://vatrus.info/upload/iblock/aip/uuee_sid_24c.pdf", size: 512000, uploaded_at: "2026-08-01T10:00:00+03:00" }
        '400': { description: "airportCode отсутствует/пуст" , content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: "Раздел АИП с таким кодом аэродрома не найден (либо не виден actor'у по ACL)", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Airport AIP section not found" } } } }
        '500': { description: "Инфоблок aip не найден", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  # ============================= COMMENTS =============================
  /comments:
    get:
      operationId: commentsList
      tags: [Comments]
      summary: Список комментариев
      description: |
        Область видимости определяется ролью вызывающего (а не правом на инфоблок):
        - админ, а также старший инструктор / region-staff / staff — все комментарии;
        - инструктор и ментор (`ins-{fir}`) — все комментарии (и `source_type=student`, и `exam`) корневых
          разделов своих РПИ; для внешнего ключа список сужается до `ALLOWED_FIR` ключа;
        - остальные (в т.ч. студент) — только `source_type=exam`, где пользователь — студент экзамена **и**
          список `EXAMINERS` экзамена совпадает со списком `VISIBLE_COMMENTS_ALLOWED`. `source_type=student`
          таким пользователям никогда не видны.

        **Кеш**: список кешируется на 1 час. `POST /comments`, `PATCH /comments/{id}` и `DELETE /comments/{id}`
        этот кеш **не сбрасывают** (сбрасывают только `POST .../images` и `DELETE .../images/{imageId}`) — новый/
        изменённый/удалённый комментарий может не отражаться в `GET /comments` до часа, даже если
        `GET /exams/{id}` (который свой кеш при этом чистит корректно) уже показывает актуальные данные.

        Принимает внешний ключ сектора `exams_comments` (см. общий раздел "Внешние API-ключи").
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ActorQuery'
        - name: source_type
          in: query
          schema: { type: string, enum: [student, exam] }
        - name: source_id
          in: query
          description: "int, массив int, либо через запятую"
          schema: { type: string }
        - name: author_id
          in: query
          schema: { type: integer }
        - name: is_alert
          in: query
          schema: { type: boolean }
        - name: ids
          in: query
          description: "Явный список ID комментариев (перекрывает source_type/source_id)"
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { allOf: [{ $ref: '#/components/schemas/PaginationMeta' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/CommentItem' } } } }] } } }]
              example:
                success: true
                data:
                  items:
                    - id: 145
                      text: "Студент показал хорошие результаты на экзамене."
                      comment_date: "2026-07-15T10:32:00+03:00"
                      comment_by: { id: 12, login: i.petrov, name: Иван, lastname: Петров }
                      is_alert: false
                      source: { type: exam, data: 302 }
                      images:
                        - { id: 88, name: "Изображение к комментарию #145", detail_url: "/upload/iblock/xxx/photo.jpg", preview_url: "/upload/iblock/yyy/photo_preview.jpg" }
                  total: 57
                  page: 1
                  pageSize: 20
        '401': { $ref: '#/components/responses/Unauthorized' }

    post:
      operationId: commentsCreate
      tags: [Comments]
      summary: Создать комментарий (опционально с изображениями)
      description: |
        FIR (и раздел инфоблока комментариев) вычисляется от `source_type`+`source_id`: для `student` — по
        `UF_ATCTR_FIR` пользователя, для `exam` — по студенту экзамена. Требует членство в группе `ins-<fir>`
        (или admin/`edit_all_users`).

        Принимает внешний ключ сектора `exams_comments` (см. общий раздел "Внешние API-ключи") — `actor` в теле.
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [source_type, source_id, text]
              properties:
                source_type: { type: string, enum: [student, exam] }
                source_id: { type: integer, description: "Bitrix ID студента (UserTable.ID) либо ID экзамена, в зависимости от source_type" }
                text: { type: string }
                is_alert: { type: boolean, default: false }
                images: { type: array, items: { type: string, format: binary }, description: "jpeg/png/gif/webp; невалидные файлы молча пропускаются" }
                actor: { type: string, description: "Логин, от чьего имени создаётся комментарий — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key внешнего ключа, игнорируется при обычном Bearer JWT", example: i.petrov }
      responses:
        '200':
          description: Создан
          content:
            application/json:
              schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: object, properties: { id: { type: integer } } } } }] }
              example: { success: true, data: { id: 146 } }
        '400':
          description: "Не заполнено обязательное поле, либо неизвестный source_type"
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: "Нет прав на запись в раздел FIR"
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Insufficient rights to create a comment in this section" } } }
        '500': { description: "Инфоблок не найден / ошибка Bitrix", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /comments/{id}:
    patch:
      operationId: commentsUpdate
      tags: [Comments]
      summary: Изменить текст/флаг alert комментария
      description: "Разрешено автору, admin/`edit_all_users`, либо участнику группы `ins-<fir>` раздела комментария. Принимает внешний ключ сектора `exams_comments` — `actor` в теле."
