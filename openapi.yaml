                actor: { type: string, description: "Логин, от чьего имени редактируется комментарий — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key внешнего ключа, игнорируется при обычном Bearer JWT", example: i.petrov }
      responses:
        '200': { description: Обновлён, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '400': { description: "text не передан", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: "Нет прав на редактирование", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Unable to update comment or not enough rights" } } } }

    delete:
      operationId: commentsDelete
      tags: [Comments]
      summary: Удалить комментарий (вместе со всеми прикреплёнными изображениями)
      description: "Те же права, что на PATCH. Принимает внешний ключ сектора `exams_comments` — `actor` в теле."
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                actor: { type: string, description: "Логин, от чьего имени выполняется удаление — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key внешнего ключа, игнорируется при обычном Bearer JWT", example: i.petrov }
      responses:
        '200': { description: Удалён, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: "Нет прав", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

