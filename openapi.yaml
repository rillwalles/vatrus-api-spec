            соответствующей сессии переключается на противоположный, см. `ExamResult`); `644d5b02b3a2a4097b674a8c5507d51d`
            — отклонена (RESULT сессии не трогается). Сырой XML_ID enum-значения, как и большинство XML_ID в этом API.
          enum: ["463285d335c1a903f91c4a433ad784aa", "644d5b02b3a2a4097b674a8c5507d51d"]
        edited_time: { type: string, format: date-time, description: "TIMESTAMP_X (нативное поле Bitrix, TZ сервера) — момент последнего изменения элемента (в т.ч. approve/decline)" }

    PositionListItem:
