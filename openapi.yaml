openapi: 3.0.3
info:
  title: Vatrus API
  version: "1.0"
  description: |
    REST API Bitrix-модуля `vatrus` (VATRUS —  портал русскоязычного дивизиона VATSIM).

    ## Формат ответа
    Все ответы — JSON-объект с полем `success`:

    - Успех: `{ "success": true, "data": <...> }` (поле `data` отсутствует, если возвращать нечего — например `logout`, `revoke`).
    - Ошибка: `{ "success": false, "error": "<сообщение>" }`.

    HTTP-код ошибки равен коду исключения, выброшенного в контроллере/сервисе (`Router.php` перехватывает `\Throwable` и мапит `getCode()` 400–599 → HTTP-статус, иначе 500).

    ## Идентификация пользователей
    Все пути и фильтры API используют **VATSIM CID = `LOGIN`** пользователя в Bitrix, а не внутренний числовой Bitrix ID.
    Числовой `id` в ответах — это внутренний Bitrix ID, он возвращается только для чтения (ссылки на записи), в запросах как идентификатор не используется.

    ## Аутентификация
    Bearer JWT access-токен (TTL 30 минут) в заголовке `Authorization: Bearer <token>`.
    Обновление — одноразовый `refresh_token` (TTL 7 дней, 64-символьная hex-строка), `POST /auth/refresh`.

    Часть read-only эндпоинтов публичные (токен не нужен, помечены `security: []`): все `/static/*`,
    `GET /news`, `GET /news/{id}`, `GET /roster`, и все `/common/*` кроме `GET /common/lists-values`.
    Остальные эндпоинты требуют токен.

    Исключение — `GET /common/lists-values`: единственный эндпоинт для backend-to-backend вызовов, не привязан
    к пользователю Bitrix вообще (ни JWT, ни `security: []`) — статический ключ в заголовке `X-Api-Key`,
    сверяется с `SERVICE_API_KEY` из `.env` (`AuthHelper::checkServiceAuth()`).

    ## Вход настольных приложений (device-flow)
    Для настольных клиентов (WRSU и подобных) есть вход через VATSIM Connect без секрета в клиенте, без локального
    порта и URI-схемы: `POST /auth/vatsim-device/init` → вход на сайте и ввод кода из окна приложения
    (`POST /auth/vatsim-callback`, `POST /auth/vatsim-device/confirm`) → `POST /auth/vatsim-device/poll` отдаёт
    `TokenPair`. Подробности, модель угроз и коды ошибок — в описании `POST /auth/vatsim-device/init`.

    ## Коды групп (`groups` в `GET /users/me` и `GET /users/{login}`)
    Значения — символьные коды (`STRING_ID`) групп пользователя. Следующие коды закреплены в логике API и
    считаются частью контракта; переименование — только с уведомлением и переходным периодом:

    | Код | Кто |
    |---|---|
    | `atc-applicants` | абитуриенты |
    | `atc-students` | студенты |
    | `atc-graduates` | выпускники |
    | `atc-instructors` | инструкторы |
    | `atc-mentors` | менторы |
    | `atc-senior-instructors` | старшие инструкторы |
    | `region-staff`, `staff` | руководство региона / сотрудники |
    | `ins-{fir}`, `staff-{fir}` | инструкторы / руководство конкретного РПИ (`{fir}` — код РПИ в нижнем регистре, например `ins-uuwv`) |

    Список не исчерпывающий (есть служебные группы, например `vatrus-users` — в ней состоят все); значение
    `groups` — полный список групп пользователя, проверять нужно вхождение нужного кода.

    ## Внешние API-ключи (авторизация от имени пользователя)
    Отдельный от Bearer JWT способ авторизации для СТОРОННИХ ИНТЕГРАЦИЙ (внешних порталов/систем), которым
    нужно действовать от имени конкретного пользователя Bitrix, а не анонимно (как `lists-values` выше) — см.
    `externalApiKeyAuth` в описании ручек тегов `News`, `Students`, `Roster`, `Exams`, `Comments`. Заменил
    собой более ранний одноразовый `EVENT_PORTAL_API_KEY` новостного портала (мигрирован без потери
    функциональности) и обобщён на остальные разделы.

    Механизм:
    - Ключи выпускаются и хранятся в инфоблоке `api_keys`, управляются ТОЛЬКО из админки Bitrix — закрыта
      паролем главного администратора (`ID=1`), не capability стаффа (слишком широкое право для назначения
      через должности). В REST API управления ключами нет вообще (ни списка, ни создания, ни отзыва).
      Хранится лишь SHA-256 хеш ключа (`KEY_HASH`) — как и с паролями/refresh-токенами, сырое значение
      показывается администратору один раз в момент создания и больше нигде не восстановимо.
    - Каждый ключ выдаётся на один или несколько **секторов** API (`SECTORS`): `students`, `news`,
      `exams_comments` (общий для `/exams/*` и `/comments/*` — один ключ пишет в оба), `roster`, `aip`,
      `trainingrequests`, `bookings`. Ключ, не имеющий нужного сектора, для конкретной ручки не действует —
      как будто его не передали вовсе.
    - Запрос с ключом: заголовок `X-Api-Key: <сырое значение>` ВМЕСТО `Authorization: Bearer`, плюс
      ОБЯЗАТЕЛЬНОЕ поле `actor` — логин пользователя, от чьего имени выполняется действие. Для `GET` —
      query-параметр `?actor=`; для остальных методов — поле `actor` в теле запроса (JSON или
      `multipart/form-data`, в зависимости от конкретной ручки). `actor` НЕ привязан к ключу и может быть
      ЛЮБЫМ логином — держатель ключа сам его выбирает, никакого предварительного согласования нет.
    - **Модель прав — по actor'у, но с двумя жёсткими потолками сверху, накладываемыми самим ключом
      (независимо от реальных прав найденного пользователя):**
      1. **Понижение до базовых прав.** `actor` реально авторизуется в `global $USER` на время запроса
         (как обычный JWT в `checkAuth()`), но группы вида `staff`/`region-staff`/`atc-senior-instructors`/
         `admins`/`api-read-all`/`api-write-all` у него принудительно снимаются ДО базового уровня —
         обычный пользователь / инструктор-ментор своего FIR (собственный `ins-<fir>` сохраняется) /
         студент-выпускник-абитуриент / ивент-менеджер. Даже если найденный `actor` в реальности staff или
         admin, через ключ эти права недостижимы — работает `IsAdmin()`, `CanDoOperation()`,
         `CIBlockElementRights`, любая проверка группы. Если интеграции нужны полные права конкретного
         сотрудника — это Bearer JWT, не сервисный ключ.
      2. **Потолок по FIR (`ALLOWED_FIR` ключа).** Каждый ключ несёт свой список разрешённых FIR, заданный
         при создании. Даже настоящий допуск `actor`-инструктора/ментора к своему FIR не сработает, если
         этого FIR нет в списке ключа — доступ/действие отклоняется так же, как если бы `actor` этим FIR
         не владел вовсе (пустой список/`403`/`404`, без отдельного кода ошибки под этот случай). Ключ без
         единого FIR в списке не работает ни с одним регионом.
    - Ошибки авторизации ключа: `401 Invalid or missing API key` — заголовок не передан, ключ не найден,
      не активен (отозван) или не выдан на сектор этой ручки; `400 actor is required` — ключ валиден, но
      `actor` не передан; `404 actor '<login>' not found` — такого логина нет. Отдельного кода для «FIR вне
      списка ключа»/«операция требует прав выше базовых» нет — эти случаи неотличимы от того, как если бы у
      `actor` просто не было соответствующего допуска (403/404/пустой список, в зависимости от ручки).
    - Аудит: успешные операции, выполненные по ключу, дополнительно пишутся в историю с суффиксом `_external`
      в коде действия — вместо логина исполнителя-человека (которого нет, запрос не от человека) там метка
      (`NAME`) использованного ключа.

    ## CORS
    Заголовки `Access-Control-Allow-*` (включая ответ на `OPTIONS`-preflight) отправляются только для Origin
    из объединения двух источников — для любого другого origin CORS-заголовки не отправляются вовсе:
    - Захардкоженный список (`http://localhost:3000` — локальный дев-фронтенд; `https://new.vatrus.info` —
      прод-фронтенд, соседний docker-контейнер).
    - `HOST` активных ключей инфоблока `api_keys` (см. "Внешние API-ключи" ниже) — каждому ключу для сторонней
      интеграции можно прописать её origin в админке, и он автоматически откроется для CORS, без правки кода.
      Сверка идёт по самому Origin со ВСЕМИ выданными `HOST` разом (не с конкретным ключом) — preflight
      (`OPTIONS`) не несёт `X-Api-Key`, узнать, какой именно ключ будет использован в основном запросе, на
      этом этапе нельзя.

    Включая `Access-Control-Allow-Credentials: true` — без него браузер блокирует запросы с
    `credentials: 'include'` ещё на preflight, несмотря на корректный `Allow-Origin`.

    ## Rate limiting
    Часть ПУБЛИЧНЫХ ручек (авторизация опциональна или не нужна вовсе) защищена лимитом запросов по IP —
    фиксированное окно **60 запросов / 60 секунд на пару (маршрут, IP)**: `GET /common/subdivisions[/{id}]`,
    `GET /common/firs[/{identifier}]`, `GET /common/airports[/{identifier}]`, `GET /common/positions`,
    `GET /common/staff`, `GET /common/docs`, `GET /static/*`, `GET /metar/{airportCode}`, `GET /roster[/{login}]`,
    `GET /news[/{id}]`, `GET /bookings[?news=]`. Превышение — `429` с заголовком `Retry-After` (секунд до конца окна), см.
    `TooManyRequests` в общих responses. Эндпоинты, требующие ОБЯЗАТЕЛЬНОЙ авторизации (JWT/actor или
    статический сервисный ключ) — этим лимитом не защищены (сама авторизация уже барьер от массовой анонимной
    накрутки) — сюда относится и `GET /common/airports/{airportCode}/aip` (раньше был чисто публичным
    исключением без лимита вообще, теперь требует JWT/actor как и остальные закрытые ручки, см. её описание).

    `GET /metar/{airportCode}?refresh=1` — СВЕРХ общего лимита выше, отдельный жёсткий лимит **5 запросов /
    60 секунд на пару (IP, аэропорт)** внутри самой ручки (не через общий механизм маршрутов): эта ветка бьёт
    во внешний источник (aviationweather.gov), накрутка рискует поймать бан IP модуля у источника целиком —
    см. описание операции.

    ## Приватность (vatsim-data-protected)
    Пользователи из группы `vatsim-data-protected` попросили скрыть своё ФИО во всех ответах API — сами данные
    в Bitrix при этом хранятся и синхронизируются с VATSIM как обычно (дивизион обязан вести учёт реальных
    данных), это редактирование только на выдаче REST API. Везде, где показывается **чужое** имя/фамилия
    (`UserBrief.name`/`lastname`, `UserFull.name`/`lastname`, `StudentListItem.name`/`lastname` и т. п.) —
    для защищённых пользователей оба поля возвращаются как `null`. Единственное исключение — `GET /users/me`:
    свою собственную карточку пользователь всегда видит без редактирования. Группу `vatsim-data-protected`
    также нельзя выдать/снять через `PATCH /users/{login}` (`groups`) — как и `admins`, только вручную в админке.

    **Не путать с отдельной, по другому принципу устроенной маскировкой в `GET /roster[/{login}]`** (см. тег
    `Roster`): там действует по признаку САМОГО ВЫЗЫВАЮЩЕГО (нет JWT ни из одной привилегированной группы —
    гасятся ФИО ЛЮБОГО пользователя в ответе, независимо от того, состоит ли он в `vatsim-data-protected`),
    а не по признаку того, ЧЬЁ имя показывается, как здесь.

    ## Локализация
    Все локализованные тексты (`name`, `description`, `short_description`, `city` и т. п.) возвращаются единым
    образом — вложенным объектом `{ "ru": "...", "en": "..." }`.

    ## Часовые пояса
    Большинство кастомных дата-полей модуля хранятся и отдаются в UTC (`+0000` в ISO8601), независимо от TZ
    сервера (Europe/Moscow, `+0300`): `Exams.start_time`/`finish_time`, `NewsItem.event.start`/`finished`,
    `NewsItem.airports[].time_start`/`time_finish`, `NewsItem.created.time_created`, `NewsItem.published.time_published`,
    `RosterItem.active_from`/`active_to`, `TrainingRequestItem.accepted_time`/`closed_time`,
    `StudentDetail.exams[].closed_date`. Нативные поля Bitrix, которые модуль не переопределяет (например
    `created_time` заявок на обучение, `comment_date`, `StudentDetail.exams[].create_date`), остаются в TZ
    сервера (`+0300`) — как и все прочие дата-поля, которые модуль явно не переводил на UTC.

    ## Известные несогласованности API
    - `GET /subdivisions` и `GET /firs` оборачивают список в `{ "items": [...] }` без `total`/`page`/`pageSize`; `GET /airports` — полноценная пагинация, но при пустом результате (по FIR, не давшему совпадений, либо `offset >= total`) ключи `page`/`pageSize` в ответе могут отсутствовать.
    - `GET /lists-values`, `GET /static/pages`, `GET /static/menu`, `GET /static/alerts` возвращают `data`
      не как объект с `items`, а как **голый массив**.
externalDocs:
  description: README и заметки о правах доступа
  url: ./README.md
servers:
  - url: https://backend.new.vatrus.info/vatrus_api/v1
    description: "Стенд (dev): прода пока нет, бэкенд для фронтенда и интеграций. Базовый путь зашит в Router.php"
tags:
  - name: Auth
    description: |
      Логин, refresh/logout, вход через VATSIM Connect. Для сайта — `GET /auth/vatsim-init` + `POST /auth/vatsim-callback`;
      для настольных приложений — device-flow (`POST /auth/vatsim-device/init|confirm|poll`).
  - name: Students
    description: |
      Список и карточка студента (агрегированные данные — допуски, экзамены, комментарии). Ответы кешируются
      (1 час), но все мутации (в т.ч. в Roster/Exams/Comments, затрагивающие данные студента) синхронно
      сбрасывают кеш перед возвратом ответа — пропагационной задержки нет.

      Обе ручки принимают внешний ключ сектора `students` (`X-Api-Key` + `?actor=` в query, см. общий раздел
      "Внешние API-ключи" в описании API) как альтернативу Bearer JWT.
  - name: News
    description: |
      Новости (CMS-раздел, с картинкой и мультиязычным контентом). `GET /news` и `GET /news/{id}` публичные
      (токен не обязателен, но если валидный Bearer передан, либо `X-Api-Key` внешнего ключа сектора `news` +
      `actor` — авторизует вызывающего для `filter[activity]`/`created`/`published`, см. описания операций);
      `POST /news` — только staff/admin (`isStaffOrAdmin`, любая группа, в STRING_ID которой встречается
      подстрока `staff`). `DELETE /news/{id}`, `PATCH /news/{id}` и `PATCH /news/{id}/activate`/`deactivate`
      используют более узкие механизмы (см. описания операций) — это не то же самое, что staff/admin, наборы
      пользователей могут не совпадать.

      Права на правку новостей (поэлементные права Bitrix, `NewsRightsService`): право записи на уровне
      инфоблока есть только у администраторов и у держателей возможности «Публикация новостей»
      (`PUBLISH_NEWS`, назначается через должность в инфоблоке `staff`; личные права держателей
      синхронизируются автоматически). Группы `atc-instructors`/`atc-mentors`/`event-managers`/`staff`
      имеют только чтение. При создании новости (черновик, `ACTIVE=N`) создателю выдаётся индивидуальное
      «Изменение» — он правит свой черновик (`PATCH /news/{id}`) — тот же приём, что и у заявок на обучение
      (`TrainingRequests`). При публикации (`activate`) право создателя снимается — дальше опубликованную
      новость могут править только администраторы и держатели `PUBLISH_NEWS`; при снятии с публикации
      (`deactivate`) новость снова становится черновиком, и автор опять может её править. Те же правила
      действуют при публикации/снятии/удалении в панели Bitrix: без `PUBLISH_NEWS` она запрещена.

      **Внешние API-ключи (сектор `news`)** — все пять ручек записи (`POST`/`PATCH`/`DELETE /news*`,
      `activate`/`deactivate`) дополнительно принимают авторизацию заголовком `X-Api-Key` вместо Bearer JWT
      (см. `externalApiKeyAuth` и общий раздел "Внешние API-ключи" в описании API) — сторонняя интеграция,
      действующая от имени указанного в теле `actor` (login). В отличие от более раннего варианта этого
      механизма (специфичного для новостного портала), `actor` теперь РЕАЛЬНО авторизуется в `global $USER` —
      поэтому проверки прав везде ниже (включая поэлементные права `canUserEditElement` у `PATCH /news/{id}`)
      написаны ОДИНАКОВО для Bearer JWT и для ключа, без особых случаев. Успешные действия по ключу
      дополнительно логируются в историю с меткой ключа (best-effort, сбой логирования не роняет само
      действие).

      Ответы кешируются (1 час), все мутации синхронно сбрасывают кеш — пропагационной задержки нет.
  - name: Users
    description: |
      Пользователи Bitrix, их группы, FIR/аэропорт. `GET /users`, `GET /users/{login}` и `PATCH /users/{login}`
      используют единый **скоуп доступа** (`RightsHelper::getUserProfileScope()`), отдельный от прав на другие
      разделы API. Смена FIR — отдельный флоу через заявки на перевод (`transfers`, см. ниже), в этот скоуп не
      входит:

      - admin или модульное право `edit_all_users` — доступ ко всем пользователям без ограничений (кроме
        группы `admins` — её нельзя выдать/снять ни при каких условиях). **`view_all_users` сам по себе
        доступа больше не даёт** — исторически этим правом наделяли `region-staff` только ради пикера
        пользователей в админке, без намерения давать полный read/write через это API.
      - Иначе доступ складывается из применимых правил, каждое — по членству в группе или staff-возможности
        (`AccessHelper`/`ModuleCapability`), и даёт доступ только к пользователям, состоящим хотя бы в одной
        из групп из **своего** правила:
        - `atc-mentors`/`atc-instructors`/`atc-senior-instructors` → пользователи в `atc-applicants`/`atc-students`;
          группами управлять нельзя вообще (только `airport_code`, в пределах текущей FIR пользователя).
        - `region-staff` → пользователи в `atc-applicants`/`atc-students`/`atc-graduates`; может выдавать/снимать
          `region-staff`, `event-managers` и свои собственные `staff-<fir>`.
        - staff-возможность `EDIT_USER_RIGHTS` → пользователи в `vatrus-users` (практически все действующие
          члены дивизиона); может выдавать/снимать любые группы (кроме `admins`).
        - staff-возможность `ASSIGN_INSTRUCTORS` → пользователи в `vatrus-users`; может выдавать/снимать только
          `atc-mentors`/`atc-instructors`/`atc-senior-instructors`.

        Правила накапливаются (объединение областей видимости), но при изменении **конкретной** группы
        проверяется одно правило целиком: и текущие группы цели должны попадать в его `targetScope`, и
        изменяемый код — быть среди его `grantableGroups` (выдача и снятие проверяются одинаково).
      - Если совпало хотя бы одно правило, но у цели нет ни одной группы из объединённой области видимости —
        `403`. `GET /users/groups` (справочник групп со счётчиками) не деперсонализирован и требует только
        сам факт доступа (`access: true`), без сужения по группам.

      `GET /users/me` — отдельный случай: собственные данные вызывающего по access-токену, доступны всегда,
      скоуп к ним не применяется (видеть свои данные можно независимо от прав на чужие).

      **Заявки на перевод между РПИ** (`/users/transfers*`, инфоблок `transfer_requests`) — единственный
      способ сменить FIR пользователя. Свой, отдельный от скоупа выше контур прав: `POST /users/transfers`
      требует членства в `vatrus-users`; заявка обычно заводится на самого вызывающего, но `region-staff`
      может указать `login` другого пользователя. Читают (`GET /users/transfers`, `GET /users/transfers/{id}`)
      по правам элемента Bitrix (`CHECK_PERMISSIONS`, тот же паттерн, что у `TrainingRequests`): заявителю —
      чтение, `vatrus-users` — явный запрет, `region-staff`/`staff` — чтение. Рассмотрение
      (`PATCH .../approve`/`decline`) — ОТДЕЛЬНАЯ проверка, staff-возможность `STUDENT_TRANSFERS`
      ("Переводы студентов и выпускников"), не завязана на права элемента и не требует членства в
      `region-staff`/`staff` как группе. `approve` переносит пользователя на новый FIR, сбрасывает
      привязку к аэропорту (мог относиться к прежней FIR) и двигает указатель прогресса обучения
      (`StudentProgressService`) на этап, явно указанный рассматривающим (`stage`).
  - name: Exams
    description: |
      Экзаменационные сессии (создание, оценки, завершение). `POST /exams` и `POST /exams/{id}/examiners`
      при необходимости выставляют экзаменатору индивидуальные права на чтение самой сессии и её
      комментариев/изображений — так экзаменатор из другой FIR (не входящий в `ins-<fir>` секции сессии) всё
      равно может быть назначен и получит доступ к материалам. Сбой этого шага не блокирует назначение,
      только логируется.

      Все пути под `/exams/*` принимают внешний ключ сектора `exams_comments` (общий с тегом `Comments` —
      один ключ пишет в оба) как альтернативу Bearer JWT, см. общий раздел "Внешние API-ключи" в описании API.

      **Апелляции к аттестационным мероприятиям** (`/exams/appeals*` + `POST /exams/{id}/appeal`, инфоблок
      `appeals`) — свой контур прав, отдельный от прав на сами сессии выше. Подать (`POST /exams/{id}/appeal`)
      может сдававший студент, любой `EXAMINERS` сессии, `atc-senior-instructors`, либо `staff-<fir>` РПИ
      студента; только в течение 24 часов после `finish_time` сессии, не более одной апелляции на сессию.
      Читают (`GET /exams/appeals`, `GET /exams/appeals/{id}`) по правам элемента Bitrix (`CHECK_PERMISSIONS`,
      тот же паттерн, что у заявок на перевод, см. тег `Users`): то же множество, кому разрешена подача, плюс
      `vatrus-users` — явный запрет. Рассмотрение (`PATCH .../approve`/`decline`) — ОТДЕЛЬНАЯ проверка,
      staff-возможность `EXAM_APPEALS` ("Рассмотрение апелляций к аттестационным мероприятиям"), не завязана
      на права элемента. `approve` переключает `RESULT` сдававшейся сессии на противоположный (сдано →
      отменено апелляцией, не сдано → зачтено апелляцией, с `mark` не ниже 4.00) — см. `ExamResult`; "зачтено
      апелляцией" (`appeal_pass`) учитывается наравне с обычным `pass` везде, где считается прогресс/этап
      обучения студента. Апелляции, провисевшие без рассмотрения дольше 48 часов ПОСЛЕ `finish_time` сессии
      (не с момента подачи самой апелляции — то есть реальное окно на рассмотрение 24–48 часов в зависимости
      от того, когда в первые сутки она подана), автоматически отклоняются часовым агентом; `judge` при таком
      отклонении остаётся `null` — судить было некому.

      **Подтверждение старшим инструктором и ручная заявка на рейтинг** — для типов сессии с заполненным
      `NEW_RATING` у типа экзамена (практический экзамен с выдачей рейтинга). `PATCH /exams/{id}/seniorInsApprove`
      / `seniorInsDecline` — актор ОДНОВРЕМЕННО в `atc-senior-instructors` И `ins-<fir>` РПИ студента (не
      актора), окно 24 часа от `finish_time` сессии, блокируется апелляцией в любом статусе (взаимоисключающие
      пути пересмотра). `decline` дополнительно принимает `result` — новый сырой XML_ID для `RESULT` сессии.
      Заявка на рейтинг создаётся автоматически сразу после сдачи (`RESULT=pass`/`appeal_pass`), но
      неактивной (в ожидании); часовой агент активирует её через 48 часов после `finish_time`, если результат не
      изменился и нет висящей апелляции — к этому моменту закрыты окна подтверждения старшим инструктором и
      апелляции (при отмене результата заявка остаётся неактивной); `POST /exams/{id}/createRatingRequest` —
      ручная досрочная активация (и создание, если заявки ещё нет), доступно создателю сессии, подтвердившему её старшему инструктору,
      либо стаффу с `EXAM_APPEALS`, и только когда подтверждение старшим инструктором завершено (или истекло
      его окно) и нет висящей/ещё возможной апелляции.
  - name: Common
    description: |
      Справочники — подразделения, FIR, аэропорты, позиции, штат, документы, АИП, произвольные списки значений
      свойств инфоблоков. Все пути под `/common/*`. Все эндпоинты, кроме `GET /common/lists-values` и
      `GET /common/airports/{airportCode}/aip`, публичные (токен не требуется) **и без какой-либо проверки
      прав** — раньше они дополнительно проверяли право чтения (R) на справочные инфоблоки для вызывающего
      (для гостя — после перевода в публичные), эта проверка убрана полностью, `403` на них больше не
      возвращается. `lists-values` — другое исключение: единственный эндпоинт, изначально предназначенный для
      backend-to-backend вызовов (отдаёт обезличенные справочные значения), авторизуется статическим ключом
      `X-Api-Key` вместо Bearer JWT — не привязан к пользователю Bitrix и не проверяет права по инфоблокам (см.
      описание в разделе "Аутентификация" и саму операцию). `.../aip` — третье, единственное исключение С
      ОБЯЗАТЕЛЬНОЙ авторизацией (Bearer JWT, либо `X-Api-Key` сектора `aip` + `actor` — анонимный доступ не
      предусмотрен) и реальной проверкой прав по Bitrix ACL поверх неё (видно ровно то, что видно
      авторизованному actor'у); единственный эндпоинт тега без кеша (см. саму операцию). Остальные ответы
      кешируются на 1 час; инвалидация срабатывает только на изменения элементов соответствующих инфоблоков —
      правки, сделанные в обход них (например членство в группе `ins-{fir}`, данные пользователя-инструктора,
      HL-блоки страна/facility), могут не отражаться в ответе до часа.
  - name: Comments
    description: |
      Комментарии к студентам/экзаменам, с вложенными изображениями. Все шесть ручек принимают внешний ключ
      сектора `exams_comments` (общий с тегом `Exams` — один ключ пишет в оба) как альтернативу Bearer JWT,
      см. общий раздел "Внешние API-ключи" в описании API.
  - name: Roster
    description: |
      Допуски к позициям (ростер) — активные и историчные записи. Оба `GET` (`GET /roster` по FIR,
      `GET /roster/{login}`) ПУБЛИЧНЫЕ (токен не требуется) — ростер дивизиона общедоступен по требованию
      VATSIM (супервайзеры сети проверяют допуски без входа); если всё же передан `X-Api-Key` внешнего ключа
      сектора `roster` + `actor` — авторизует его по-настоящему (тот же смысл, что у `News`: чтобы вызов не
      терялся в логе как "noauth"), но это не обязательно. Оба лимитированы по IP (см. общий раздел
      "Rate limiting"). `POST /roster`, `PATCH /roster/{id}/positions`, `DELETE /roster/{identifier}` остаются
      обязательной авторизацией (JWT или тот же внешний ключ, см. общий раздел "Внешние API-ключи") — запись
      не публичное действие, лимит им не нужен.

      Один допуск может покрывать ГРУППУ из нескольких похожих позиций (GCAP 7.3(a): "a group of similar
      positions not to exceed five") — актуально только для соло (постоянный допуск всегда на одну позицию).
      Все позиции группы обязаны быть на одном FIR и с одним FACILITY. `PATCH /roster/{id}/positions`
      расширяет уже выданную группу дополнительными позициями без создания нового допуска.

      `POST /roster/soloExtensionRequest` — отдельная ручка запроса продления совокупного 90-дневного
      лимита соло-допуска на facility-бакете (GCAP 7.3(e)); ТОЛЬКО создаёт запрос — одобряет/отклоняет
      стафф в админке, не через API.

      **Маскировка ФИО в обоих `GET`** (своя, отдельная от общей `vatsim-data-protected`, см. раздел
      "Приватность" — там маскируется по признаку ЦЕЛИ, здесь — по признаку ВЫЗЫВАЮЩЕГО): без JWT из
      `atc-mentors`/`atc-instructors`/`staff`/`region-staff` (или `admins`) `name`/`lastname` в
      `user`/`created_by`/`responsible`/`revoked_by` гасятся в `null` для ЛЮБОГО пользователя в ответе —
      `login`/`id` не трогаются. Анонимный вызов (без токена вообще) — всегда маскирован. Если вызов
      аутентифицирован внешним ключом сектора `roster` (`X-Api-Key`+`actor`), решение принимается по
      группам НАЙДЕННОГО `actor` — обычный external-ключ с непривилегированным `actor` масштаб прав себе не
      повышает, но ключ, использованный с `actor`-ом из одной из этих групп, увидит настоящие ФИО, как и
      его собственный JWT.
  - name: TrainingRequests
    description: |
      Заявки на обучение (инфоблок `atctrequests`). Цепочка теперь в три шага: (1) заявитель подаёт заявку
      БЕЗ РПИ/аэропорта; (2) сдаёт самостоятельный письменный зачёт `ntp_1` (см. тег `Exams`,
      `POST /exams`/`PATCH /exams/{id}/start`/`.../answers/{questionId}`) — сколько угодно попыток, с
      кулдауном между неудачными; (3) после первой сданной попытки сам выбирает РПИ и аэропорт
      (`PATCH /trainingrequests/{id}/fir`) — только после этого инструктор/staff может принять (`accept`) или
      закрыть (`close`, accept/reject) заявку. Подать заявку может только участник группы `vatrus-users`, не
      имеющий другой активной/завершённой заявки. Все пути под `/trainingrequests*` требуют авторизации —
      обычный Bearer JWT, либо `X-Api-Key` внешнего ключа сектора `trainingrequests` + обязательный `actor`
      (login) в query (GET) / теле (POST/PATCH), см. общий раздел "Внешние API-ключи" — права везде по
      `actor`, так же, как если бы он обратился сам по своему JWT.

      **Видимость** (`GET /trainingrequests`) опирается на нативные права Bitrix на элемент
      (`CIBlockElementRights`, выставляются при создании/выборе РПИ и перевыставляются в `accept` при смене
      FIR): заявителю — чтение; группе `ins-<fir>` ВЫБРАННОГО заявкой РПИ — изменение; группам
      `vatrus-users`/`atc-instructors`/`atc-mentors` — явный запрет, перекрывающий их унаследованное от
      инфоблока право (у `vatrus-users` — изменение, нужное только чтобы группа могла создавать заявки; у
      `atc-instructors`/`atc-mentors` — раньше глобальное чтение ЛЮБОЙ заявки, теперь так и остаётся явно
      запрещённым — обычный инструктор/ментор видит заявку ТОЛЬКО через свою `ins-<fir>`, когда РПИ уже
      выбран, и вообще не видит, пока РПИ не выбран). Группы без индивидуальной записи работают по
      унаследованным правам инфоблока: `staff`/`atc-senior-instructors`/`region-staff` — изменение (видят
      АБСОЛЮТНО ЛЮБУЮ заявку, в том числе до выбора РПИ — это и даёт им роль "видят все заявки"), `admins` —
      полный доступ. `accept`/`close` дополнительно ограничены по FIR через членство в группе `ins-<fir>`
      (`RightsHelper::canWriteToFirCode`), обходится для `atc-senior-instructors`; архив дополнительно
      доступен `admins`. `GET /trainingrequests` и `GET /trainingrequests/archive` пагинированы и кешируются
      на 1 час (список — с ключом, включающим ID вызывающего, т.к. видимость зависит от прав; архив — общий
      ключ). Кеш целиком сбрасывается синхронно при create/`PATCH .../fir`/accept/close, а также при любом
      изменении инфоблока `exsession` (т.к. поле `ntp1`, см. ниже, производное от результатов зачёта).

      **Поле `ntp1`** в каждом элементе списка/карточки — сводка по попыткам письменного зачёта `ntp_1`
      заявителя: `passed` (сдана хотя бы одна попытка) и `attempts` (все попытки, включая незавершённые, у
      которых `result`/`mark` — `null`). `GET /trainingrequests` дополнительно принимает `?ntp1_passed=yes|no`
      для фильтрации по этому агрегату (не хранится в инфоблоке — фильтрация выполняется до пагинации, со
      своим отдельным кешем).

      **Автоматическое закрытие**: заявка может закрыться и без явного вызова `PATCH .../close`. Как только
      абитуриент сдаёт (`result=pass`) все аттестационные мероприятия вводной программы обучения (раздел
      `initial` инфоблока `training_program`, см. `GET /exams/program`), `StudentPromotionService` сам
      закрывает его заявку как принятую — снимает `atc-applicants`, назначает `atc-students`, деактивирует
      заявку. Срабатывает по событиям завершения экзамена, а также при вызове `accept` (закрывает разрыв, если
      абитуриент сдал программу до принятия заявки). `closed_by` в этом случае — инструктор, ранее принявший
      заявку через `accept`, а не сам абитуриент.

      **UF_ATCTR_FIR/UF_ATCTR_ICAO пользователя**: реальные поля профиля проставляются сразу при
      `PATCH .../fir` (не дожидаясь `accept`) и синхронизируются заново при любой смене FIR/аэропорта в
      `accept`. При отклонении заявки (`close` с `action=reject`) эти поля сбрасываются — отклонённый
      абитуриент снова "без РПИ". Перевод уже выбравшего РПИ абитуриента/студента в другой РПИ — отдельный
      флоу, см. тег `Users` (`POST /users/transfers`).
  - name: Static
    description: |
      Публичный статический контент (информационные страницы, меню, оповещения, сводная статистика) —
      без авторизации, данные нужны в т. ч. до логина. Все пути под `/static/*`. Хранится в настройках
      модуля (`Bitrix\Main\Config\Option`), редактируется только из админки. `pages`/`menu`/`alerts`
      кешируются на 1 час, инвалидация синхронная при сохранении в админке. `stat` кешируется на 24 часа
      и дополнительно жёстко сбрасывается ежесуточным Bitrix-агентом в 00:00 UTC.
  - name: Weather
    description: |
      METAR/TAF аэродромов дивизиона (`GET /metar/{airportCode}`) — публично, без авторизации, данные не
      персонализированы и не защищены правами элементов. Источник — aviationweather.gov (NOAA), без ключа;
      хранится в HL-блоке `AirportWeather`, обновляется агентом раз в 30 минут (слоты `:05`/`:35` каждого
      часа). Аэропорт, временно выпавший из выдачи источника (станция офлайн и т.п.), не затирается пустым
      значением — остаётся последний известный METAR/TAF.
  - name: Bookings
    description: |
      Прокси-эндпоинт к внешнему VATSIM ATC Bookings API (`atc-bookings.vatsim.net`) — создание, удаление,
      и чтение: `GET /bookings` публичный, без авторизации (данные и так открыты на сайте VATSIM) — без
      параметров отдаёт все актуальные букинги дивизиона, с `?news=` — букинги конкретного ивента.
      Создание/удаление требуют авторизации — Bearer JWT, либо внешний ключ сектора `bookings` +
      `actor` (см. "Внешние API-ключи").

      **Важная особенность, отличающая этот тег от остального API**: сообщения об ошибках в `error`
      (как top-level, так и построчные в `errors[].message` у `POST /bookings`) — **на русском языке**,
      не на английском, как везде. Исключение — ошибки, пришедшие от самого VATSIM API без изменений.

      VATSIM Bookings API не хранит, кто создал букинг (там только `callsign`/`cid`/`type`/`start`/`end`),
      а правило "инструктор/ментор/event-manager/region-staff может удалить только то, что сам подал"
      требует знать владельца — источник истины на стороне Bitrix, HL-блок `BookingLog` (append-only,
      по строке на `created`/`deleted`). Запись `created` обязательна при создании: если она не удалась,
      только что созданный на VATSIM букинг откатывается (удаляется) — иначе он навсегда остался бы без
      известного владельца. Запись `deleted` — best-effort (сам букинг уже удалён из VATSIM независимо от
      исхода записи лога).

      **Права на создание** (`POST /bookings`, за каждую строку независимо):
      - `vatrus-users` без группы ниже — только за САМОГО СЕБЯ (`cid` строки должен совпадать с логином
        actor'а);
      - `event-managers`/`atc-mentors`/`atc-instructors`/`atc-senior-instructors`/`region-staff`/`staff` —
        за ЛЮБОГО пользователя, но цель должна САМА быть текущим членом `vatrus-users`;
      - ни то ни другое — запрос целиком отклоняется `403` (это ПОЛНЫЙ отказ до разбора строк, не
        построчная ошибка).

      **Права на удаление** (`DELETE /bookings/{id}`, любое из трёх): staff-возможность
      `ModuleCapability::BOOKINGS` — любой букинг; `cid` букинга совпадает с логином actor'а — свой букинг;
      actor из `event-managers`/`atc-mentors`/`atc-instructors`/`atc-senior-instructors`/`region-staff` И он
      зафиксирован в `BookingLog` как создатель именно ЭТОГО букинга (`staff` в эту группу НЕ входит — у
      него путь только через capability). Букинг, созданный не через этот API (старая admin-страница или
      прямо на `atc-bookings.vatsim.net`), не имеет известного создателя в `BookingLog` — для него путь
      удаления "по создателю" недоступен никому, только capability или `cid`-владелец.

      **Потолок внешнего ключа по FIR** (`ALLOWED_FIR`, см. "Внешние API-ключи") проверяется на КАЖДОЙ
      строке `POST /bookings` отдельно, по цепочке `callsign` позиции → её аэропорт → FIR аэропорта —
      независимо от прав самого actor'а (ограничение ключа, не actor'а); у обычного Bearer JWT потолка нет.

      **Привязка к ивенту** — `news` в строке `POST /bookings` (ID элемента инфоблока `news`): если указан,
      позиция строки обязана быть в одном из FIR, участвующих в ивенте (свойство `FIRS` новости), иначе
      построчная ошибка. `GET /bookings?news=` (публичная, без авторизации) читает такие букинги обратно —
      список участников ивента, сверенный с актуальным состоянием VATSIM, не только с внутренним логом
      (букинг, удалённый мимо `DELETE /bookings/{id}`, просто не попадёт в список); прошедшие не возвращаются.

security:
  - bearerAuth: []

paths:
  # ============================= AUTH =============================
  /auth/login:
    post:
      operationId: authLogin
      tags: [Auth]
      summary: Логин по паре login/password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string, example: "1234567", description: "VATSIM CID (= LOGIN в Bitrix)" }
                password: { type: string, format: password }
      responses:
        '200':
          description: Токены выданы
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TokenPair' }
              example:
                success: true
                data:
                  access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refresh_token: "9f3a1c2e...64 hex chars"
                  expires_in: 1800
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Неверные логин/пароль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, error: "Invalid credentials" }

  /auth/refresh:
    post:
      operationId: authRefresh
      tags: [Auth]
      summary: Обновить пару токенов по refresh-токену (одноразовый)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string, pattern: '^[a-f0-9]{64}$', example: "9f3a1c2e0b7d4f5a6c8e1b2d3f4a5c6e7b8d9f0a1c2e3b4d5f6a7c8e9b0d1f2a" }
      responses:
        '200':
          description: Новая пара токенов; старый refresh-токен отозван
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/TokenPair' } }
        '400':
          description: Токен не передан или не соответствует формату (64 hex-символа)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, error: "Refresh token required" }
        '401':
          description: Токен просрочен/отозван/неизвестен, либо пользователь деактивирован
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, error: "Invalid or expired refresh token" }

  /auth/logout:
    post:
      operationId: authLogout
      tags: [Auth]
      summary: Отозвать refresh-токен
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '200':
          description: Токен отозван (идемпотентно — отзыв неизвестного токена тоже вернёт success)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
              example: { success: true }
        '400':
          description: Токен не передан или не в формате 64 hex-символов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/admin-sso:
    post:
      operationId: authAdminSso
      tags: [Auth]
      summary: Разовую ссылку для входа в классическую админку Bitrix по собственному JWT
      description: >
        Мост "авторизован по Bearer JWT" -> "авторизован в admin-сессии Bitrix". Принимает ТОЛЬКО собственный JWT
        вызывающего — X-Api-Key+actor не поддерживается ни в каком виде (держатель сервисного ключа не может выписать
        себе admin-сессию чужого сотрудника). Право проверяется по физическому допуску в `/bitrix/admin/` (права
        файловой структуры либо группа `admins`), а не по правам на модуль `vatrus`. Учёткам с включённой
        двухфакторной аутентификацией (модуль "Проактивная защита") мост не выдаётся вовсе — `$USER->Authorize()`
        второй фактор не спрашивает, вход для них только обычной формой Bitrix. Возвращённый `url` одноразовый и
        живёт `expires_in` секунд — успевает долететь от клика во фронтенде до редиректа, не дольше.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          url: { type: string, example: "https://vatrus.info/vatrus_admin_sso/?token=9f3a1c2e...64 hex chars" }
                          expires_in: { type: integer, example: 120 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: "Недостаточно прав, либо включена двухфакторная аутентификация (см. description)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                denied: { value: { success: false, error: "Access denied" } }
                otp: { value: { success: false, error: "Two-factor authentication is enabled for this account, use the regular admin login" } }
        '500':
          description: "Не настроен домен сайта (ни \"URL сервера\" сайта по умолчанию, ни \"URL сайта\" главного модуля)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, error: "Admin SSO is not configured" }

  /auth/vatsim-init:
    get:
      operationId: authVatsimInit
      tags: [Auth]
      summary: Получить URL для перенаправления на VATSIM Connect OAuth2
      description: |
        `client_id`/`redirect_uri` — для сторонних сайтов дивизиона (региональных) с собственным VATSIM
        OAuth-клиентом, желающих получать access/refresh от этого API вместо своего. Не переданы — берутся из
        окружения (наш собственный клиент). Значения, использованные здесь, должны быть переданы обратно
        (те же) в `POST /auth/vatsim-callback` — VATSIM отклонит обмен `code` при расхождении.
      security: []
      parameters:
        - name: client_id
          in: query
          description: "Переопределение client_id стороннего VATSIM OAuth-клиента. По умолчанию — из окружения"
          schema: { type: string }
        - name: redirect_uri
          in: query
          description: "Переопределение redirect_uri стороннего VATSIM OAuth-клиента. По умолчанию — из окружения"
          schema: { type: string }
      responses:
        '200':
          description: Одноразовый `state` сгенерирован, ссылку нужно немедленно открыть в браузере
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          url: { type: string, format: uri }
              example:
                success: true
                data:
                  url: "https://auth.vatsim.net/oauth/authorize?client_id=...&redirect_uri=...&response_type=code&scope=full_name+email&state=8f2c..."

  /auth/vatsim-callback:
    post:
      operationId: authVatsimCallback
      tags: [Auth]
      summary: Обмен code+state, полученных от VATSIM Connect, на пару токенов
      description: |
        Connect используется только для идентификации (CID) — профиль (имя/фамилия/рейтинги/FIR и т. п.)
        синхронизируется из VATSIM Core API (`VatsimProfileSyncService::syncFromConnect`); данные из Connect
        (`full_name`/`email`) — только fallback-регистрация на случай недоступности Core API. Пользователь
        автоматически создаётся при первом входе (`LOGIN` = VATSIM CID) или обновляется при повторном. Пароль
        генерируется случайно — вход по паролю для VATSIM-аккаунтов не предполагается, только через этот flow.
        Учётки с рейтингом SUS/INA деактивированы синхронизацией — токен им не выдаётся.

        `client_id`/`client_secret`/`redirect_uri` — те же значения стороннего VATSIM OAuth-клиента, что были
        переданы в `GET /auth/vatsim-init` (см. описание там). `client_id` и `client_secret` передаются только
        парой — подстановка чужого `client_id` к нашему `client_secret` (или наоборот) гарантированно сломает
        обмен `code` на стороне VATSIM. Не переданы — как обычно, наш собственный клиент из окружения.

        **`state` device-сессии** настольного приложения (создан `POST /auth/vatsim-device/init`): обмен `code`
        и синхронизация профиля — те же, но токены браузеру НЕ возвращаются. В ответ приходит
        `DeviceLoginCallbackResult` (`device_login: true`, `confirm_token`): страница должна попросить пользователя
        ввести код из окна приложения и вызвать `POST /auth/vatsim-device/confirm`. Для device-state
        `client_id`/`client_secret`/`redirect_uri` не принимаются (`400`); повторный заход с тем же `state` —
        `410`. Учётки SUS/INA получают `403`, и приложение узнаёт об этом через `poll`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code: { type: string, example: "abc123def456" }
                state: { type: string, example: "8f2c9a1b..." }
                client_id: { type: string, description: "Переопределение client_id стороннего VATSIM OAuth-клиента — должен совпадать с переданным в GET /auth/vatsim-init" }
                client_secret: { type: string, description: "Секрет стороннего VATSIM OAuth-клиента. Обязателен вместе с client_id (и наоборот)" }
                redirect_uri: { type: string, description: "Переопределение redirect_uri стороннего VATSIM OAuth-клиента — должен совпадать с переданным в GET /auth/vatsim-init" }
      responses:
        '200':
          description: "Токены выданы, пользователь создан или найден. Для `state` device-сессии — `DeviceLoginCallbackResult` без токенов"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        anyOf:
                          - $ref: '#/components/schemas/TokenPair'
                          - $ref: '#/components/schemas/DeviceLoginCallbackResult'
        '400':
          description: "Отсутствует code/state, передан только один из client_id/client_secret, либо для device-сессии переданы client_id/client_secret/redirect_uri"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, error: "client_id and client_secret must be provided together" }
        '401':
          description: "`state` невалиден/просрочен, обмен кода отвергнут VATSIM, либо VATSIM не вернул данные пользователя"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                invalid_state: { value: { success: false, error: "Invalid state" } }
                exchange_failed: { value: { success: false, error: "Failed to exchange code" } }
                no_user_data: { value: { success: false, error: "Failed to get user data" } }
        '403':
          description: "Учётная запись деактивирована (рейтинг SUS/INA) — токен не выдаётся"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, error: "Account is deactivated (SUS/INA rating)" }
        '410':
          description: "Только для device-сессии: `state` уже использован, сессия просрочена или закрыта"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, error: "Login session expired or already used" }
        '500':
          description: Не удалось создать/обновить пользователя в Bitrix при синхронизации профиля
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: "VATSIM Connect недоступен (сеть/5xx) при обмене кода или получении данных пользователя"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, error: "VATSIM is temporarily unavailable" }

  /auth/vatsim-device/init:
    post:
      operationId: authVatsimDeviceInit
      tags: [Auth]
      summary: Начать вход настольного приложения через VATSIM (device-flow)
      description: |
        Вход для настольных клиентов (WRSU и подобных): **секрет VATSIM OAuth-клиента остаётся на сервере**,
        приложению не нужны ни секрет, ни локальный порт, ни URI-схема, ни встроенный браузер. Приложение
        получает пару токенов (`TokenPair`, как у `POST /auth/vatsim-callback`) после того, как пользователь
        вошёл через VATSIM на сайте и подтвердил код.

        **Последовательность:**
        1. Приложение: `POST /auth/vatsim-device/init` → `session_id` (секрет приложения), `user_code`, `url`.
           Показывает `user_code` в своём окне и открывает `url` в системном браузере.
        2. Пользователь входит через VATSIM; VATSIM возвращает его на страницу сайта (`VATSIM_REDIRECT_URI`) с
           `code` и `state`. Страница вызывает `POST /auth/vatsim-callback` — для `state` device-сессии в ответе
           **нет токенов**, только `confirm_token` (см. описание там).
        3. Страница просит **ввести** код из окна приложения и вызывает `POST /auth/vatsim-device/confirm`.
        4. Приложение всё это время опрашивает `POST /auth/vatsim-device/poll` каждые `interval` секунд и после
           подтверждения получает `TokenPair` — ровно один раз.

        **Модель угроз и почему именно так.**
        - Атака подмены: злоумышленник запускает свою сессию и подсовывает жертве ссылку `url` — жертва входит
          через VATSIM, а токены получил бы он. Защита: токены выдаются только после того, как пользователь на
          сайте ввёл `user_code`, который виден лишь в окне приложения. Код именно **вводится** (а не показывается
          для сверки): слепое «совпадает» кликом не защищает.
        - `state` знает тот, кто создал сессию (ему отдана ссылка), поэтому подтверждение привязано к браузеру
          через `confirm_token`, который получает только браузер, вернувшийся с `code` от VATSIM. Без него
          `confirm` не принимается.
        - `session_id` — 256 бит случайности, секрет приложения: на сайт не попадает, в БД хранится только его
          SHA-256. `state` — независимое случайное значение, из `session_id` не выводится.
        - Пять неверных кодов закрывают сессию. Сессия живёт `expires_in` секунд (600) и одноразовая.
        - Токены нигде не хранятся и не логируются: в сессии лежит только id пользователя, пара создаётся в момент
          успешного `poll`. Значения `session_id`, `confirm_token`, `user_code` и `code` не пишутся в журнал API.
        - Используется только собственный VATSIM-клиент (`VATSIM_CLIENT_ID`/`VATSIM_REDIRECT_URI`) — переопределения
          `client_id`/`client_secret`/`redirect_uri`, как у `GET /auth/vatsim-init`, здесь нет и для device-state
          в `POST /auth/vatsim-callback` не принимаются.

        **Лимиты:** `init` — 10 запросов в минуту с одного IP; `confirm` — 30; `poll` — 300 с IP и не чаще
        одного раза в секунду на сессию (рекомендуемый `interval` — 2 секунды). Превышение — `429` с `Retry-After`.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                client: { type: string, maxLength: 32, example: wrsu, description: "Имя приложения — только для диагностики, на логику не влияет" }
                version: { type: string, maxLength: 32, example: "4.0.2", description: "Версия приложения — только для диагностики" }
      responses:
        '200':
          description: Сессия создана
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/DeviceLoginInitResult' } }
              example:
                success: true
                data:
                  session_id: "5b0c2e7d1f9a4c3b8e6d0a1f2c3b4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e"
                  user_code: "K7M2-X9QP"
                  url: "https://auth.vatsim.net/oauth/authorize?client_id=...&redirect_uri=...&response_type=code&scope=full_name+email&state=c1d2..."
                  expires_in: 600
                  interval: 2
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500':
          description: "Не настроен VATSIM OAuth-клиент (VATSIM_CLIENT_ID / VATSIM_REDIRECT_URI)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/vatsim-device/confirm:
    post:
      operationId: authVatsimDeviceConfirm
      tags: [Auth]
      summary: Подтвердить вход настольного приложения вводом кода (вызывает страница сайта)
      description: |
        Эту ручку вызывает **страница сайта**, а не приложение: после `POST /auth/vatsim-callback` (ответ с
        `device_login: true`) страница просит пользователя ввести код из окна приложения и отправляет его сюда
        вместе с `state` из адреса страницы и `confirm_token` из ответа callback.

        Без авторизации по JWT: вызов привязан к браузеру через `confirm_token`. Регистр и разделитель в
        `user_code` не важны (`k7m2 x9qp` = `K7M2-X9QP`). Неверный `confirm_token` попытки не тратит. Пять
        неверных кодов закрывают сессию — приложение получит `403` на `poll`. После успеха токены ещё не выданы:
        их приложению отдаст `poll`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, confirm_token, user_code]
              properties:
                state: { type: string, description: "`state` из адреса страницы (тот же, что был в `POST /auth/vatsim-callback`)", example: "c1d2e3f4...64 hex" }
                confirm_token: { type: string, description: "Из ответа `POST /auth/vatsim-callback`", example: "a9b8c7d6...64 hex" }
                user_code: { type: string, description: "Код, введённый пользователем с экрана приложения", example: "K7M2-X9QP" }
      responses:
        '200':
          description: Код верный, вход подтверждён
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/DeviceLoginConfirmResult' } }
              example: { success: true, data: { confirmed: true } }
        '400':
          description: "Не переданы или имеют неверный формат state / confirm_token / user_code"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, error: "state, confirm_token and user_code required" }
        '403':
          description: "Код неверный (в ответе `attempts_left`), попытки исчерпаны (сессия закрыта), либо `confirm_token` не тот"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceLoginCodeError' }
              examples:
                invalid_code: { value: { success: false, error: "Invalid code", attempts_left: 4 } }
                locked: { value: { success: false, error: "Too many wrong codes, start the login again in the application" } }
                bad_token: { value: { success: false, error: "Invalid confirmation token" } }
        '410':
          description: "Сессия не найдена, просрочена (10 минут) или уже подтверждена/закрыта — войти заново из приложения"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, error: "Login session expired or already used" }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/vatsim-device/poll:
    post:
      operationId: authVatsimDevicePoll
      tags: [Auth]
      summary: Опросить результат входа (приложение) и получить пару токенов
      description: |
        Приложение опрашивает ручку каждые `interval` секунд (из ответа `init`), пока не получит не-`202`.

        | Ответ | Значение |
        |---|---|
        | `202` | Вход ещё не завершён: пользователь не вошёл через VATSIM или не ввёл код |
        | `200` | `TokenPair`. **Ровно один раз** — сессия удаляется в момент выдачи |
        | `403` | Учётка деактивирована (рейтинг SUS/INA) либо код не подтверждён (пять неверных попыток) |
        | `410` | Сессия просрочена, уже использована, не существует, либо вход завершился ошибкой (VATSIM отверг код) — начать заново с `init` |
        | `429` | Слишком частый опрос: чаще раза в секунду на сессию либо превышен лимит с IP; см. `Retry-After` |

        Повторный `poll` после выдачи токенов, как и `poll` по неизвестному `session_id`, даёт `410`. Причина
        отказа (`403`/`410`) отдаётся один раз, затем сессия удаляется. Полученная пара — обычные access/refresh
        (`Authorization: Bearer`, `POST /auth/refresh`, `GET /users/me`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: { type: string, description: "Из ответа `POST /auth/vatsim-device/init`", example: "5b0c2e7d...64 hex" }
      responses:
        '200':
          description: Вход завершён, токены выданы (единственный раз)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/TokenPair' } }
              example:
                success: true
                data:
                  access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refresh_token: "9f3a1c2e...64 hex chars"
                  expires_in: 1800
        '202':
          description: Вход ещё не завершён — повторить через `interval` секунд
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/DeviceLoginPending' } }
              example: { success: true, data: { status: pending } }
        '400':
          description: "`session_id` не передан или имеет неверный формат (64 hex-символа)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, error: "session_id required" }
        '403':
          description: "Учётная запись деактивирована (SUS/INA) либо код не подтверждён"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                inactive: { value: { success: false, error: "Account is deactivated (SUS/INA rating)" } }
                not_confirmed: { value: { success: false, error: "Code was not confirmed" } }
        '410':
          description: "Сессия просрочена, уже использована, не найдена либо вход завершился ошибкой — начать заново"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                gone: { value: { success: false, error: "Login session expired or already used" } }
                failed: { value: { success: false, error: "Login failed, start again" } }
        '429':
          description: "Слишком частый опрос этой сессии либо превышен лимит запросов с IP"
          headers:
            Retry-After:
              description: Секунд до следующей попытки
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, error: "Too Many Requests" }

  # ============================= STUDENTS =============================
  /students:
    get:
      operationId: studentsList
      tags: [Students]
      summary: Список студентов (участники группы atc-students) с пагинацией и фильтром
      description: |
        Доступ: admin, `atc-instructors`, `atc-mentors`, `atc-senior-instructors`, `api-write-all`,
        `api-read-all`, `region-staff`, `staff`. Для `atc-instructors`/`atc-mentors` без более широкой
        группы результат жёстко ограничивается их FIR (по группе вида `ins-<fir>`, либо объединением
        нескольких — если он состоит сразу в нескольких): если `filter.UF_ATCTR_FIR` не передан — подставляется
        весь доступный actor'у список FIR; если передан — сужается до пересечения с этим списком (запрос FIR
        вне зоны доступа даёт пустой результат, а не игнорируется и не расширяет выдачу).

        Принимает внешний ключ сектора `students` (см. общий раздел "Внешние API-ключи").
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ActorQuery'
        - $ref: '#/components/parameters/Page'
        - name: pageSize
          in: query
          schema: { type: integer, default: 10 }
        - name: filter
          in: query
          description: Объект фильтра либо JSON-строка с ним
          schema:
            type: object
            properties:
              LOGIN: { type: string, description: "Начало логина (CID), без учёта регистра: `15253` найдёт `1525323` и `1525399`, но не `9152530`. Раньше искал подстроку в любом месте логина", example: "15253" }
              FULL_NAME: { type: string, description: "Поиск по имени и фамилии одной строкой, без учёта регистра (в том числе кириллицы). Строка делится по пробелам, и КАЖДОЕ слово должно встретиться как подстрока либо в имени, либо в фамилии: `петр` найдёт `Петров`, `иван петров` и `петров иван` — одного и того же человека. Не находит пользователей из `vatsim-data-protected` — их ФИО в выдаче скрыто (`null`). С остальными полями фильтра комбинируется по «И»", example: "иван петр" }
              UF_ATCTR_FIR: { type: string, description: "Код FIR либо несколько через запятую, например ULLL или UWWW,UUWV" }
              UF_ATCTR_ICAO: { type: string, description: "ICAO-код аэропорта" }
              UF_ATC_RATING: { type: string, description: "Название рейтинга, например S1" }
          style: deepObject
          explode: true
      responses:
        '200':
          description: Постранично, с допусками (roster) и последней активностью
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PaginationMeta'
                          - type: object
                            properties:
                              items:
                                type: array
                                items: { $ref: '#/components/schemas/StudentListItem' }
              example:
                success: true
                data:
                  items:
                    - id: 142
                      login: 1002030
                      name: Sergey
                      lastname: Ivanov
                      division: "RUS"
                      subdivision: null
                      atc_rating: S1
                      fir: { code: UUWV, name: { ru: "Москва", en: "Moscow" } }
                      airport: { code: UUEE, name: { ru: "Шереметьево", en: "Sheremetyevo" } }
                      atc_roster:
                        - id: 501
                          positions:
                            - { code: UUEE_APP, tier: null }
                          active: true
                          active_from: "2026-06-01T00:00:00+0000"
                          active_to: null
                          is_solo: false
                          is_guest: false
                          created_by: { id: 3, login: 1525323, name: Sergey, lastname: Bogdanov }
                      solo:
                        TWR: { spent: 12.5, available: 90 }
                        APP_DEP: { spent: 40, available: 105 }
                        CTR: { spent: 0, available: 90 }
                      last_atctr_activity: "2026-07-14T21:12:03+0300"
                  total: 37
                  page: 1
                  pageSize: 10
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Пользователь не в одной из разрешённых групп
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, error: "Access denied" }

  /students/{login}:
    get:
      operationId: studentsGet
      tags: [Students]
      summary: Карточка студента — допуски, экзамены, комментарии
      description: |
        Принимает внешний ключ сектора `students` (см. общий раздел "Внешние API-ключи").

        Доступна не только для ТЕКУЩИХ студентов (группа `atc-students`), но и для выпускников (группа
