  # ============================= ROSTER =============================
  /roster:
    get:
      operationId: rosterList
      tags: [Roster]
      summary: Ростер (допуски к позициям) по FIR, с пагинацией
      description: "Публичная ручка (токен не нужен), см. описание тега. Также принимает `X-Api-Key` внешнего ключа сектора `roster` + `actor` как необязательную альтернативу анониму."
      security: []
      parameters:
        - $ref: '#/components/parameters/ActorQuery'
        - name: fir
          in: query
          required: true
          schema: { type: string, example: ULLL }
        - $ref: '#/components/parameters/Page'
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: "Только активные записи (ACTIVE=Y); неизвестный код FIR — пустой результат, не ошибка"
          content:
            application/json:
              schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { allOf: [{ $ref: '#/components/schemas/PaginationMeta' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/RosterItemWithUser' } } } }] } } }] }
              example:
                success: true
                data:
                  items:
                    - id: 501
                      positions:
                        - { code: ULLL_S_APP, tier: null }
                      active: true
                      active_from: "2026-06-01T00:00:00+0000"
                      active_to: null
                      is_solo: false
                      is_guest: false
                      created_by: { id: 3, login: admin, name: Admin, lastname: "" }
                      user: { id: 142, login: 1002030, name: Sergey, lastname: Ivanov }
                  total: 12
                  page: 1
                  pageSize: 20
        '400':
          description: "Параметр fir не передан, либо (только при переданном X-Api-Key) actor не передан"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                missing_fir: { value: { success: false, error: "Missing required parameter: fir" } }
                missing_actor: { value: { success: false, error: "actor is required" } }
        '401': { description: "X-Api-Key передан, но не найден/не активен/не на сектор roster", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Invalid or missing API key" } } } }
        '404': { description: "actor с таким логином не найден (только при переданном X-Api-Key)", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "actor 'bad.login' not found" } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

    post:
      operationId: rosterCreate
      tags: [Roster]
      summary: Выдать допуск к позиции
      description: |
        FIR определяется от позиции (первая позиция группы → аэропорт позиции → FIR аэропорта). Требует
        членство в группе `ins-<fir>` (или admin/`edit_all_users`). `responsible` обязателен, если
        `is_guest=true`.

        `positions` — массив кодов позиций (GCAP 7.3(a): "a group of similar positions not to exceed
        five") — для постоянного (не соло) допуска ровно один код, для соло — от 1 до 5. Все позиции
        группы обязаны быть на одном FIR и с одним FACILITY (иначе `400`) — это и есть "similar positions".
        `position` (строка) принимается как алиас на массив из одного элемента — для обратной
        совместимости со старым форматом. Расширить уже выданную группу можно позже через
        `PATCH /roster/{id}/positions`.

        При `is_solo=true` действуют ограничения GCAP 7.3(c)/(e): `solo_days` обязателен; facility позиции
        должна поддерживать соло (`TWR`/`APP`/`DEP`/`CTR` — `APP` и `DEP` считаются одной "корзиной" для
        совокупного лимита, `CTR` — отдельной); разовая выдача — от 7 до 90 дней **без исключений, для
        всех**. Суммарная длительность всех соло-допусков пользователя на ту же корзину facility (включая
        уже отозванные/истёкшие) не может превышать 90 дней + одобренное продление для ЭТОГО студента на
        ЭТОМ бакете (GCAP 7.3(e) — Region VP может одобрить продление до 30 дней, см.
        `POST /roster/soloExtensionRequest`). Срок допуска (`DATE_ACTIVE_TO`) снимается автоматически часовым
        агентом по истечении; `active_to` в ответе виден всегда, в т.ч. пока допуск ещё активен (`null`, если
        срок не задан — постоянные/гостевые допуски) — см. `RosterItem`. У пользователя может быть активен
        только один соло-допуск одновременно (независимо от позиции/facility): выдача нового автоматически
        завершает (`active=false`, `active_to`=сейчас, `revoked_by`=вызывающий) все прочие активные
        соло-допуски этого пользователя — без ошибки, побочным эффектом.

        Рейтинг УВД пользователя обязан соответствовать facility позиции — **безусловно, без обхода**, ни
        для кого. Facility разбиты на уровни: `DEL`/`RMP`/`GND` → S1, `TWR` → S2, `DEP`/`APP` → S3,
        `CTR`/`FSS`/`RDO`/`TMU`/`FMP` → C1. Для постоянного (не соло) допуска рейтинг должен покрывать
        уровень facility целиком (`422`, если нет). Для соло — рейтинг должен покрывать хотя бы уровень на
        единицу ниже требуемого ("соло можно выдать на один уровень выше текущего рейтинга", `422`, если
        нет; проверяется до лимитов длительности). Выдача постоянного допуска попутно гасит (`active=false`,
        тем же побочным эффектом, что и выше) все активные соло-допуски пользователя на **тот же facility**
        — не только ту же позицию.

        Кеш ростера (и связанные с ним `atc_roster`/`solo` в `StudentsService`, см. `GET /students`) сбрасывается
        синхронно, изменения видны сразу в последующих запросах.

        Принимает внешний ключ сектора `roster` (см. общий раздел "Внешние API-ключи") — `actor` в теле.
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login]
              properties:
                login: { type: string, description: "Логин пользователя, получающего допуск", example: 1002030 }
                positions: { type: array, items: { type: string }, minItems: 1, maxItems: 5, description: "Коды позиций группы — 1 для постоянного допуска, 1-5 для соло; все на одном FIR и с одним FACILITY", example: [ULLL_S_APP] }
                position: { type: string, description: "Устаревший алиас на positions: [значение] — один код, для обратной совместимости", example: ULLL_S_APP }
                is_solo: { type: boolean, default: false }
                solo_days: { type: integer, description: "Обязателен при is_solo=true. 7–90, без исключений", example: 30 }
                is_guest: { type: boolean, default: false }
                responsible: { type: string, description: "Логин ответственного контроллера; обязателен при is_guest=true" }
                actor: { type: string, description: "Логин, от чьего имени выдаётся допуск — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key внешнего ключа, игнорируется при обычном Bearer JWT", example: i.petrov }
      responses:
        '200':
          description: Создан
          content:
            application/json:
              schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: object, properties: { id: { type: integer } } } } }] }
              example: { success: true, data: { id: 512 } }
        '400':
          description: "login/positions не переданы, позиция(и) не найдена, для постоянного допуска передано больше одной позиции, для соло — больше 5, позиции группы не на одном FIR/FACILITY, responsible не передан при is_guest=true, у позиции не задан FACILITY, facility неизвестен маппингу, либо нарушено одно из ограничений длительности соло-допуска (см. описание)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                missing_fields: { value: { success: false, error: "Field login is required" } }
                missing_positions: { value: { success: false, error: "Field positions is required" } }
                too_many_for_permanent: { value: { success: false, error: "A permanent (non-solo) grant may reference only one position" } }
                group_too_large: { value: { success: false, error: "A solo endorsement may cover at most 5 positions" } }
                fir_mismatch: { value: { success: false, error: "Position 'ULLL_N_APP' is in FIR 'UUWV', expected 'ULLL' — all positions of one endorsement must be in the same FIR" } }
                facility_mismatch: { value: { success: false, error: "Position 'ULLL_TWR' has FACILITY 'TWR', expected 'APP' — all positions of one endorsement must share FACILITY" } }
                facility_not_solo: { value: { success: false, error: "Solo endorsement is not applicable to facility 'GND'" } }
                missing_solo_days: { value: { success: false, error: "Field solo_days is required when is_solo is true" } }
                out_of_range: { value: { success: false, error: "Field solo_days must be between 7 and 90" } }
                cumulative_exceeded: { value: { success: false, error: "Cumulative solo duration for this facility would exceed 90 days (already used: 75)" } }
                no_facility: { value: { success: false, error: "Position has no FACILITY property set — cannot validate rating requirement" } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: "Нет прав на выдачу допуска в этой FIR", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: "Пользователь (login или responsible) не найден", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '422':
          description: "Рейтинг УВД пользователя не соответствует facility позиции (безусловная проверка, без обхода ни для кого)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                permanent_rating_too_low: { value: { success: false, error: "User's ATC rating does not meet the requirement for facility 'CTR'" } }
                solo_rating_too_low: { value: { success: false, error: "User's ATC rating is too low for a solo endorsement on facility 'CTR' (allowed at most one level above the current rating)" } }
        '500': { description: "Не удалось определить FIR по позиции, раздел ростера для FIR не найден, либо ошибка Bitrix", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /roster/{identifier}:
    get:
      operationId: rosterGet
      tags: [Roster]
      summary: Допуски конкретного пользователя
      description: |
        Публичная ручка (токен не нужен, см. описание тега) — раньше требовала авторизации, теперь
        принимает `X-Api-Key` внешнего ключа сектора `roster` + `actor` как необязательную альтернативу
        анониму (см. общий раздел "Внешние API-ключи"), передан — авторизует его по-настоящему.
      security: []
      parameters:
        - name: identifier
          in: path
          required: true
          description: "VATSIM CID (= LOGIN в Bitrix). Тот же сегмент пути у `DELETE /roster/{identifier}` — там это ID записи ростера"
          schema: { type: string }
          example: 1002030
        - $ref: '#/components/parameters/ActorQuery'
        - name: include_history
          in: query
          description: "Включить неактивные (отозванные) записи. Историчные записи видны только если у вызывающего есть право записи в соответствующий элемент — иначе молча пропускаются, без ошибки."
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: "Плоский массив, без пагинации"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/RosterItem' } } }
              example:
                success: true
                data:
                  - id: 501
                    positions:
                      - { code: ULLL_S_APP, tier: null }
                    active: true
                    active_from: "2026-06-01T00:00:00+0000"
                    active_to: "2026-08-30T00:00:00+0000"
                    is_solo: true
                    is_guest: false
                    created_by: { id: 3, login: admin, name: Admin, lastname: "" }
                  - id: 480
                    positions:
                      - { code: ULLL_TWR, tier: null }
                    active: false
                    active_from: "2026-01-01T00:00:00+0000"
                    active_to: "2026-05-30T00:00:00+0000"
                    is_solo: false
                    is_guest: false
                    created_by: { id: 3, login: admin, name: Admin, lastname: "" }
                    revoked_by: { id: 3, login: admin, name: Admin, lastname: "" }
        '400':
          description: "login не передан, либо (только при переданном X-Api-Key) actor не передан"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                missing_login: { value: { success: false, error: "Missing login parameter" } }
                missing_actor: { value: { success: false, error: "actor is required" } }
        '401': { description: "X-Api-Key передан, но не найден/не активен/не на сектор roster", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Invalid or missing API key" } } } }
        '404': { description: "actor с таким логином не найден (только при переданном X-Api-Key)", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "actor 'bad.login' not found" } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      operationId: rosterDelete
      tags: [Roster]
      summary: Отозвать допуск
      description: |
        Проверка прав отличается от `POST /roster`: там — явное членство в группе `ins-<fir>` раздела; здесь —
        нативные права Bitrix на конкретный элемент (`CHECK_PERMISSIONS='Y', MIN_PERMISSION='W'`, наследуемые от
        раздела FIR либо выданные точечно), в обоих случаях с обходом для admin/`edit_all_users`. Кеш ростера
        сбрасывается синхронно при отзыве, изменения видны сразу.

        Принимает внешний ключ сектора `roster` (см. общий раздел "Внешние API-ключи") — `actor` в теле.
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      parameters:
        - name: identifier
          in: path
          required: true
          description: "ID записи ростера (целое число; не CID). Тот же сегмент пути у `GET /roster/{identifier}` — там это CID пользователя"
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                actor: { type: string, description: "Логин, от чьего имени отзывается допуск — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key внешнего ключа, игнорируется при обычном Bearer JWT", example: i.petrov }
      responses:
        '200': { description: "Отозван (без data)", content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '400': { description: "id отсутствует/некорректен", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: "Нет прав на отзыв в этой FIR; при запросе с X-Api-Key — также FIR допуска вне ALLOWED_FIR ключа", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: "Запись ростера не найдена (или уже неактивна)", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Roster item not found" } } } }
        '500': { description: "Ошибка Bitrix при отзыве", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /roster/{id}/positions:
    patch:
      operationId: rosterSetPositions
      tags: [Roster]
      summary: Добавить позицию(и) в активный соло-допуск
      description: |
        Расширяет группу позиций уже выданного АКТИВНОГО СОЛО-допуска (GCAP 7.3(a): "a group of similar
        positions not to exceed five") — группа формируется не обязательно сразу целиком, инструктор может
        расширять её по мере тренировки, но не более 5 позиций суммарно. Новые позиции обязаны быть на том
        же FIR и с тем же FACILITY, что и уже имеющиеся в группе (иначе `400`).

        Срок допуска (`DATE_ACTIVE_TO`) НЕ пересчитывается, и лимиты 7-90/90 дней здесь не проверяются —
        это не новая выдача, а расширение состава уже существующей, ранее провалидированной группы на то же
        временное окно.

        Проверка прав — та же, что у `DELETE /roster/{identifier}` (нативные права Bitrix на элемент, обход для
        admin/`edit_all_users`). Принимает внешний ключ сектора `roster` (см. общий раздел "Внешние
        API-ключи") — `actor` в теле.
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [positions]
              properties:
                positions: { type: array, items: { type: string }, minItems: 1, description: "Коды добавляемых позиций", example: [ULLL_N_APP] }
                actor: { type: string, description: "Логин, от чьего имени добавляются позиции — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key внешнего ключа, игнорируется при обычном Bearer JWT", example: i.petrov }
      responses:
        '200': { description: "Добавлено (без data)", content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '400':
          description: "positions не переданы, допуск не соло, позиция(и) уже в группе, итог превысил бы 5, позиция не найдена, либо не на том же FIR/FACILITY, что и уже имеющаяся группа"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                missing_positions: { value: { success: false, error: "Field positions is required" } }
                not_solo: { value: { success: false, error: "Only a solo endorsement can have positions added to it" } }
                duplicate: { value: { success: false, error: "Position(s) already in this endorsement: ULLL_S_APP" } }
                group_too_large: { value: { success: false, error: "A solo endorsement may cover at most 5 positions" } }
                fir_mismatch: { value: { success: false, error: "Position 'UUWV_APP' is in FIR 'UUWV', expected 'ULLL' — all positions of one endorsement must be in the same FIR" } }
                facility_mismatch: { value: { success: false, error: "Position 'ULLL_TWR' has FACILITY 'TWR', expected 'APP' — all positions of one endorsement must share FACILITY" } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: "Нет прав на изменение этого допуска; при запросе с X-Api-Key — также FIR допуска вне ALLOWED_FIR ключа", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: "Допуск не найден/не активен, либо одна из добавляемых позиций не найдена", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Roster item not found" } } } }
        '500': { description: "Ошибка Bitrix при обновлении", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /roster/soloExtensionRequest:
    post:
      operationId: rosterCreateSoloExtensionRequest
      tags: [Roster]
      summary: Запросить продление совокупного лимита соло-допуска (GCAP 7.3(e))
      description: |
        Region VP (через представителей — стафф с правом «Активные соло-допуска») может одобрить
        продление совокупного 90-дневного лимита соло-допусков на facility-бакете (см. `POST /roster`)
        для конкретного студента на конкретном бакете — до 30 дней за раз. Эта ручка только СОЗДАЁТ
        запрос (`pending`); одобряет/отклоняет стафф в админке (не через API) — до решения на лимит
        студента запрос не влияет. На одну пару (студент, бакет) может быть подано и одобрено несколько
        запросов последовательно — их `extra_days` суммируются.

        Право на запрос — то же, что на выдачу соло-допуска на FIR этого студента (`ins-<fir>` или
        admin/`edit_all_users`); FIR берётся из профиля студента (`UF_ATCTR_FIR`), а не из позиции, —
        сам допуск на момент запроса может ещё не существовать. У пары (студент, бакет) не может быть
        больше одного необработанного (`pending`) запроса одновременно.

        Принимает внешний ключ сектора `roster` (см. общий раздел "Внешние API-ключи") — `actor` в теле.
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, bucket, extra_days]
              properties:
                login: { type: string, description: "Логин студента", example: 1002030 }
                bucket: { type: string, enum: [TWR, APP_DEP, CTR], description: "Facility-бакет, на который запрашивается продление" }
                extra_days: { type: integer, description: "1-30 (GCAP 7.3(e): до 30 дней за раз)", example: 15 }
                comment: { type: string, description: "Обоснование запроса (необязательно)" }
                actor: { type: string, description: "Логин, от чьего имени подаётся запрос — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key внешнего ключа, игнорируется при обычном Bearer JWT", example: i.petrov }
      responses:
        '200':
          description: Запрос создан со статусом pending
          content:
            application/json:
              schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: object, properties: { id: { type: integer } } } } }] }
              example: { success: true, data: { id: 7 } }
        '400':
          description: "login/bucket/extra_days не переданы или некорректны, у студента не назначен FIR, либо у пары (студент, бакет) уже есть необработанный запрос"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                missing_login: { value: { success: false, error: "Field login is required" } }
                invalid_bucket: { value: { success: false, error: "Field bucket must be one of the solo facility buckets (TWR, APP_DEP, CTR)" } }
                out_of_range: { value: { success: false, error: "Field extra_days must be between 1 and 30" } }
                no_fir: { value: { success: false, error: "Student has no FIR assigned" } }
                already_pending: { value: { success: false, error: "This student already has a pending extension request for this bucket" } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: "Нет прав на выдачу соло-допуска в FIR этого студента", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: "Студент не найден", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { description: "Ошибка Bitrix при создании запроса", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

