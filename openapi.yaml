                    properties:
                      id: { type: integer }
                      name: { type: string }
                      session_type: { type: string, nullable: true, description: "XML_ID значения списочного свойства TYPE (категория: t_checklist/p_checklist/p_exam/...), null если не заполнено" }
                  sort: { type: integer }
                  create_date: { type: string, format: date-time }
                  create_by: { $ref: '#/components/schemas/UserBrief' }
                  closed_date: { type: string, format: date-time, nullable: true }
                  closed_by: { type: object, allOf: [{ $ref: '#/components/schemas/UserBrief' }], nullable: true }
                  pass_status: { type: string }
                  mark: { type: string, nullable: true }

    UserFull:
      type: object
