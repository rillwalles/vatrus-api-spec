        pilots_rating: { type: string, nullable: true }
        fir: { type: object, allOf: [{ $ref: '#/components/schemas/FirRefLocalized' }], nullable: true }
        airport: { type: object, allOf: [{ $ref: '#/components/schemas/AirportRefLocalized' }], nullable: true }
        discord: { type: string, nullable: true, description: "UF_DISCORD как есть" }
        groups: { type: array, items: { type: string }, description: "STRING_ID групп" }

    NewsItem:
      type: object
