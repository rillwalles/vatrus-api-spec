        preview_text: { $ref: '#/components/schemas/LocalizedText' }
        detail_text: { $ref: '#/components/schemas/LocalizedText' }
        event:
          type: object
          properties:
            start: { type: string, format: date-time }
            finished: { type: string, format: date-time }
