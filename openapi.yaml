        lastname: { type: string, nullable: true, description: "null для чужой карточки, если пользователь в vatsim-data-protected (см. Приватность выше); GET /users/me — исключение, свою карточку видно без редактирования" }
        division: { type: string, nullable: true }
        subdivision: { type: string, nullable: true }
