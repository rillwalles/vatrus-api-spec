  /static/alerts/{code}:
    get:
      operationId: staticAlertsGet
      tags: [Static]
      summary: Оповещение по коду
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
          example: maintenance
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/StaticAlertItem' } } }]
              example:
                success: true
                data: { code: maintenance, text: { ru: "Плановые работы 20:00–22:00 MSK", en: "Scheduled maintenance 20:00–22:00 MSK" }, updated_at: "2026-01-15 12:00:00" }
        '400': { description: "code пуст", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: "Оповещение не найдено", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Alert not found" } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /static/stat:
    get:
      operationId: staticStatGet
      tags: [Static]
      summary: Сводная статистика дивизиона (публично, без авторизации)
      security: []
      description: |
        Все ключи, кроме `vatsim`, кешируются на 24 часа и дополнительно жёстко сбрасываются ежесуточным
        Bitrix-агентом в 00:00 UTC (`StatService::resetDailyCache()`) — не только по истечении TTL. `vatsim`
        досчитывается заново при каждом вызове поверх кешированного результата (таблица данных VATSIM
        пополняется агентом раз в 5 минут — суточный кеш ей противопоказан) и в кеш не попадает.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/StatisticsSummary' } } }]
              example:
                success: true
                data:
                  students: { total: 42, by_rating: { S1: 20, S2: 15, S3: 7 } }
                  controllers: 58
                  instructors: 11
                  supervisors: 3
                  pilots: { total: 210, by_rating: { PPL: 120, IR: 50, CMEL: 30, ATPL: 10 } }
                  new_registrations: 14
                  total_users: 640
                  vatsim: { flights: 87, pilots_online: 62, atc_online: 9 }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ============================= WEATHER =============================
  /metar/{airportCode}:
    get:
      operationId: metarGet
      tags: [Weather]
      summary: METAR/TAF аэродрома
      description: |
        Публичная ручка, без авторизации. По умолчанию отдаёт сохранённое агентом (обновляется раз в 30
        минут, слоты `:05`/`:35` каждого часа — см. описание тега, только для аэродромов дивизиона).
        `?refresh=1` — принудительный внеочередной опрос ИМЕННО этого аэродрома у источника перед ответом
        (не всего дивизиона) — ждать ближайшего слота агента не нужно. Источник не ответил (сеть, станция
        молчит) — не трогает сохранённое и просто отдаёт его же (частичное/устаревшее лучше отсутствия).

        **Без `?refresh=1`, если сохранённых данных нет вообще** (аэродром вне дивизиона, по которому ещё
        ни разу не запрашивали `?refresh=1`, либо запись протухла и была удалена, см. ниже) — ручка САМА
        один раз опрашивает источник вместо голого `404` (тот же эффект, что явный `?refresh=1`); `404`
        возвращается, только если и этот живой опрос ничего не дал. Так первый же запрос по любому
        аэродрому в мире отдаёт данные, не требуя заранее знать про `?refresh=1`.

        **`?refresh=1` (и этот неявный fallback) работает для ЛЮБОГО ICAO-кода в мире, не только дивизиона**
        — результат сохраняется, поэтому следующий обычный `GET` отдаст его сразу. Такая строка сама не
        обновляется регулярным агентом (только повторным живым опросом по тому же коду) и удаляется, если
        не запрашивалась дольше 24 часов.

        Общий лимит запросов по IP — см. раздел "Rate limiting". Любой РЕАЛЬНЫЙ опрос источника — явный
        `?refresh=1` ИЛИ неявный fallback при отсутствии сохранённого — идёт через один и тот же отдельный,
        более жёсткий лимит СВЕРХ общего: **5 запросов / 60 секунд на пару (IP, аэродром)** (эта ветка бьёт
        наружу, в aviationweather.gov, накрутка рискует поймать бан IP модуля у источника); свой `429` (не
        через общий responses `TooManyRequests`, текст другой) с тем же заголовком `Retry-After`.
      security: []
      parameters:
        - name: airportCode
          in: path
          required: true
          schema: { type: string }
          example: UUEE
        - name: refresh
          in: query
          description: "1 — принудительный внеочередной опрос именно этого аэродрома перед ответом"
          schema: { type: string, enum: ["1"] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/WeatherReport' } } }] }
              example:
                success: true
                data:
                  airport_code: UUEE
                  metar: { raw: "UUEE 251230Z 25004MPS 210V290 9999 FEW020 22/14 Q1015 NOSIG", time: "2026-09-25T12:30:00+0000" }
                  taf: { raw: "TAF UUEE 251100Z 2512/2618 25005MPS 9999 FEW020", time: "2026-09-25T11:00:00+0000" }
                  fetched_at: "2026-09-25T13:03:00+0000"
        '400': { description: "airportCode отсутствует", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Missing required parameter: airportCode" } } } }
        '404': { description: "Ни сохранённых данных, ни живой опрос источника (сделанный самой ручкой при их отсутствии) ничего не дал", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Weather data for this airport not found" } } } }
        '429':
          description: "Общий лимит (см. раздел \"Rate limiting\"), либо отдельный лимит 5/60с на (IP, аэродром) — при явном ?refresh=1 или при неявном живом опросе, когда сохранённых данных не нашлось"
          headers:
            Retry-After: { description: Секунд до конца текущего окна, schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                general: { value: { success: false, error: "Too Many Requests" } }
                refresh: { value: { success: false, error: "Too Many Requests: refresh reserved for this airport is used up, try again later" } }

  # ============================= BOOKINGS =============================
  /bookings:
    get:
      operationId: bookingsList
      tags: [Bookings]
      summary: Актуальные букинги дивизиона (опционально — конкретного ивента)
      description: |
        Публичная ручка (токен не нужен — сами букинги и так открыты на `atc-bookings.vatsim.net`).
        **Без параметров** — все актуальные букинги дивизиона RUS (`end` не раньше текущего момента, прошедшие
        не возвращаются), по возрастанию времени начала. Список берётся у VATSIM и кешируется на 60 секунд;
        создание/удаление через `POST`/`DELETE /bookings` сбрасывают кеш. Поле `news` — ID новости, под которую
        букинг был подан через наш API (по `BookingLog`), `null` — букинг подан не под ивент либо напрямую на
        `atc-bookings.vatsim.net`.

        **С параметром `news`** (необязательный, ID элемента инфоблока `news`) — только букинги этого ивента.
        Источник списка `booking_id` — внутренний `BookingLog` (единственное место, где вообще известна
        привязка букинга к новости — у самого VATSIM API понятия "ивент" нет); источник того, какие из них
        ЕЩЁ СУЩЕСТВУЮТ — живой запрос к VATSIM (`GET /booking`, дивизион RUS): букинг, удалённый в обход
        `DELETE /bookings/{id}` (старая admin-страница, напрямую на `atc-bookings.vatsim.net`), просто не
        попадёт в текущий список VATSIM — `BookingLog` на строку `deleted` отдельно не проверяется, это не
        нужно. **Несуществующий `news` не ошибка** — просто пустой список (привязки проверяются только на
        `POST`, здесь — нет).
      security: []
      parameters:
        - name: news
          in: query
          required: false
          schema: { type: string }
          description: "ID элемента инфоблока news — оставить только букинги этого ивента"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/BookingItem' } }
              example:
                success: true
                data:
                  - { id: 501, callsign: ULLL_S_APP, cid: 1002030, type: event, start: "2026-07-20 15:30:00", end: "2026-07-20 17:00:00", division: RUS, news: "42" }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { description: "VATSIM Bookings API недоступен/вернул ошибку", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

    post:
      operationId: bookingsCreate
      tags: [Bookings]
      summary: Массово создать букинги УВД
      description: |
        См. правила доступа в описании тега. Строки обрабатываются НЕЗАВИСИМО — ответ всегда `200`
        (если прошла проверка типа и общих прав), результат по каждой строке — в `created`/`errors`.
        Полностью пустая строка (все 4 обязательных поля пустые) молча пропускается (не ошибка, не
        попадает ни в `created`, ни в `errors`) — защита от лишней строки bulk-формы; ЧАСТИЧНО заполненная
        — ошибка. `start`/`end` принимают `"YYYY-MM-DDTHH:MM"` (datetime-local) или `"YYYY-MM-DD HH:MM:SS"`.

        `news` в строке — опциональная привязка к ивенту (ID элемента `news`, тот же, что в
        `GET /bookings?news=`): если указан, позиция строки (её `callsign`) ОБЯЗАНА быть в одном из FIR,
        участвующих в этом ивенте (свойство `FIRS` новости — то же, что фильтр `fir_codes` у `GET /news`),
        иначе построчная ошибка. `created`-объекты в ответе **этого** эндпоинта поле `news` НЕ несут (оно
        только внутреннее, в `BookingLog`) — в отличие от `GET /bookings?news=`, где оно есть у каждого
        элемента.

        Сообщения `errors[].message` — **на русском**, см. тег.
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, rows]
              properties:
                type: { type: string, enum: [booking, event, exam, mentoring] }
                rows:
                  type: array
                  items:
                    type: object
                    properties:
                      cid: { type: string, description: "VATSIM CID (= логин) пользователя, за которого создаётся букинг", example: "1002030" }
                      callsign: { type: string, description: "CODE позиции (инфоблок positions)", example: ULLL_S_APP }
                      start: { type: string, example: "2026-07-20T15:30" }
                      end: { type: string, example: "2026-07-20T17:00" }
                      subdivision: { type: string, description: "Опционально" }
                      news: { type: string, description: "Опционально — ID новости-ивента, см. описание операции. callsign строки обязан быть в одном из FIR ивента", example: "42" }
                actor: { type: string, description: "Логин, от чьего имени создаются букинги — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key, игнорируется при обычном Bearer JWT", example: i.petrov }
      responses:
        '200':
          description: "Всегда 200, если прошли общие проверки — результат по строкам в created/errors"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          created: { type: array, items: { $ref: '#/components/schemas/BookingItem' }, description: "Booking-объект VATSIM API как есть — без поля news (см. описание операции)" }
                          errors:
                            type: array
                            items:
                              type: object
                              properties:
                                row: { type: integer, description: "Номер строки в rows, 1-based" }
                                message: { type: string, description: "На русском" }
              example:
                success: true
                data:
                  created:
                    - { id: 501, callsign: ULLL_S_APP, cid: 1002030, type: booking, start: "2026-07-20 15:30:00", end: "2026-07-20 17:00:00", division: RUS }
                  errors:
                    - { row: 2, message: "CID «abc» должен быть числом" }
                    - { row: 3, message: "Позиция «ULLL_S_APP» вне РПИ ивента (допустимые: UUWV, UIII)" }
        '400':
          description: "type не из допустимого набора, либо rows не массив"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, error: "Недопустимый тип букинга: foo" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: "Actor не состоит ни в vatrus-users, ни в одной из групп, допускающих создание за других — ПОЛНЫЙ отказ, строки не разбираются вовсе"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, error: "Нет прав на создание букингов" }

  /bookings/{id}:
    delete:
      operationId: bookingsDelete
      tags: [Bookings]
      summary: Удалить букинг УВД
      description: "См. правила доступа в описании тега."
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                actor: { type: string, description: "Логин, от чьего имени удаляется букинг — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key, игнорируется при обычном Bearer JWT", example: i.petrov }
      responses:
        '200': { description: Удалён, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: "Нет ни capability BOOKINGS, ни cid-владения, ни зафиксированного в BookingLog создательства (при наличии нужной группы)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, error: "Нет прав на удаление этого букинга" }
        '404': { description: Букинг с таким ID не найден (в VATSIM API), content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Booking not found" } } } }
        '502': { description: "VATSIM Bookings API недоступен/вернул ошибку", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  # ============================= TRAINING REQUESTS =============================
  /trainingrequests:
    get:
      operationId: trainingRequestsList
      tags: [TrainingRequests]
      summary: Список заявок на обучение, видимых вызывающему (с пагинацией)
      description: |
        `CHECK_PERMISSIONS=Y` — видны только заявки, на которые у вызывающего есть право чтения элемента
        (см. описание тега). Обычная пагинация `items`/`total`/`page`/`pageSize`.
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ActorQuery'
        - $ref: '#/components/parameters/Page'
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: fir
          in: query
          description: "Код FIR — сужает список до заявок этой FIR (у заявок без выбранного РПИ это свойство пусто, поэтому они не попадут в такой фильтр). Неизвестный код — пустой результат, не ошибка"
          schema: { type: string }
          example: UUWV
        - name: ntp1_passed
          in: query
          description: "yes/true/1 — только заявители, сдавшие хотя бы одну попытку ntp_1 (ntp1.passed=true); любое другое значение — только НЕ сдавшие. Не передан — без фильтра"
          schema: { type: string }
          example: "yes"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { allOf: [{ $ref: '#/components/schemas/PaginationMeta' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/TrainingRequestItem' } } } }] } } }]
              example:
                success: true
                data:
                  items:
                    - id: 301
                      applicant: { id: 220, login: n.sidorov, name: Николай, lastname: Сидоров }
                      created_time: "2026-07-17T10:00:00+0300"
                      fir: null
                      airport: null
                      accepted_by: null
                      accepted_time: null
                      closed_by: null
                      closed_time: null
                      comment: ""
                      ntp1:
                        passed: false
                        attempts:
                          - id: 1501
                            result: fail1
                            mark: "2.00"
                            start_time: "2026-07-17T10:05:00+0000"
                            finish_time: "2026-07-17T10:20:00+0000"
                  total: 1
                  page: 1
                  pageSize: 20
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { description: "Инфоблок atctrequests не найден", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

    post:
      operationId: trainingRequestsCreate
      tags: [TrainingRequests]
      summary: Подать заявку на обучение
      description: |
        Заявитель должен состоять в группе `vatrus-users` и не иметь незакрытой/уже одобренной заявки
        (группы `atc-applicants`/`atc-students`/`atc-graduates`) — иначе `403`. Группа `atc-applicants`
        назначается заявителю сразу при подаче. РПИ/аэропорт на этом шаге НЕ указываются (раньше были
        обязательны) — заявитель выбирает их позже, после сдачи письменного зачёта ntp_1, см.
        `PATCH .../fir` и описание тега. Выставляет индивидуальные права Bitrix на созданный элемент — см.
        описание тега.

        Принимает внешний ключ сектора `trainingrequests` (см. общий раздел "Внешние API-ключи") — `actor` в теле.
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                actor: { type: string, description: "Логин, от чьего имени подаётся заявка — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key внешнего ключа, игнорируется при обычном Bearer JWT", example: i.petrov }
      responses:
        '200':
          description: Создана
          content:
            application/json:
              schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: object, properties: { id: { type: integer } } } } }] }
              example: { success: true, data: { id: 301 } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: "Заявитель не состоит в vatrus-users, либо уже подавал заявку и она не закрыта отклонением"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_eligible: { value: { success: false, error: "Access denied" } }
                already_pending: { value: { success: false, error: "You already have a pending or completed training request" } }
        '500': { description: "Ошибка Bitrix при создании элемента", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /trainingrequests/{id}/fir:
    patch:
      operationId: trainingRequestsSelectFir
      tags: [TrainingRequests]
      summary: Выбрать РПИ и аэропорт обучения (абитуриент, после сдачи ntp_1)
      description: |
        Самостоятельный шаг заявителя — не инструктора (ту же заявку позже может скорректировать инструктор
        через `PATCH .../accept`, см. там). Доступен только автору заявки (`CREATED_BY`), только пока заявка
        не принята (`accept`), и только если у него есть хотя бы одна сданная попытка письменного зачёта
        `ntp_1` (`result` = `pass`/`appeal_pass`) — иначе `403`. Проставляет `fir`/`airport` на заявке,
        перевыставляет индивидуальные права элемента на `ins-<fir>` ВЫБРАННОГО РПИ (см. описание тега — до
        этого заявку видели только `region-staff`/`atc-senior-instructors`/`staff`/`admins` и сам заявитель,
        после — ещё и инструкторы/менторы именно этого РПИ), и сразу синхронизирует реальные поля профиля
        заявителя `UF_ATCTR_FIR`/`UF_ATCTR_ICAO` (не дожидаясь `accept`). Можно вызывать повторно (передумать
        и выбрать другой РПИ/аэропорт), пока заявка не принята.

        Принимает внешний ключ сектора `trainingrequests` (см. общий раздел "Внешние API-ключи") — `actor` в теле.
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fir, airport]
              properties:
                fir: { type: string, description: "Код FIR", example: UUWV }
                airport: { type: string, description: "ICAO-код аэропорта", example: UUEE }
                actor: { type: string, description: "Логин заявителя — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key внешнего ключа, игнорируется при обычном Bearer JWT", example: i.petrov }
      responses:
        '200': { description: "РПИ/аэропорт выбраны (без data)", content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '400':
          description: "id некорректен, fir/airport не переданы, аэропорт не относится к указанной FIR, либо заявка уже принята"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                missing: { value: { success: false, error: "fir and airport are required" } }
                mismatch: { value: { success: false, error: "Selected airport does not belong to the specified FIR" } }
                already_accepted: { value: { success: false, error: "Training request is already accepted — FIR can now only be changed by an instructor (accept) or via a transfer request" } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: "Вызывающий не автор заявки, либо ntp_1 ещё не сдан"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_owner: { value: { success: false, error: "Access denied" } }
                not_passed: { value: { success: false, error: "Written exam (ntp_1) must be passed before selecting FIR/airport" } }
        '404':
          description: "Заявка (активная), FIR или аэропорт не найдены"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                fir: { value: { success: false, error: "FIR 'ZZZZ' not found" } }
                airport: { value: { success: false, error: "Airport 'ZZZZ' not found" } }
        '500': { description: "Ошибка Bitrix при обновлении FIR/аэропорта заявки или синхронизации профиля пользователя", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /trainingrequests/{id}:
    get:
      operationId: trainingRequestsGet
      tags: [TrainingRequests]
      summary: Заявка на обучение по ID
      description: |
        Тот же формат полей, что и в списке. Без фильтра по `ACTIVE` — заявка доступна по ID независимо от
        того, ещё она открыта или уже закрыта (`accept`/`reject`/автозакрытие, см. описание тега). Видимость —
        та же нативная модель прав, что и в `GET /trainingrequests` (`CHECK_PERMISSIONS`); "не найдено" и "нет
        прав" неразличимы снаружи — оба `404`, чтобы не палить существование чужой заявки.
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/ActorQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/TrainingRequestItem' } } }] }
              example:
                success: true
                data:
                  id: 298
                  applicant: { id: 219, login: p.orlov, name: Пётр, lastname: Орлов }
                  created_time: "2026-07-10T09:00:00+0300"
                  fir: { code: UUWV, name: { ru: "Москва", en: Moscow } }
                  airport: { code: UUEE, name: { ru: "Шереметьево", en: Sheremetyevo } }
                  accepted_by: { id: 55, login: a.smith, name: Alice, lastname: Smith }
                  accepted_time: "2026-07-10T12:00:00+0000"
                  closed_by: { id: 55, login: a.smith, name: Alice, lastname: Smith }
                  closed_time: "2026-07-12T15:00:00+0000"
                  comment: ""
                  ntp1:
                    passed: true
                    attempts:
                      - id: 1498
                        result: nopass
                        mark: "2.80"
                        start_time: "2026-07-09T08:00:00+0000"
                        finish_time: "2026-07-09T08:30:00+0000"
                      - id: 1502
                        result: pass
                        mark: "4.60"
                        start_time: "2026-07-10T08:00:00+0000"
                        finish_time: "2026-07-10T08:25:00+0000"
        '400': { description: "id отсутствует/некорректен", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: "Заявка не найдена, либо у вызывающего нет прав на её чтение", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Training request not found" } } } }

  /trainingrequests/archive:
    get:
      operationId: trainingRequestsArchiveList
      tags: [TrainingRequests]
      summary: Архив закрытых заявок (ACTIVE=N), с пагинацией
      description: "Доступ только группам `atc-senior-instructors`, `region-staff`, `admins`. Обычная пагинация `items`/`total`/`page`/`pageSize`."
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/ActorQuery'
        - $ref: '#/components/parameters/Page'
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { allOf: [{ $ref: '#/components/schemas/PaginationMeta' }, { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/TrainingRequestItem' } } } }] } } }]
              example:
                success: true
                data:
                  items:
                    - id: 298
                      applicant: { id: 219, login: p.orlov, name: Пётр, lastname: Орлов }
                      created_time: "2026-07-10T09:00:00+0300"
                      fir: { code: UUWV, name: { ru: "Москва", en: Moscow } }
                      airport: { code: UUEE, name: { ru: "Шереметьево", en: Sheremetyevo } }
                      accepted_by: { id: 55, login: a.smith, name: Alice, lastname: Smith }
                      accepted_time: "2026-07-10T12:00:00+0000"
                      closed_by: { id: 55, login: a.smith, name: Alice, lastname: Smith }
                      closed_time: "2026-07-12T15:00:00+0000"
                      comment: ""
                      ntp1: { passed: true, attempts: [{ id: 1502, result: pass, mark: "4.60", start_time: "2026-07-10T08:00:00+0000", finish_time: "2026-07-10T08:25:00+0000" }] }
                  total: 1
                  page: 1
                  pageSize: 20
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: "Вызывающий не входит в atc-senior-instructors/region-staff/admins", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Access denied" } } } }
        '500': { description: "Инфоблок atctrequests не найден", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /trainingrequests/{id}/accept:
    patch:
      operationId: trainingRequestsAccept
      tags: [TrainingRequests]
      summary: Принять заявку в работу
      description: |
        Доступ только группам-акторам (см. описание тега); проверка по FIR — членство в `ins-<fir>` целевой
        FIR, обходится для `atc-senior-instructors`. Требует, чтобы заявитель уже САМ выбрал РПИ через
        `PATCH .../fir` (т.е. у заявки уже есть `fir`) — иначе `400`, независимо от того, передан ли `fir` в
        теле этого запроса (нельзя обойти требование сдачи ntp_1, явно указав целевой FIR здесь при первом
        принятии). `fir`/`airport` в теле опциональны и используются ТОЛЬКО для корректировки уже выбранного
        значения — если не переданы, используются текущие значения заявки. Если FIR/аэропорт меняются, права
        элемента (`ins-<fir>`) перевыставляются на новую FIR, а реальные поля профиля заявителя
        `UF_ATCTR_FIR`/`UF_ATCTR_ICAO` синхронизируются с новым значением (вызывается при каждом `accept`,
        не только при реальном изменении — самоисцеляет профиль, если предыдущая синхронизация не удалась).
        Дополнительно проверяет, не сдал ли абитуриент уже всю вводную программу обучения — если да, заявка
        тут же автоматически закрывается как принятая (см. "Автоматическое закрытие" в описании тега), без
        отдельного вызова `PATCH .../close`.

        Можно вызвать повторно на уже принятой заявке — именно так и правится FIR/аэропорт постфактум;
        `TrainingRequestItem.accepted_by`/`accepted_time` при этом НЕ перезаписываются (остаются от самого
        первого принятия) — повторный вызов меняет только `fir`/`airport`.

        Принимает внешний ключ сектора `trainingrequests` (см. общий раздел "Внешние API-ключи") — `actor` в теле.
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fir: { type: string, description: "Код FIR; если передан — заменяет FIR заявки" }
                airport: { type: string, description: "ICAO-код аэропорта; если передан — заменяет аэропорт заявки" }
                actor: { type: string, description: "Логин, от чьего имени принимается заявка — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key внешнего ключа, игнорируется при обычном Bearer JWT", example: i.petrov }
      responses:
        '200': { description: "Принята (без data)", content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '400':
          description: "id отсутствует/некорректен, итоговый аэропорт не относится к целевой FIR, либо заявитель ещё не выбрал РПИ через PATCH .../fir"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                mismatch: { value: { success: false, error: "Selected airport does not belong to the target FIR" } }
                no_fir_yet: { value: { success: false, error: "Training request has no FIR yet — applicant must select FIR/airport first (PATCH /trainingrequests/{id}/fir)" } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: "Вызывающий не входит в группы-акторы, либо заявка вне его FIR"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_actor: { value: { success: false, error: "Access denied" } }
                wrong_fir: { value: { success: false, error: "Access denied: request is outside your FIR" } }
        '404':
          description: "Заявка (активная), FIR или аэропорт не найдены"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, error: "Training request not found" }
        '500': { description: "Не удалось обновить FIR/аэропорт заявки, либо синхронизировать профиль заявителя (ошибка Bitrix)", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /trainingrequests/{id}/close:
    patch:
      operationId: trainingRequestsClose
      tags: [TrainingRequests]
      summary: Закрыть заявку (принять обучение или отклонить)
      description: |
        Принятую (`accept`) заявку закрывают группы-акторы (см. описание тега). **Непринятую** заявку
        (например, абитуриент так и не сдал ntp_1 или не выбрал РПИ — `accept` для неё невозможен) может
        закрыть только член стаффа с правом «Переводы студентов и выпускников» (`student_transfers`; `admins`
        проходят автоматически) и только отказом: `action=reject` с обязательным `comment`, иначе `400`;
        без права — `403`. При `action=accept` заявителю добавляется группа
        `atc-students`; в обоих случаях снимается группа `atc-applicants`. При `action=reject` `comment`
        обязателен и сохраняется как `PREVIEW_TEXT` элемента; дополнительно сбрасываются реальные поля
        профиля заявителя `UF_ATCTR_FIR`/`UF_ATCTR_ICAO` (выставленные ранее через `PATCH .../fir`) — после
        отказа заявитель снова "без РПИ", как при подаче новой заявки. Права — те же, что у `accept`.

        Принимает внешний ключ сектора `trainingrequests` (см. общий раздел "Внешние API-ключи") — `actor` в теле.
      security:
        - bearerAuth: []
        - externalApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [accept, reject] }
                comment: { type: string, description: "Обязателен при action=reject" }
                actor: { type: string, description: "Логин, от чьего имени закрывается заявка — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key внешнего ключа, игнорируется при обычном Bearer JWT", example: i.petrov }
      responses:
        '200': { description: "Закрыта (без data)", content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '400':
          description: "id некорректен, action не accept/reject, comment не передан при reject, либо непринятую заявку пытаются закрыть не отказом"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_accepted_not_reject: { value: { success: false, error: "A request that has not been accepted can only be rejected (action \"reject\")" } }
                bad_action: { value: { success: false, error: "Field action must be \"accept\" or \"reject\"" } }
                missing_comment: { value: { success: false, error: "Field comment is required when rejecting" } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: "Принятая заявка: вызывающий не входит в группы-акторы, либо заявка вне его FIR. Непринятая заявка: у вызывающего нет права student_transfers"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { success: false, error: "A request that has not been accepted can only be closed by staff with the student transfers capability" }
        '404': { description: "Заявка (активная) не найдена", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { success: false, error: "Training request not found" } } } }
        '500': { description: "Ошибка Bitrix при закрытии элемента", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access-токен из /auth/login, /auth/refresh или /auth/vatsim-callback. TTL 30 минут."
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: "Только для GET /common/lists-values. Статический ключ, сверяется с SERVICE_API_KEY из .env (hash_equals). Backend-to-backend, не привязан к пользователю Bitrix."
    externalApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        Авторизация от имени пользователя для сторонних интеграций — АЛЬТЕРНАТИВА `bearerAuth`, не замена
        (см. раздел "Внешние API-ключи" в общем описании API и теги `News`/`Students`/`Roster`/`Exams`/
        `Comments`). Тот же заголовок `X-Api-Key`, что у `apiKeyAuth`, но другой смысл: ключ хранится в
        инфоблоке `api_keys` (не переменной окружения), выдаётся на один или несколько СЕКТОРОВ API
        (`students`/`news`/`exams_comments`/`roster`) и не привязан ни к какому пользователю Bitrix — поэтому
        обязателен `actor` (логин), от чьего имени выполняется действие (`?actor=` в query для `GET`, поле
        `actor` в теле для остальных методов). Права проверяются ЦЕЛИКОМ для `actor` — он реально
        авторизуется в `global $USER` на время запроса, как и обычный JWT.

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    ActorQuery:
      name: actor
      in: query
      description: "Логин, от чьего имени выполняется запрос — ОБЯЗАТЕЛЕН при авторизации через X-Api-Key внешнего ключа (см. общий раздел \"Внешние API-ключи\"), игнорируется при обычном Bearer JWT"
      schema: { type: string }
      example: i.petrov
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }
    IdentifierPath:
      name: identifier
      in: path
      required: true
      description: "Числовой Bitrix ID либо буквенный код (FIR/ICAO)"
      schema: { type: string }
    AllAirportsQuery:
      name: all
      in: query
      description: >
        all=yes — включить в выдачу аэропорты без настоящего названия (у которых NAME совпадает с CODE,
        т.е. название при заведении элемента не заполнялось). По умолчанию такие аэропорты скрыты.
      schema: { type: string, enum: [yes] }
    LoginPath:
      name: login
      in: path
      required: true
      description: "VATSIM CID / Bitrix LOGIN"
      schema: { type: string }
      example: 1002030

  responses:
    Unauthorized:
      description: "Токен отсутствует, невалиден, просрочен, либо пользователь деактивирован"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            missing: { value: { success: false, error: "Missing authorization token" } }
            expired: { value: { success: false, error: "Token expired" } }
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, error: "Access denied" }
    BadRequest:
      description: Некорректные входные данные
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: "Превышен лимит запросов с этого IP на этот маршрут (см. общий раздел \"Rate limiting\")"
      headers:
        Retry-After:
          description: Секунд до конца текущего окна
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, error: "Too Many Requests" }

  schemas:
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        error: { type: string }
      required: [success, error]

    SuccessEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
      required: [success]

    TokenPair:
      type: object
      properties:
        access_token: { type: string, description: "JWT, TTL 1800 сек" }
        refresh_token: { type: string, description: "64-символьная hex-строка, TTL 7 дней, одноразовая" }
        expires_in: { type: integer, example: 1800 }

    DeviceLoginInitResult:
      type: object
      required: [session_id, user_code, url, expires_in, interval]
      properties:
        session_id: { type: string, description: "Секрет приложения (64 hex, 256 бит). Только для `poll`; на сайт не передавать и не логировать" }
        user_code: { type: string, example: "K7M2-X9QP", description: "Код XXXX-XXXX без похожих символов (нет 0/O/1/I). Показать в окне приложения — пользователь вводит его на сайте" }
        url: { type: string, format: uri, description: "Ссылка VATSIM authorize со `state`, привязанным к сессии. Открыть в системном браузере" }
        expires_in: { type: integer, example: 600, description: "Время жизни сессии, секунд" }
        interval: { type: integer, example: 2, description: "Рекомендуемый интервал опроса `poll`, секунд" }

    DeviceLoginCallbackResult:
      type: object
      description: "Ответ `POST /auth/vatsim-callback` для `state` device-сессии — вместо `TokenPair`"
      required: [device_login, confirm_token, expires_in]
      properties:
        device_login: { type: boolean, enum: [true], description: "Признак device-входа: токенов в ответе нет, нужно показать ввод кода" }
        confirm_token: { type: string, description: "Секрет этого браузера (64 hex): передать в `POST /auth/vatsim-device/confirm`" }
